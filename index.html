function sind(d){return Math.sin(d*Math.PI/180);}
function fullMoonJDE(k){
  let T=k/1236.85;
  let JDE=2451550.09766+29.530588861*k+0.00015437*T*T;
  let E=1-0.002516*T,M=2.5534+29.10535670*k,Mp=201.5643+385.81693528*k,F=160.7108+390.67050284*k,Om=124.7746-1.56375588*k;
  let c=-0.40614*sind(Mp)+0.17302*E*sind(M)+0.01614*sind(2*Mp)+0.01043*sind(2*F)+0.00734*E*sind(Mp-M)-0.00515*E*sind(Mp+M)+0.00209*E*E*sind(2*M)-0.00111*sind(Mp-2*F)-0.00057*sind(Mp+2*F)+0.00056*E*sind(2*Mp+M)-0.00042*sind(3*Mp)+0.00042*E*sind(M+2*F)+0.00038*E*sind(M-2*F)-0.00024*E*sind(2*Mp-M)-0.00017*sind(Om);
  return JDE+c;
}
function jdToDate(jd){
  jd+=0.5;let Z=Math.floor(jd),F=jd-Z,A=Z;
  if(Z>=2299161){let al=Math.floor((Z-1867216.25)/36524.25);A=Z+1+al-Math.floor(al/4);}
  let B=A+1524,C=Math.floor((B-122.1)/365.25),D=Math.floor(365.25*C),E=Math.floor((B-D)/30.6001);
  let dayF=B-D-Math.floor(30.6001*E)+F,month=E<14?E-1:E-13,yr=month>2?C-4716:C-4715;
  return{y:yr,m:month,d:Math.floor(dayF)};
}
const moonCache={};
function getFullMoons(y){
  if(moonCache[y])return moonCache[y];
  let result=[],kStart=Math.floor((y-2000)*12.3685)-2,dT=69/86400;
  for(let i=0;i<17;i++){
    let k=kStart+i+0.5,jdUTC=fullMoonJDE(k)-dT;
    let dt=jdToDate(jdUTC+1/24);
    if(dt.y===y)result.push({m:dt.m-1,d:dt.d});
  }
  moonCache[y]=result;return result;
}
function isFullMoon(m,d,y){return getFullMoons(y).some(f=>f.m===m&&f.d===d);}

function getISOWeek(date){
  let d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  let day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);
  let ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d-ys)/86400000)+1)/7);
}
function getDOY(date){
  // UTC-basiert: immun gegen Sommerzeit (sonst fehlt ab Ende März 1 Stunde -> Tag um 1 zu niedrig)
  return Math.round((Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())-Date.UTC(date.getFullYear(),0,0))/86400000);
}

function getCat(id){return DB.categories.find(c=>c.id===id)||{id:'sonstiges',name:'Sonstiges',color:'#27ae60',emoji:'📌'};}
// V2.3: Konvertiert HH:MM oder Zahl in Minuten (für Stunden-Wiederholung)
function parseHHMM(val){
  if(!val)return 60;
  let str=String(val).trim();
  if(str.includes(':')){
    let [h,m]=str.split(':').map(Number);
    if(isNaN(h)||isNaN(m))return 60;
    return Math.max(1,h*60+m);
  }
  let n=parseInt(str);
  return isNaN(n)||n<1?60:n*60; // Zahl wird als Stunden interpretiert
}
// V2.4 (Punkt 2): Stundenserie = Wiederholung „alle X Stunden" (bzw. HH:MM)
function isHourSeries(ev){return ev.repeat==='interval'&&(ev.repeatUnit||'')==='stunden';}
/* Tatsächliche Uhrzeiten einer Stundenserie an einem konkreten Tag.
   Anker = Startdatum + Anfangszeit des Termins, z.B. „alle 27 Stunden,
   Start 16:40" -> 16:40, Folgetag 19:40, danach 22:40 usw.
   EXAKT dieselbe Arithmetik wie in occursOn (Fall 'interval'/'stunden'),
   damit Anzeige und Vorkommen niemals auseinanderlaufen. */
function hourOccTimesOn(ev,y,m,d){
  let ed=parseDate(ev.date);ed.setHours(0,0,0,0);
  let startMin=ed.getTime()/60000+(ev.time?toMin(ev.time):0);
  let td=new Date(y,m,d);td.setHours(0,0,0,0);
  let dayStart=td.getTime()/60000,dayEnd=dayStart+1440,step=parseHHMM(ev.repeatInterval);
  let out=[];
  if(dayEnd<=startMin)return out;
  let k=Math.max(0,Math.ceil((dayStart-startMin)/step));
  for(let t=startMin+k*step;t<dayEnd;t+=step){
    let mm=Math.round(t-dayStart);
    out.push(String(Math.floor(mm/60)).padStart(2,'0')+':'+String(mm%60).padStart(2,'0'));
  }
  return out;
}
/* Anzeige-Uhrzeit eines Termins an einem konkreten Tag: Stundenserien liefern
   die berechnete(n) Uhrzeit(en) dieses Tages (bei Intervall < 24 h mehrere,
   mit „ / " verbunden), alle anderen Termine wie bisher die Anfangszeit. */
function evTimeOn(ev,y,m,d){
  if(isHourSeries(ev)&&ev.time){
    let ts=hourOccTimesOn(ev,y,m,d);
    if(ts.length)return ts.join(' / ');
  }
  return ev.time||'';
}
/* V2.5 (Punkt 1): Ist der Tag (dateStr) ein FOLGETAG eines mehrtägigen
   Einzeltermins mit Uhrzeit (inkl. Über-Mitternacht-Terminen 23:00–01:00)? */
function isContDay(ev,ds){
  return !(ev.repeat&&ev.repeat!=='none')&&!!ev.time&&!!ev.dateEnd&&ev.dateEnd>ev.date&&ds>ev.date;
}
/* V2.5 (Punkt 1): Zeit-Beschriftung in der Wochenansicht. An Folgetagen wird
   statt der Anfangszeit das STARTDATUM angezeigt – am letzten Tag zusätzlich
   mit der Endzeit, z.B. „18. Juli – 01:00". So ist sofort erkennbar, dass der
   Termin am Vortag (18.7.) begonnen hat und an diesem Tag um 01:00 endet.
   Am Starttag und bei Serien bleibt alles wie bisher (Uhrzeit t). */
function contTimeLabel(ev,y,m,d,t){
  let ds=fmtDate(y,m,d);
  if(isContDay(ev,ds)){
    let sd=parseDate(ev.date);
    let lbl=`${sd.getDate()}. ${mNames[sd.getMonth()]}`;
    return ds===ev.dateEnd&&ev.timeEnd?`${lbl} – ${ev.timeEnd}`:lbl;
  }
  return t;
}
/* V2.5 (Punkt 2): Eigene Schriftfarbe eines Termins auf dem NEUTRALEN
   Flächenhintergrund des aktuellen Modus lesbar halten.
   V2.9 (Fix): Bisher wurde eine zu dunkle Farbe im Dunkelmodus (bzw. zu helle
   im Hellmodus) komplett VERWORFEN und durch die Standardfarbe ersetzt –
   dadurch erschien z.B. kräftiges Rot (#ff0000, Luminanz 0,30 < 0,45) im
   Dunkelmodus einfach WEISS, während ein etwas helleres Rot die Schwelle
   knapp überschritt und farbig blieb (gemeldete Unstimmigkeit „Valentinstag/
   Unschuldige Kinder": gleicher Chip-Stil, aber ein Termin farbig, der andere
   weiß). Jetzt wird die gewählte Farbe stattdessen unter Beibehaltung des
   FARBTONS aufgehellt (Dunkelmodus) bzw. abgedunkelt (Hellmodus), bis sie
   lesbar ist – die Wunschfarbe geht nie mehr verloren.
   Auf farbigem Chip-Hintergrund („Mit Farbhintergrund") bleibt die eigene
   Farbe unverändert – dort ist der Hintergrund hell/pastell. */
function effTextColor(tc){
  if(!tc)return'';
  let n=parseInt(String(tc).slice(1),16);
  if(isNaN(n))return tc;
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  let lum=(r*0.299+g*0.587+b*0.114)/255;
  let dark=SETTINGS.theme==='dunkel';
  let hex=(R,G,B)=>'#'+((1<<24)|(R<<16)|(G<<8)|B).toString(16).slice(1);
  if(dark&&lum<0.45){
    // Richtung Weiß mischen bis Ziel-Luminanz ~0,55 (statt Farbe verwerfen)
    let f=(0.55-lum)/(1-lum||1);
    return hex(Math.round(r+(255-r)*f),Math.round(g+(255-g)*f),Math.round(b+(255-b)*f));
  }
  if(!dark&&lum>0.75){
    // Proportional abdunkeln auf Ziel-Luminanz ~0,55 (statt Farbe verwerfen)
    let k=0.55/lum;
    return hex(Math.round(r*k),Math.round(g*k),Math.round(b*k));
  }
  return tc;
}
// V2.3: Chip-Stil aus den beiden unabhängigen Optionen zusammensetzen (Punkt 11)
// chipBg  = vollflächiger Farbhintergrund
// chipBorder = farbiger linker Rand
// beide aus = neutraler Chip nur mit Text
// V2.4 (Punkt 1): optionaler Override JE TERMIN (ev.chipStyle) – damit sind
// Chips mit und ohne Farbhintergrund gleichzeitig in derselben Ansicht möglich.
// ''=Standard (globale Einstellung), 'bg'=Farbhintergrund, 'border'=nur Rand,
// 'plain'=nur Text.
function chipStyleFor(evColor,textColor,override){
  let bg=SETTINGS.chipBg,bd=SETTINGS.chipBorder;
  if(override==='bg'){bg=true;bd=false;}
  else if(override==='border'){bg=false;bd=true;}
  else if(override==='plain'){bg=false;bd=false;}
  let s='';
  if(bg)s+=`background:${evColor};color:${textColor||autoTextColor(evColor)};`; // V3.0 (Punkt 2): Kontrast statt immer Weiß
  else s+=`background:var(--surface3);color:${effTextColor(textColor)||'var(--text)'};`; // V2.5 (Punkt 2)
  if(bd)s+=`border-left:3px solid ${bg?'rgba(0,0,0,.35)':evColor};`;
  return s;
}

/* HTML-Escaping für sichere Anzeige von Nutzertext */
function escHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escAttr(s){return escHtml(s).replace(/"/g,'&quot;');}

/* Jahreszahl dynamisch pro angezeigtem Jahr:
   Geburtstage zeigen das Alter ab 0, jährliche Termine in Gedenk-/
   Jahrestag-Kategorien die Anzahl der Jahre seit dem Startjahr ab 1 –
   so bleibt das Startjahr selbst ohne störendes "(0)" (V1.9).
   V3.2: alle anderen Kategorien zeigen KEINEN Zähler mehr. */
/* V2.7: Gedenktag – liegt (y,m,d) auf dem jährlichen Sterbetag eines
   Eintrags mit optionalem Sterbedatum (ev.deathDate)? Gilt ab dem
   Todesjahr; nur für jährliche Einträge (Geburtstage). */
function isMemorialOn(ev,y,m,d){
  if(!ev.deathDate||ev.repeat!=='yearly')return false;
  let dd=parseDate(ev.deathDate);
  return dd.getMonth()===m&&dd.getDate()===d&&y>=dd.getFullYear();
}
function displayTitle(ev,targetYear,m,d){
  let base=ev.title.replace(/\s*\(\d+\)\s*$/,'').replace(/\s*\(geb\.[^)]*\)\s*$/i,'').trim();
  if(ev.repeat==='yearly'){
    // V2.7: Vorkommen am Sterbedatum -> Gedenktag „✝ Name (Jahre seit Tod)";
    // Zahl ab 1 (Jubiläumslogik), im Todesjahr selbst ohne Zahl.
    if(m!==undefined&&d!==undefined&&isMemorialOn(ev,targetYear,m,d)){
      let yrs=targetYear-parseDate(ev.deathDate).getFullYear();
      return(yrs>=1&&yrs<150)?`✝ ${base} (${yrs})`:`✝ ${base}`;
    }
    // V3.2: Jahreszähler NUR für Geburtstag/Gedenk…/Jahrestag-Kategorien
    // (isAnnualCat). Jährliche Termine anderer Kategorien (z.B.
    // „Walpurgisnacht" unter Sonstiges) bleiben ohne „(1)", „(2)" …
    if(!isAnnualCat(ev.categoryId))return ev.title;
    let by=parseDate(ev.date).getFullYear();
    let age=targetYear-by;
    let min=ev.categoryId==='geburtstag'?0:1;
    if(age>=min&&age<150){
      // V2.7: Verstorbene – liegt DIESER Geburtstag nach dem Todesdatum,
      // wird „wäre X geworden" angezeigt; im Todesjahr mit Geburtstag VOR
      // dem Tod bleibt die normale Altersanzeige.
      if(ev.deathDate){
        let dd=parseDate(ev.deathDate);dd.setHours(0,0,0,0);
        let bd=parseDate(ev.date);
        let bThis=new Date(targetYear,bd.getMonth(),bd.getDate());bThis.setHours(0,0,0,0);
        if(bThis>dd)return`${base} (wäre ${age} geworden)`;
      }
      return`${base} (${age})`;
    }
  }
  return ev.title;
}
function dispT(ev,y,m,d){return escHtml(displayTitle(ev,y,m,d));}

/* 1. Advent des Jahres */
function getAdvent1(y){
  let d24=new Date(y,11,24),dow=d24.getDay();
  let a4=new Date(y,11,24-dow);           // 4. Advent (So am/vor 24.12.)
  return new Date(y,11,a4.getDate()-21);  // 3 Wochen davor
}
/* Liegt Tag (y,m,d) auf dem n-ten/letzten Wochentag wd seines Monats? */
function nthWeekdayMatch(y,m,d,ord,wd){
  let date=new Date(y,m,d);
  if(date.getDay()!==parseInt(wd))return false;
  if(ord==='last'){return d+7>new Date(y,m+1,0).getDate();}
  let n=Math.ceil(d/7);
  return({first:1,second:2,third:3,fourth:4,fifth:5})[ord]===n;
}

/* Prüft, ob Event ev am Tag (y,m,d) auftritt – alle Wiederholungstypen */
function occursOn(ev,y,m,d,_noCount){
  let td=new Date(y,m,d);td.setHours(0,0,0,0);
  // Zusatzbedingungen (wie UK's Kalender): Wochentags-/Monats-Häkchen
  // gelten für ALLE Termine, auch mehrtägige ("Sommerferien nur werktags")
  if(ev.wdMask&&ev.wdMask.length===7&&ev.wdMask[td.getDay()]==='0')return false;
  if(ev.moMask&&ev.moMask.length===12&&ev.moMask[m]==='0')return false;
  // Relativer Bezug (Ostern / 1. Advent) hat Vorrang: gilt jedes Jahr
  if(ev.relative){
    let base=ev.relative==='ostern'?getEaster(y):getAdvent1(y);
    let ref=new Date(base);ref.setDate(ref.getDate()+(parseInt(ev.offset)||0));
    return ref.getMonth()===m&&ref.getDate()===d;
  }
  let ed=parseDate(ev.date);ed.setHours(0,0,0,0);
  if(td<ed)return false;
  let isRepeating=ev.repeat&&ev.repeat!=='none';
  if(isRepeating){
    // Wiederholung beendet (Datum)?
    if(ev.repeatUntil){
      let ru=parseDate(ev.repeatUntil);ru.setHours(0,0,0,0);
      if(td>ru)return false;
    }
    // Ausnahmen: einzelne gelöschte/verschobene Vorkommen
    if(ev.exdates&&ev.exdates.includes(fmtDate(y,m,d)))return false;
    // "außer Feiertage"
    if(ev.skipHolidays&&getHolidays(y)[`${m+1}-${d}`])return false;
  }
  let diffDays=Math.round((td-ed)/86400000);
  let base=false;
  switch(ev.repeat){
    case 'yearly':  base=(ed.getMonth()===m&&ed.getDate()===d)||isMemorialOn(ev,y,m,d);break; // V2.7: + Gedenktag
    case 'monthly': base=ed.getDate()===d;break;
    case 'monthly-last': base=d===new Date(y,m+1,0).getDate();break;
    case 'weekly':  base=ed.getDay()===td.getDay();break;
    case 'wochentag':
      if(ev.repeatMonth!==''&&ev.repeatMonth!==undefined&&ev.repeatMonth!==null&&m!==parseInt(ev.repeatMonth)){base=false;break;}
      base=nthWeekdayMatch(y,m,d,ev.repeatOrd||'first',ev.repeatWd||'1');break;
    case 'interval':{
      let n=parseInt(ev.repeatInterval)||1;if(n<1)n=1;
      let u=ev.repeatUnit||'tage';
      if(u==='stunden'){
        // V2.3: Intervall im Format HH:MM (z.B. „02:30" = alle 2,5 Stunden);
        // reine Zahlen bleiben als Stunden gültig (Abwärtskompatibilität).
        // V2.4: gemeinsame Berechnung mit der Anzeige (hourOccTimesOn) –
        // Vorkommen = Start(Datum+Anfangszeit) + k*Intervall; der Tag zeigt
        // an, wenn mindestens eine berechnete Uhrzeit hineinfällt.
        base=hourOccTimesOn(ev,y,m,d).length>0;
      }
      else if(u==='tage')  base=diffDays%n===0;
      else if(u==='wochen')base=diffDays%(7*n)===0;
      else if(u==='monate')base=ed.getDate()===d&&((y*12+m)-(ed.getFullYear()*12+ed.getMonth()))%n===0;
      else if(u==='jahre') base=ed.getMonth()===m&&ed.getDate()===d&&(y-ed.getFullYear())%n===0;
      break;
    }
    default:{ // kein Repeat: Starttag oder mehrtägiger Zeitraum bis dateEnd
      if(diffDays===0)base=true;
      else if(ev.dateEnd){
        let de=parseDate(ev.dateEnd);de.setHours(0,0,0,0);
        base=td<=de;
      }
    }
  }
  if(!base)return false;
  // Wiederholung beenden nach n Terminen (zählt sichtbare Vorkommen)
  if(isRepeating&&!_noCount&&parseInt(ev.repeatCount)>0){
    let maxN=parseInt(ev.repeatCount),cnt=0;
    let cur=new Date(ed);
    /* V3.0 (Fix): Die Zählschleife war auf 4000 Tage (~11 Jahre) begrenzt –
       danach galt JEDES weitere Vorkommen als gültig. „Jährlich, nach 20
       Terminen beenden" lief dadurch ab dem 12. Jahr endlos weiter. Grenze
       jetzt ~220 Jahre; die Schleife läuft ohnehin nur an Tagen, an denen
       der Termin grundsätzlich vorkommt, und bricht nach maxN+1 Treffern ab. */
    for(let g=0;g<80000&&cur<=td;g++){
      if(occursOn(ev,cur.getFullYear(),cur.getMonth(),cur.getDate(),true)){
        cnt++;
        if(cnt>maxN)return false;
        if(cur.getTime()===td.getTime())return true; // td ist Vorkommen Nr. cnt <= maxN
      }
      cur.setDate(cur.getDate()+1);
    }
  }
  return true;
}
/* ===== SICHTBARKEIT EIN/AUS (V2.0) =====
   Termine (ev.hidden) und ganze Kategorien (cat.hidden) lassen sich aus der
   Anzeige ausblenden. Das ist REIN optisch: Daten, Backups, ICS-Export,
   Erinnerungen und Konfliktprüfung bleiben vollständig erhalten.
   Wieder einblenden: Terminzusammenfassung (👁), Rechtsklick, Kategorien-
   Schalter oder Hinweisleiste „Alles einblenden". Kein pushUndo – die
   Schalter sind jederzeit direkt umkehrbar und sollen den Undo-Stapel
   nicht mit Anzeige-Änderungen füllen. */
function isEvOff(ev){return ev.hidden===true||getCat(ev.categoryId).hidden===true;}
function toggleEvHidden(id){
  if(String(id).startsWith('pl:')){showToast('🔁 Grundplan-Einträge blendest du über das Auge beim Grundplan in der Seitenleiste aus',false);return;} // V0.3
  let ev=DB.events.find(e=>e.id===id);
  if(!ev)return;
  let nowHidden=!(ev.hidden===true);
  if(nowHidden)ev.hidden=true;else delete ev.hidden;
  saveDB();render();
  if(nowHidden){
    showToast(`🙈 „${ev.title}" ausgeblendet – wieder einblenden unten in der Terminliste (👁) oder per Rechtsklick`,false);
  }else{
    let c=getCat(ev.categoryId);
    showToast(`👁 „${ev.title}" wird wieder angezeigt`+(c.hidden===true?` – Hinweis: Kategorie „${c.name}" ist weiterhin ausgeblendet`:''),false);
  }
}
function toggleCatHidden(id){
  let c=DB.categories.find(x=>x.id===id);
  if(!c)return;
  let nowHidden=!(c.hidden===true);
  if(nowHidden)c.hidden=true;else delete c.hidden;
  saveDB();render();
  showToast(nowHidden
    ?`🙈 Kategorie „${c.name}" ausgeblendet – alle Termine dieser Kategorie sind unsichtbar (wieder einblenden: Ebenen in der Seitenleiste)`
    :`👁 Kategorie „${c.name}" wird wieder angezeigt`,false);
}
function showAllHidden(){
  DB.categories.forEach(c=>{delete c.hidden;});
  DB.events.forEach(e=>{delete e.hidden;});
  saveDB();render();
  showToast('👁 Alle Termine und Kategorien werden wieder angezeigt',false);
}
/* Hinweisleiste, sobald etwas ausgeblendet ist (Monatsansicht) */
function hiddenSummaryBar(){
  let cats=DB.categories.filter(c=>c.hidden===true);
  let nEv=DB.events.filter(e=>e.hidden===true).length;
  if(!cats.length&&!nEv)return'';
  let pills=cats.map(c=>`<span class="hidden-pill" onclick="toggleCatHidden('${c.id}')" title="Kategorie „${escAttr(c.name)}" wieder anzeigen">${c.emoji} ${escHtml(c.name)} 👁</span>`).join('');
  let evInfo=nEv?`<span>${nEv===1?'1 einzelner Termin':nEv+' einzelne Termine'} (unten in der Terminliste gedimmt, per 👁 einblendbar)</span>`:'';
  return`<div class="hidden-bar"><span>🙈 Ausgeblendet:</span>${pills}${evInfo}<button class="hidden-pill" onclick="showAllHidden()" style="margin-left:auto;font-weight:600">👁 Alles einblenden</button></div>`;
}
/* Modus (2. Parameter):
   false/undefined = Kalenderdarstellung: ohne Termintyp „versteckt" UND
                     ohne per Schalter ausgeblendete Termine/Kategorien
   'vorschau'      = Terminzusammenfassung: ausgeblendete Termine bleiben
                     (gedimmt) sichtbar, Termintyp „versteckt" nicht
   true            = alles (Listenansicht, Konfliktprüfung) */
/* V0.6: TEMPO – Einzeltermine (ohne Wiederholung/relativen Bezug) werden
   einmal nach Tagen einsortiert; nur Serien und relative Termine laufen je
   Tag durch occursOn. Ergebnisse je Tag werden bis zur nächsten Änderung
   bzw. bis zum nächsten render() gemerkt. Neu aufgebaut wird, sobald sich
   die Terminliste oder die Stand-Kennung ändert. */
var evIdx=null,dayMemo=new Map(); // var: wird schon von loadDB()/saveDB() beim Start angesprochen
function evIndexKey(){return DB.events.length+'|'+(DB.stamp||'');}
function evIndex(){
  if(evIdx&&evIdx.arr===DB.events&&evIdx.key===evIndexKey())return evIdx;
  let byDay=new Map(),other=[];
  DB.events.forEach(ev=>{
    let single=!(ev.repeat&&ev.repeat!=='none')&&!ev.relative&&/^\d{4}-\d{2}-\d{2}$/.test(ev.date||'');
    if(!single){other.push(ev);return;}
    let n0=tgDayNum(ev.date),n1=n0;
    if(ev.dateEnd&&/^\d{4}-\d{2}-\d{2}$/.test(ev.dateEnd)&&ev.dateEnd>ev.date)n1=tgDayNum(ev.dateEnd);
    if(n1-n0>800){other.push(ev);return;} // sehr lange Zeiträume: wie bisher prüfen
    for(let n=n0;n<=n1;n++){let k=tgDayStr(n);let a=byDay.get(k);if(!a){a=[];byDay.set(k,a);}a.push(ev);}
  });
  let pos=new Map();DB.events.forEach((e,i)=>pos.set(e,i));
  evIdx={arr:DB.events,key:evIndexKey(),byDay,other,pos};dayMemo=new Map();
  // Gilt nur für den laufenden Rechenvorgang (eine Darstellung): danach
  // verworfen – so kann ein Zwischenspeicher nie veralten, egal was sich ändert
  evCacheSched();
  return evIdx;
}
function evCacheClear(){evIdx=null;dayMemo=new Map();}
var evCacheQueued=false;
function evCacheSched(){if(evCacheQueued)return;evCacheQueued=true;Promise.resolve().then(()=>{evCacheQueued=false;evCacheClear();});}
function getEventsForDay(y,m,d,includeHidden){
  let mk=y+'-'+m+'-'+d+'|'+includeHidden,idx=evIndex(),hit=dayMemo.get(mk);
  if(hit)return hit.slice();
  let ds=fmtDate(y,m,d),cand=(idx.byDay.get(ds)||[]).concat(idx.other);
  let r=cand.filter(ev=>{
    if(includeHidden!==true){
      if(ev.displayType==='versteckt')return false;
      if(includeHidden!=='vorschau'&&isEvOff(ev))return false;
    }
    return occursOn(ev,y,m,d);
  });
  // V0.3: Einträge des Grundplans (virtuell, entstehen je Tag aus dem Plan)
  if(DB.plans&&DB.plans.length)r=r.concat(plOccurrences(y,m,d,includeHidden));
  // V0.6: Reihenfolge wie bisher (Reihenfolge in DB.events) beibehalten
  if(idx.byDay.has(ds)&&idx.other.length){let pos=idx.pos;r.sort((a,b)=>(pos.has(a)?pos.get(a):1e9)-(pos.has(b)?pos.get(b):1e9));}
  dayMemo.set(mk,r);
  return r.slice();
}
/* V0.3: Termin nach Kennung – echte Termine aus DB.events, Grundplan-
   Einträge (Kennung „pl:Plan:Eintrag:Datum") werden erzeugt */
function evById(id){return DB.events.find(e=>e.id===id)||(String(id).startsWith('pl:')?plVirtual(id):null);}
function fmtDate(y,m,d){return`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function parseDate(s){let[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function fmtDisp(dateStr){let d=parseDate(dateStr);return`${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}`;}
function countdown(y,m,d){
  let t=new Date(y,m,d);t.setHours(0,0,0,0);
  let diff=Math.round((t-today)/86400000);
  if(diff===0)return'heute';if(diff===1)return'morgen';if(diff===-1)return'gestern';
  if(diff>0)return`in ${Math.abs(diff)} Tagen`;return`vor ${Math.abs(diff)} Tagen`;
}

/* ===== TERMINLISTEN mit Mehrtages-Gruppierung (V1.5) =====
   Zusammenhängende Vorkommen desselben Termins (mehrtägige Termine,
   tägliche Serien) erscheinen als EIN Eintrag mit Zeitraum,
   z.B. "Mi, 2. Sep. – So, 6. Sep.". Klick auf den Eintrag klappt die
   einzelnen Tage auf – dort wie bisher bearbeiten/löschen. */
let expandedGroups=new Set();
function toggleEvGroup(key){
  if(expandedGroups.has(key))expandedGroups.delete(key);
  else expandedGroups.add(key);
  render();
}
function fmtShort(y,m,d){
  let dt=new Date(y,m,d);
  return`${dNames[dt.getDay()]}, ${d}. ${mNames[m].substr(0,3)}.`;
}
/* Ermittelt pro Event die zusammenhängenden Tagesfolgen (Runs) im Monat */
function buildMonthRuns(y,m,includeHidden){
  let days=new Date(y,m+1,0).getDate();
  let perDay=[],runs=new Map();
  for(let d=1;d<=days;d++){
    perDay[d]=getEventsForDay(y,m,d,includeHidden);
    perDay[d].forEach(ev=>{
      let list=runs.get(ev.id);
      if(!list){list=[];runs.set(ev.id,list);}
      let last=list[list.length-1];
      if(last&&last.end===d-1)last.end=d;
      else list.push({start:d,end:d});
    });
  }
  return{days,perDay,runs};
}
/* Baut die Listenzeilen eines Monats (Monatsansicht + Listenansicht) */
function renderListRows(y,m,includeHidden,showHolidays){
  let hols=getHolidays(y);
  let{days,perDay,runs}=buildMonthRuns(y,m,includeHidden);
  let out='';
  for(let d=1;d<=days;d++){
    let evs=perDay[d];
    let hol=hols[`${m+1}-${d}`];
    if(!evs.length&&!(showHolidays&&hol))continue;
    let dStr=fmtShort(y,m,d);
    if(showHolidays&&hol)out+=`<div class="ev-list-item"><span class="ev-date">${dStr}</span><span class="ev-dot" style="background:${HOLIDAY_COLOR}"></span><span class="ev-name">${hol}</span><span class="ev-cat">Feiertag</span></div>`;
    evs.forEach(ev=>{
      let cat=getCat(ev.categoryId);
      let flags=ev.displayType==='versteckt'?' 🙈':'';
      let repFlag=(ev.repeat&&ev.repeat!=='none')?' · 🔁':'';
      // V2.0: per Schalter ausgeblendet? (gedimmt anzeigen + 👁-Knopf)
      let evOff=ev.hidden===true,catOff=cat.hidden===true,off=evOff||catOff;
      let offCls=off?' ev-off':'';
      let offNote=catOff?' · Kategorie ausgeblendet':(evOff?' · ausgeblendet':'');
      let eyeBtn=`<button onclick="event.stopPropagation();toggleEvHidden('${ev.id}')" title="${evOff?'Termin wieder anzeigen':'Termin ausblenden'}">${evOff?'👁':'🙈'}</button>`;
      let run=(runs.get(ev.id)||[]).find(r=>r.start<=d&&d<=r.end);
      if(run&&run.end>run.start){
        if(d!==run.start)return; // Folgetage stecken bereits im Gruppen-Eintrag
        let key=ev.id+'@'+fmtDate(y,m,run.start);
        let open=expandedGroups.has(key);
        let n=run.end-run.start+1;
        out+=`<div class="ev-list-item${offCls}" onclick="toggleEvGroup('${key}')" oncontextmenu="evChipMenu(event,'${ev.id}','${fmtDate(y,m,run.start)}')" title="${open?'Einzelne Tage zuklappen':'Einzelne Tage aufklappen'} – Rechtsklick: Kopieren/Bearbeiten/Löschen">
          <span class="ev-date">${fmtShort(y,m,run.start)} – ${fmtShort(y,m,run.end)}</span>
          <span class="ev-dot" style="background:${ev.color||cat.color}"></span>
          <span class="ev-name">${open?'▾':'▸'} ${cat.emoji} ${dispT(ev,y,m,run.start)}${flags}</span>
          <span class="ev-cat">${escHtml(cat.name)} · ${n} Tage${ev.time?' · '+ev.time:''}${repFlag}${offNote}</span>
          <div class="ev-actions">
            ${eyeBtn}
            <button onclick="event.stopPropagation();shareEvent('${ev.id}')" title="Teilen">📤</button>
            <button onclick="event.stopPropagation();deleteEvent('${ev.id}')" title="${(ev.repeat&&ev.repeat!=='none')?'Ganze Serie löschen':'Gesamten Zeitraum löschen'}">🗑</button>
          </div>
        </div>`;
        if(open){
          for(let dd=run.start;dd<=run.end;dd++){
            out+=`<div class="ev-list-item ev-sub${offCls}" onclick="openEventModal('${ev.id}',null,'${fmtDate(y,m,dd)}')" oncontextmenu="evChipMenu(event,'${ev.id}','${fmtDate(y,m,dd)}')" title="Diesen Tag öffnen/bearbeiten">
              <span class="ev-date">${fmtShort(y,m,dd)}</span>
              <span class="ev-dot" style="background:${ev.color||cat.color}"></span>
              <span class="ev-name">${cat.emoji} ${dispT(ev,y,m,dd)}</span>
              <span class="ev-cat">Tag ${dd-run.start+1} von ${n}</span>
            </div>`;
          }
        }
        return;
      }
      out+=`<div class="ev-list-item${offCls}" onclick="openEventModal('${ev.id}',null,'${fmtDate(y,m,d)}')" oncontextmenu="evChipMenu(event,'${ev.id}','${fmtDate(y,m,d)}')" title="Klick: Bearbeiten – Rechtsklick: Kopieren/Bearbeiten/Löschen">
        <span class="ev-date">${dStr}</span>
        <span class="ev-dot" style="background:${ev.color||cat.color}"></span>
        <span class="ev-name">${cat.emoji} ${dispT(ev,y,m,d)}${flags}</span>
        <span class="ev-cat">${escHtml(cat.name)}${ev.time?' · '+evTimeOn(ev,y,m,d):''}${repFlag}${offNote}</span>
        <div class="ev-actions">
          ${eyeBtn}
          <button onclick="event.stopPropagation();shareEvent('${ev.id}')" title="Teilen">📤</button>
          <button onclick="event.stopPropagation();deleteEvent('${ev.id}')" title="Löschen">🗑</button>
        </div>
      </div>`;
    });
  }
  return out;
}

function setView(v){
  state.view=v;tgScrolled='';
  ['Jahr','Monat','Woche','Tag','Liste'].forEach(x=>{
    document.getElementById('v'+x).classList.toggle('active',v===x.toLowerCase());
  });
  document.getElementById('yearView').style.display=v==='jahr'?'grid':'none';
  document.getElementById('monthView').style.display=v==='monat'?'block':'none';
  document.getElementById('weekView').style.display=v==='woche'?'block':'none';
  document.getElementById('dayView').style.display=v==='tag'?'block':'none';
  document.getElementById('listView').style.display=v==='liste'?'block':'none';
  document.getElementById('sidebar').style.display=v==='liste'?'none':'flex';
  render();
}

function clampDay(){
  let max=new Date(state.year,state.month+1,0).getDate();
  if(state.day>max)state.day=max;
}
function shiftDays(n){
  let d=new Date(state.year,state.month,state.day+n);
  state.year=d.getFullYear();state.month=d.getMonth();state.day=d.getDate();
}
function navPrev(){
  if(state.view==='jahr'||state.view==='liste'){state.year--;}
  else if(state.view==='tag'){shiftDays(-1);}
  else if(state.view==='woche'){shiftDays(-7);}
  else{state.month--;if(state.month<0){state.month=11;state.year--;}clampDay();}
  render();
}
function navNext(){
  if(state.view==='jahr'||state.view==='liste'){state.year++;}
  else if(state.view==='tag'){shiftDays(1);}
  else if(state.view==='woche'){shiftDays(7);}
  else{state.month++;if(state.month>11){state.month=0;state.year++;}clampDay();}
  render();
}
function goToday(){
  let n=new Date();
  state.year=n.getFullYear();state.month=n.getMonth();state.day=n.getDate();
  state.miniYear=state.year;state.miniMonth=state.month;
  if(state.view==='jahr')setView('monat');else render();
}

function render(){
  // V2.3 (Punkt 5): Der Navigationsmonat (Mini-Kalender) folgt dem gewählten
  // Datum aus Jahres-/Monats-/Wochen-/Tagesansicht. Eigenständiges Blättern
  // im Mini-Kalender (‹ ›) bleibt möglich, bis die Hauptansicht das Datum
  // das nächste Mal ändert.
  state.miniYear=state.year;state.miniMonth=state.month;
  dayMemo=new Map(); // V0.6: Sichtbarkeit/Einstellungen können sich geändert haben
  ensureDBShape(); // V0.3
  renderSide();    // V0.3
  renderLayers();secApply(); // V0.5
  updateTopLabel();updateMiniCal();updateUpcoming();
  updateDayInfo(); // V2.3 (Punkt 7): Tagesübersicht immer zum aktuellen Datum
  if(state.view==='jahr')renderYear();
  else if(state.view==='monat')renderMonth();
  else if(state.view==='woche')renderWeek();
  else if(state.view==='tag')renderDay();
  else if(state.view==='liste')renderList();
}

function weekStart(y,m,d){ // Montag der Woche
  let dt=new Date(y,m,d);
  let shift=(dt.getDay()+6)%7;
  return new Date(y,m,d-shift);
}
function updateTopLabel(){
  let s;
  if(state.view==='jahr')s=`${state.year}`;
  else if(state.view==='liste')s=`Termine ${state.year}`;
  else if(state.view==='tag')s=`${dNamesLong[new Date(state.year,state.month,state.day).getDay()]}, ${state.day}. ${mNames[state.month]} ${state.year}`;
  else if(state.view==='woche'){
    let ws=weekStart(state.year,state.month,state.day);
    let we=new Date(ws);we.setDate(ws.getDate()+6);
    s=`KW ${getISOWeek(ws)} · ${ws.getDate()}.${ws.getMonth()+1}. – ${we.getDate()}.${we.getMonth()+1}.${we.getFullYear()}`;
  }
  else s=`${mNames[state.month]} ${state.year}`;
  document.getElementById('curLabel').textContent=s;
}

/* ===== ZEITRASTER FÜR WOCHE UND TAG (TIMELESS V0.1) =====
   Stunden 0–24 senkrecht, Termine als Blöcke in echter Länge.
   Zeitfenster je Tag kommen aus timeWindowOnDate (gleiche Semantik wie
   Konfliktprüfung und ICS-Export: Über-Mitternacht-Termine laufen am
   ersten Tag bis 24:00, am Folgetag ab 00:00). Stundenserien liefern
   jedes Vorkommen des Tages (hourOccTimesOn).
   Überlappung: SETTINGS.overlap 'side' = nebeneinander in Spalten,
   'stagger' = versetzt übereinander (wie Etar). */
let tgScrolled='';
function tgHM(m){m=Math.max(0,Math.min(1439,Math.round(m)));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function tgHourPx(){
  let v=getComputedStyle(document.documentElement).getPropertyValue('--hh');
  let n=parseFloat(v);return n>0?n:48;
}
function tgWindows(ev,y,m,d){
  let ds=fmtDate(y,m,d);
  if(isHourSeries(ev)&&ev.time){
    let dur=(ev.timeEnd&&toMin(ev.timeEnd)>toMin(ev.time))?toMin(ev.timeEnd)-toMin(ev.time):60;
    return hourOccTimesOn(ev,y,m,d).map(t=>{let s0=toMin(t);return[s0,Math.min(s0+dur,1440)];});
  }
  let w=timeWindowOnDate(ev,ds);
  if(!w)return[];
  let s0=w[0],e0=w[1];
  if(e0<=s0)e0=Math.min(s0+15,1440);
  return[[s0,e0]];
}
/* Spalten je Überlappungsgruppe vergeben; kurze Termine zählen mindestens
   20 Minuten, damit sich ihre Beschriftungen nicht überdecken */
function tgLayout(items){
  items.sort((a,b)=>a.s-b.s||(b.e-b.s)-(a.e-a.s));
  let cols=[],group=[],gEnd=-1;
  let close=()=>{let n=cols.length;group.forEach(it=>it.n=n);cols=[];group=[];};
  items.forEach(it=>{
    let ve=Math.max(it.e,it.s+20);
    if(it.s>=gEnd&&group.length)close();
    let c=cols.findIndex(end=>end<=it.s);
    if(c<0){c=cols.length;cols.push(ve);}else cols[c]=ve;
    it.col=c;group.push(it);gEnd=Math.max(gEnd,ve);
  });
  if(group.length)close();
  return items;
}
/* V0.3: Blockfarben – kräftige Farben als zarte Tönung, Pastellfarben
   (z.B. aus timetable) direkt als Fläche mit dunklerem Rand */
function tgColors(c){
  if(!/^#[0-9a-fA-F]{6}$/.test(c||''))return{bg:`color-mix(in srgb,${c} 20%,var(--surface))`,bd:c};
  let dark=SETTINGS.theme==='dunkel',l=relLum(c);
  if(dark)return{bg:`color-mix(in srgb,${c} ${l>0.55?34:26}%,var(--surface))`,bd:l>0.55?c:shade(c,0.25)};
  if(l>0.55)return{bg:c,bd:shade(c,-0.38)};
  return{bg:`color-mix(in srgb,${c} 20%,var(--surface))`,bd:c};
}
function tgEvStyle(it,hh){
  let top=it.s/60*hh,h=Math.max((it.e-it.s)/60*hh,18)-2;
  let pos;
  if(SETTINGS.overlap==='stagger'){
    let off=Math.min(it.col*16,64);

  }else{
    let w=100/it.n;

  }
  let c=it.color;

}

  let body=host.querySelector('.tg-body');

/* V0.6.1: Das Stundenraster bekommt genau die Höhe, die im Fenster noch frei
   ist. So läuft der Inhaltsbereich nicht über (kein zweiter Scrollbalken)
   und Kopfzeile + Ganztagszeile bleiben stehen. */
function tgFit(body){
  body=body||document.querySelector('#'+(state.view==='tag'?'dayView':'weekView')+' .tg-body');
  if(!body||!body.offsetParent)return;
  let content=document.getElementById('content');
  let cs=getComputedStyle(content),scrolls=cs.overflowY==='auto'||cs.overflowY==='scroll';
  if(scrolls)content.scrollTop=0;
  let bottom=scrolls?content.getBoundingClientRect().bottom-parseFloat(cs.paddingBottom||0):window.innerHeight-8;
  let tg=body.closest('.tg'),tgB=tg?parseFloat(getComputedStyle(tg).borderBottomWidth)||0:0;
  let h=Math.floor(bottom-body.getBoundingClientRect().top-tgB-1);
  body.style.maxHeight='none';
  body.style.height=Math.max(scrolls?240:320,h)+'px';
}
let tgFitT=0;
window.addEventListener('resize',()=>{clearTimeout(tgFitT);tgFitT=setTimeout(()=>{if(state.view==='woche'||state.view==='tag')tgFit();},60);});

/* V0.6.1: Seitliches Mausrad (links/rechts drücken) bzw. waagrechtes Wischen
   am Touchpad blättert. Die Ausschläge werden gesammelt, damit ein Touchpad
   nicht bei jedem kleinen Ruck blättert; danach kurze Sperre, damit ein
   gedrückt gehaltenes Rad gebremst weiterblättert. */
(function(){
  let acc=0,last=0,lastEv=0;
  document.getElementById('content').addEventListener('wheel',e=>{
    let dx=e.deltaX,dy=e.deltaY;
    if(!dx&&e.shiftKey&&dy&&(state.view==='woche'||state.view==='tag')){dx=dy;dy=0;} // Umschalt + Mausrad
    if(!dx||Math.abs(dx)<=Math.abs(dy))return;
    if(document.getElementById('overlay').classList.contains('show')||tgDrag)return;
    // Elemente, die selbst waagrecht scrollen können, behalten das Rad
    for(let el=e.target;el&&el.id!=='content';el=el.parentElement){
      if(el.scrollWidth>el.clientWidth+2){let ox=getComputedStyle(el).overflowX;if(ox==='auto'||ox==='scroll')return;}
    }
    e.preventDefault(); // auch: keine „Zurück"-Geste des Browsers
    let now=Date.now();
    if(now-lastEv>300)acc=0;
    lastEv=now;
    if(e.deltaMode===1)dx*=16;else if(e.deltaMode===2)dx*=400;
    acc+=dx;
    if(Math.abs(acc)<40||now-last<380)return;
    last=now;
    if(acc>0)navNext();else navPrev();
    acc=0;
  },{passive:false});
})();

/* Klick in eine freie Stelle: Termin zu dieser Uhrzeit (Viertelstunde) anlegen */
function tgColClick(e,col){

/* ===== V0.2: ZIEHEN, VERLÄNGERN, AUFZIEHEN, NACHRÜCKEN =====
   Logik (tgApplyMove/tgApplyResize/tgPlanPush) ist von der Maus-/Touch-
   Steuerung getrennt, damit sie sich ohne Oberfläche prüfen lässt.
   Zeitpunkte werden als absolute Minuten gerechnet (Tagesnummer*1440 +
   Minute, Tagesnummer über UTC – sommerzeitsicher). */
let tgJustDragged=0,tgDrag=null;
const TG_SNAP=15;
function tgDayNum(ds){let[y,m,d]=ds.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/86400000);}
function tgDayStr(n){let dt=new Date(n*86400000);return fmtDate(dt.getUTCFullYear(),dt.getUTCMonth(),dt.getUTCDate());}
function tgIsSerie(ev){return!!(ev.repeat&&ev.repeat!=='none');}
function tgMovable(ev){return!!ev.time&&!isHourSeries(ev)&&!ev.relative;}
/* Verlängern nur dort, wo der Termin auch endet (bei mehrtägigen am letzten Tag) */
function tgSizable(ev,ds){
  if(tgIsSerie(ev))return true;
  return!(ev.dateEnd&&ev.dateEnd>ev.date)||ds===ev.dateEnd;
}
/* Beginn/Ende eines (Einzel-)Termins als absolute Minuten */
function tgSpan(ev){
  let s0=tgDayNum(ev.date)*1440+toMin(ev.time),e0=null;
  if(ev.timeEnd){
    let ed=(ev.dateEnd&&ev.dateEnd>=ev.date&&!tgIsSerie(ev))?ev.dateEnd:ev.date;
    e0=tgDayNum(ed)*1440+toMin(ev.timeEnd);
    if(e0<=s0)e0=s0+60; // Altbestand mit verdrehter Endzeit – wie Konfliktprüfung
  }
  return[s0,e0];
}
/* Ergebnis zurück in date/time/dateEnd/timeEnd schreiben.
   Endet ein Termin genau um Mitternacht, wird daraus 23:59 des Vortags
   (statt „00:00 am Folgetag" – sonst entstünde ein Scheinzeitraum). */
function tgSetSpan(ev,s0,e0,keepDayEnd){
  let sd=Math.floor(s0/1440);
  ev.date=tgDayStr(sd);ev.time=tgHM(s0-sd*1440);
  if(e0!==null){
    let ed=Math.floor(e0/1440),em=e0-ed*1440;
    if(em===0&&ed>sd){ed--;em=1439;}
    ev.timeEnd=tgHM(em);
    ev.dateEnd=ed>sd?tgDayStr(ed):'';
  }else if(!keepDayEnd)ev.dateEnd='';
}
function tgShift(ev,delta){
  let[s0,e0]=tgSpan(ev);
  let dayShift=Math.floor((s0+delta)/1440)-Math.floor(s0/1440);
  let oldEnd=ev.dateEnd;
  tgSetSpan(ev,s0+delta,e0===null?null:e0+delta,true);
  // mehrtägig ohne Endzeit: Enddatum um dieselben Tage mitschieben
  if(e0===null&&oldEnd){
    let n=tgDayNum(oldEnd)+dayShift;ev.dateEnd=n>tgDayNum(ev.date)?tgDayStr(n):'';
  }
}
function tgNewId(){return'ev_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);}
/* Verschieben (oder Kopieren) eines Blocks: Block lag am Tag fromDs ab
   Minute blockS, landet am Tag toDs ab Minute newS.
   Rückgabe: der veränderte bzw. neue Termin (für Nachrücken), sonst null. */
function tgApplyMove(id,fromDs,blockS,toDs,newS,copy){
  let ev=DB.events.find(e=>e.id===id);
  if(!ev||!tgMovable(ev))return null;
  let delta=(tgDayNum(toDs)-tgDayNum(fromDs))*1440+(newS-blockS);
  if(!delta&&!copy)return null;
  let res;
  if(tgIsSerie(ev)&&!copy){tgSeriesAsk(ev.id,fromDs,delta);return null;} // V1.0: Auswahl nur dieses / folgende / alle
  if(tgIsSerie(ev)){
    pushUndo(`${copy?'Vorkommen kopiert':'Vorkommen verschoben'}: ${ev.title}`);
    res=JSON.parse(JSON.stringify(ev));
    Object.assign(res,{id:tgNewId(),date:fromDs,dateEnd:'',repeat:'none',repeatUntil:'',repeatCount:'',exdates:[]});
    delete res.importUid;delete res.hidden;delete res.deathDate;
    if(!copy){
      ev.exdates=ev.exdates||[];if(!ev.exdates.includes(fromDs))ev.exdates.push(fromDs);
      res.notes=(ev.notes?ev.notes+'\n':'')+`(verschoben von ${fmtDisp(fromDs)})`;
    }
    tgShift(res,delta);
    DB.events.push(res);
  }else if(copy){
    pushUndo(`Termin kopiert: ${ev.title}`);
    res=JSON.parse(JSON.stringify(ev));res.id=tgNewId();delete res.importUid;delete res.hidden;res.exdates=[];
    tgShift(res,delta);DB.events.push(res);
  }else{
    pushUndo(`Termin verschoben: ${ev.title}`);
    tgShift(ev,delta);res=ev;
  }
  saveDB();render();
  showToast(`${copy?'📄 Kopiert':'↔ Verschoben'}: ${res.title} → ${fmtDisp(res.date)} ${res.time}${res.timeEnd?'–'+res.timeEnd:''}${conflictSuffix(res)}`,true);
  return res;
}
/* Ende eines Blocks am Tag ds auf Minute newE setzen */
function tgApplyResize(id,ds,newE){
  let ev=DB.events.find(e=>e.id===id);
  if(!ev||!tgMovable(ev))return null;
  if(tgIsSerie(ev)){
    let e=Math.max(newE,toMin(ev.time)+TG_SNAP);if(e>=1440)e=1439;
    if(ev.timeEnd&&toMin(ev.timeEnd)===e)return null;
    if(!confirm(`Serientermin „${ev.title}":\nDauer für die GANZE Serie auf ${ev.time}–${tgHM(e)} ändern?`))return null;
    pushUndo(`Dauer der Serie geändert: ${ev.title}`);
    ev.timeEnd=tgHM(e);
  }else{
    let[s0]=tgSpan(ev),e0=tgDayNum(ds)*1440+newE;
    if(e0<s0+TG_SNAP)e0=s0+TG_SNAP;
    let before=ev.timeEnd+'|'+ev.dateEnd;
    let probe=JSON.parse(JSON.stringify(ev));tgSetSpan(probe,s0,e0);
    if(probe.timeEnd+'|'+probe.dateEnd===before)return null;
    pushUndo(`Dauer geändert: ${ev.title}`);
    tgSetSpan(ev,s0,e0);
  }
  saveDB();render();
  showToast(`↕ Neue Dauer: ${ev.title} ${ev.time}–${ev.timeEnd}${conflictSuffix(ev)}`,true);
  return ev;
}
/* Nachrücken wie im Terminbuch: Termine desselben Tages, die ab dem Beginn
   des bewegten Termins anfangen und in ihn hineinragen, rücken der Reihe
   nach hinter ihn. Nur eintägige Einzeltermine mit Uhrzeit werden bewegt;
   Serien, mehrtägige und relative Termine bleiben, wo sie sind. */
function tgPlanPush(ev){
  if(!ev||!ev.time||tgIsSerie(ev)||(ev.dateEnd&&ev.dateEnd>ev.date))return null;
  let[y,m,d]=ev.date.split('-').map(Number);
  let ms=toMin(ev.time),cur=ev.timeEnd?toMin(ev.timeEnd):ms+60;
  let list=getEventsForDay(y,m-1,d).filter(o=>o.id!==ev.id&&!o._plan&&o.time&&!tgIsSerie(o)&&!o.relative&&!(o.dateEnd&&o.dateEnd>o.date)&&toMin(o.time)>=ms)
    .map(o=>{let s0=toMin(o.time),du=(o.timeEnd&&toMin(o.timeEnd)>s0)?toMin(o.timeEnd)-s0:60;return{o,s:s0,du};})
    .sort((a,b)=>a.s-b.s);
  let shifts=[];
  for(let x of list){
    if(x.s>=cur)break;
    shifts.push({id:x.o.id,title:x.o.title,from:x.o.time,ns:cur,du:x.du,hadEnd:!!x.o.timeEnd,by:cur-x.s});
    cur+=x.du;
  }
  if(!shifts.length)return null;
  return{shifts,end:cur,late:cur>1440};
}
function tgApplyPush(plan){
  plan.shifts.forEach(x=>{
    let o=DB.events.find(e=>e.id===x.id);if(!o)return;
    o.time=tgHM(x.ns);if(x.hadEnd)o.timeEnd=tgHM(Math.min(x.ns+x.du,1439));
  });
  saveDB();render();
  showToast(`⤵ ${plan.shifts.length} Termin${plan.shifts.length>1?'e':''} nachgerückt – Rückgängig nimmt auch das Verschieben zurück`,true);
}
let tgPendingPush=null;
function tgOfferPush(ev){
  let plan=tgPlanPush(ev);
  if(!plan)return;
  if(plan.late){showToast(`⚠️ Überschneidung am ${fmtDisp(ev.date)} – Nachrücken nicht möglich (würde über Mitternacht hinausgehen)`,true);return;}
  tgPendingPush=plan;
  editingId=null;openOverlay();
  document.getElementById('modalTabs').style.display='none';
  document.getElementById('modalTitle').textContent='⚠️ Überschneidung';
  document.getElementById('modalBody').innerHTML=`<p style="font-size:13px;margin-bottom:10px"><b>${escHtml(ev.title)}</b> (${ev.time}–${ev.timeEnd||tgHM(toMin(ev.time)+60)}) überdeckt ${plan.shifts.length>1?'diese Termine':'diesen Termin'} am ${fmtDisp(ev.date)}. Beim Nachrücken ${plan.shifts.length>1?'wandern sie':'wandert er'} dahinter:</p>
    <ul style="font-size:13px;padding-left:18px;display:grid;gap:4px;font-variant-numeric:tabular-nums">${plan.shifts.map(x=>`<li>${x.from} → <b>${tgHM(x.ns)}</b> · ${escHtml(x.title)} <span style="color:var(--muted)">(+${x.by} Min.)</span></li>`).join('')}</ul>
    ${plan.end>toMin('20:00')?`<p style="font-size:12px;color:var(--muted);margin-top:10px">Der letzte Termin endet dann um ${tgHM(Math.min(plan.end,1439))}.</p>`:''}`;
  document.getElementById('modalFooter').innerHTML=`<button class="btn-cancel" onclick="tgPendingPush=null;closeModal()">Überlappen lassen</button><button class="btn-ok" onclick="let p=tgPendingPush;tgPendingPush=null;closeModal();if(p)tgApplyPush(p)">⤵ Nachrücken</button>`;
}

/* ----- Steuerung mit Maus, Stift und Finger (Pointer Events) ----- */
function tgEvClick(e,id,ds){
  e.stopPropagation();
  if(Date.now()-tgJustDragged<350)return;
  openEventModal(id,null,ds);
}
function tgEvCtx(e,id,ds){
  if(tgDrag&&tgDrag.touch){e.preventDefault();e.stopPropagation();if(tgDrag.active)return;tgDrag.menu={x:e.clientX,y:e.clientY};return;}
  evChipMenu(e,id,ds);
}
function tgSnap(min){return Math.round(min/TG_SNAP)*TG_SNAP;}
function tgColAt(x,y){
  let el=document.elementFromPoint(x,y);
  return el&&el.closest?el.closest('.tg-col'):null;
}
function tgMinIn(col,clientY,offsetPx){
  let r=col.getBoundingClientRect(),hh=tgHourPx();
  return(clientY-r.top-(offsetPx||0))/hh*60;
}
function tgLabel(el,a,b){let t=el.querySelector('.t');if(t)t.textContent=`${tgHM(a)}–${b>=1440?'24:00':tgHM(b)}`;}
function tgAutoScroll(e){
  let body=tgDrag&&tgDrag.body;if(!body)return;
  let r=body.getBoundingClientRect();
  if(e.clientY<r.top+36)body.scrollTop-=14;else if(e.clientY>r.bottom-36)body.scrollTop+=14;
}
function tgPointerDown(e){
  if(e.button!==undefined&&e.button!==0)return;
  if(e.target.closest&&e.target.closest('.ev-x'))return; // V1.1
  let evEl=e.target.closest&&e.target.closest('.tg-ev');
  let col=e.target.closest&&e.target.closest('.tg-col');
  if(!col)return;
  let touch=e.pointerType==='touch';
  let base={x0:e.clientX,y0:e.clientY,touch,active:false,body:col.closest('.tg-body'),pid:e.pointerId};
  if(evEl){
    let ev=evById(evEl.dataset.id);
    if(!ev||!tgMovable(ev))return;
    if(ev._plan&&plLocked(ev._mon))return; // V0.3: vergangene Woche gesperrt
    let resize=!!e.target.closest('.tg-rs'),fill=!!e.target.closest('.tg-fl,.tg-fr'); // V0.4
    let r=evEl.getBoundingClientRect();
    tgDrag=Object.assign(base,{mode:fill?'fill':resize?'resize':'move',el:evEl,id:ev.id,ds:evEl.dataset.ds,s:+evEl.dataset.s,e:+evEl.dataset.e,grab:e.clientY-r.top,col});
  }else if(e.target===col&&!touch){
    tgDrag=Object.assign(base,{mode:'create',col,cols:[...col.parentNode.querySelectorAll('.tg-col')],ds:col.dataset.ds,s0:Math.max(0,Math.min(1425,Math.floor(tgMinIn(col,e.clientY)/TG_SNAP)*TG_SNAP))});
  }else return;
  if(touch){
    // Finger: erst nach kurzem Halten ziehen, sonst normal scrollen
    tgDrag.timer=setTimeout(()=>{if(tgDrag&&!tgDrag.cancel)tgActivate();},350);
  }
  document.addEventListener('pointermove',tgPointerMove);
  document.addEventListener('pointerup',tgPointerUp);
  document.addEventListener('pointercancel',tgPointerCancel);
}
function tgActivate(){
  let d=tgDrag;if(!d||d.active)return;
  d.active=true;
  document.body.classList.add('tg-dragging');
  if(d.mode==='move'||d.mode==='resize'){d.el.classList.add('dragging');}
  if(d.mode==='fill'){d.el.classList.add('filling');d.cols=[...d.col.parentNode.querySelectorAll('.tg-col')];d.i0=d.cols.indexOf(d.col);d.ghosts=[];d.days=[];}
  if(d.mode==='create'){
    let g=document.createElement('div');g.className='tg-ev ghost';
    g.style.cssText='left:2px;width:calc(100% - 6px);z-index:70;background:color-mix(in srgb,var(--today) 18%,var(--surface));border-left-color:var(--today)';
    g.innerHTML='<span class="n">Neuer Termin</span><span class="t"></span>';
    d.col.appendChild(g);d.ghost=g;
  }
  if(navigator.vibrate&&d.touch){try{navigator.vibrate(15);}catch(x){}}
}
function tgPointerMove(e){
  let d=tgDrag;if(!d)return;
  let dist=Math.hypot(e.clientX-d.x0,e.clientY-d.y0);
  if(!d.active){
    if(d.touch){if(dist>8){d.cancel=true;clearTimeout(d.timer);tgEndListen();tgDrag=null;}return;}
    if(dist<5)return;
    tgActivate();
  }
  e.preventDefault();
  tgAutoScroll(e);
  let hh=tgHourPx();
  if(d.mode==='move'){
    let col=tgColAt(e.clientX,e.clientY)||d.col;
    let dur=d.e-d.s;
    let ns=tgSnap(tgMinIn(col,e.clientY,d.grab));
    ns=Math.max(0,Math.min(ns,1440-Math.min(dur,1440-TG_SNAP)));
    if(col!==d.el.parentNode)col.appendChild(d.el);
    d.el.style.top=(ns/60*hh+1)+'px';
    d.el.style.left='2px';d.el.style.width='calc(100% - 6px)';
    d.tCol=col;d.ns=ns;
    tgLabel(d.el,ns,ns+dur);
  }else if(d.mode==='resize'){
    let ne=tgSnap(tgMinIn(d.col,e.clientY));
    ne=Math.max(d.s+TG_SNAP,Math.min(ne,1440));
    d.el.style.height=(Math.max((ne-d.s)/60*hh,18)-2)+'px';
    d.ne=ne;tgLabel(d.el,d.s,ne);
  }else if(d.mode==='fill'){ // V0.4: über Nachbartage ziehen = kopieren
    let col=tgColAt(e.clientX,e.clientY),i1=col?d.cols.indexOf(col):-1;
    if(i1<0)return;
    let a=Math.min(d.i0,i1),b=Math.max(d.i0,i1),days=[];
    for(let i=a;i<=b;i++)if(i!==d.i0)days.push(d.cols[i].dataset.ds);
    if(days.join()===d.days.join())return;
    d.ghosts.forEach(g=>g.remove());d.ghosts=[];d.days=days;
    let lab=(d.el.querySelector('.n')||{}).textContent||'';
    for(let i=a;i<=b;i++){
      if(i===d.i0)continue;
      let g=document.createElement('div');g.className='tg-ev ghost fill';
      g.style.cssText=`left:2px;width:calc(100% - 6px);z-index:70;top:${d.el.style.top};height:${d.el.style.height};background:${d.el.style.background};border-left-color:${d.el.style.borderLeftColor}`;
      g.innerHTML=`<span class="n"></span><span class="t">+ Kopie</span>`;g.querySelector('.n').textContent=lab;
      d.cols[i].appendChild(g);d.ghosts.push(g);
    }
  }else if(d.mode==='create'){
    let m=tgSnap(tgMinIn(d.col,e.clientY));
    let a=Math.min(d.s0,m),b=Math.max(d.s0+TG_SNAP,m);
    a=Math.max(0,a);b=Math.min(1440,Math.max(b,a+TG_SNAP));
    d.ghost.style.top=(a/60*hh+1)+'px';d.ghost.style.height=(Math.max((b-a)/60*hh,18)-2)+'px';
    d.a=a;d.b=b;tgLabel(d.ghost,a,b);
    // V1.1: seitlich über weitere Tage ziehen -> dort ebenfalls anlegen
    let c=tgColAt(e.clientX,e.clientY),i0=d.cols.indexOf(d.col),i1=c?d.cols.indexOf(c):-1;
    if(i1<0)i1=d.i1!==undefined?d.i1:i0;
    d.i1=i1;
    let lo=Math.min(i0,i1),hi=Math.max(i0,i1);
    d.extraG=(d.extraG||[]).filter(g=>{let k=d.cols.indexOf(g.parentNode);if(k<lo||k>hi||k===i0){g.remove();return false;}return true;});
    for(let k=lo;k<=hi;k++){
      if(k===i0)continue;
      let g=d.extraG.find(x=>x.parentNode===d.cols[k]);
      if(!g){g=d.ghost.cloneNode(true);d.cols[k].appendChild(g);d.extraG.push(g);}
      g.style.cssText=d.ghost.style.cssText;tgLabel(g,a,b);
    }
    d.days=[];for(let k=lo;k<=hi;k++)d.days.push(d.cols[k].dataset.ds);
  }
}
function tgEndListen(){
  document.removeEventListener('pointermove',tgPointerMove);
  document.removeEventListener('pointerup',tgPointerUp);
  document.removeEventListener('pointercancel',tgPointerCancel);
  document.body.classList.remove('tg-dragging');
}
function tgPointerCancel(){
  let d=tgDrag;if(!d)return;
  // Am Handy übernimmt der Browser beim Scrollen den Finger – kein Fehler
  clearTimeout(d.timer);tgEndListen();tgDrag=null;
  if(d.active)render();
}
function tgPointerUp(e){
  let d=tgDrag;if(!d)return;
  clearTimeout(d.timer);tgEndListen();tgDrag=null;
  if(!d.active){
    // Finger lange gehalten, aber nicht bewegt -> Menü wie bisher
    if(d.touch&&d.menu&&d.id)evChipMenu({preventDefault(){},stopPropagation(){},clientX:d.menu.x,clientY:d.menu.y},d.id,d.ds);
    return;
  }
  tgJustDragged=Date.now();
  if(d.mode==='move'){
    if(d.ns===undefined||!d.tCol){render();return;}
    if(d.id.startsWith('pl:')){if(!plMoveItem(d.id,d.tCol.dataset.ds,d.ns,e.ctrlKey||e.shiftKey||e.metaKey))render();return;} // V0.3
    let res=tgApplyMove(d.id,d.ds,d.s,d.tCol.dataset.ds,d.ns,e.ctrlKey||e.shiftKey||e.metaKey);
    if(!res){render();return;}
    tgOfferPush(res);
  }else if(d.mode==='resize'){
    if(d.ne===undefined){render();return;}
    if(d.id.startsWith('pl:')){if(!plResizeItem(d.id,d.ne))render();return;} // V0.3
    let res=tgApplyResize(d.id,d.ds,d.ne);
    if(!res){render();return;}
    tgOfferPush(res);
  }else if(d.mode==='fill'){ // V0.4
    (d.ghosts||[]).forEach(g=>g.remove());
    if(!d.days||!d.days.length){render();return;}
    if(d.id.startsWith('pl:'))plFillItem(d.id,d.days);else tgApplyFill(d.id,d.ds,d.days);
  }else if(d.mode==='create'){
    if(d.a===undefined){render();return;}
    let a=d.a,b=d.b;
    if(d.ghost)d.ghost.remove();
    (d.extraG||[]).forEach(g=>g.remove());
    openMultiNew(d.days&&d.days.length?d.days:[d.ds],a,b); // V1.1
  }
}
document.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('.tg-body'))tgPointerDown(e);});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&tgDrag){(tgDrag.extraG||[]).forEach(g=>g.remove());let a=tgDrag.active;clearTimeout(tgDrag.timer);tgEndListen();tgDrag=null;tgJustDragged=Date.now();if(a)render();}
});

function renderWeek(){
  let ws=weekStart(state.year,state.month,state.day);
  let dates=[];
  for(let i=0;i<7;i++){let dt=new Date(ws);dt.setDate(ws.getDate()+i);dates.push(dt);}
  renderTimeGrid(dates,'weekView',plBanner(ws));
}

function renderYear(){
  let h='',hols=getHolidays(state.year); // V2.8: toten getSpecial-Aufruf entfernt (Ergebnis wurde nie genutzt)
  for(let m=0;m<12;m++){
    let days=new Date(state.year,m+1,0).getDate();
    let shift=(new Date(state.year,m,1).getDay()+6)%7;
    let rows=Math.ceil((shift+days)/7);
    let t=`<div class="mini-month"><h4 onclick="goToMonth(${m})">${mNames[m]}</h4><table><thead><tr><th class="mmy-kw">KW</th>`;
    [1,2,3,4,5,6,0].map(i=>dNames[i]).forEach(d=>{t+=`<th>${d}</th>`;});
    t+='</tr></thead><tbody>';
    for(let r=0;r<rows;r++){
      // V1.9: Kalenderwoche der Zeile (erster gültiger Tag der Zeile)
      let fd=Math.min(Math.max(1,r*7-shift+1),days);
      t+=`<tr><td class="mmy-kw">${getISOWeek(new Date(state.year,m,fd))}</td>`;
      for(let c=0;c<7;c++){
        let d=r*7+c-shift+1;
        if(d<1||d>days){t+='<td></td>';continue;}
        let date=new Date(state.year,m,d),dw=date.getDay();
        let isT=date.getTime()===today.getTime();
        let isH=!!hols[`${m+1}-${d}`],isWe=dw===0||dw===6;
        let hasEv=getEventsForDay(state.year,m,d).length>0;
        let cls=`${isT?'mmy-today':''} ${isH?'mmy-hol':''} ${isWe&&!isT&&!isH?'mmy-we':''} ${hasEv?'mmy-event':''}`;
        let HL=SETTINGS.heat&&SETTINGS.heat.on?dayLoad(state.year,m,d):null; // V0.4
        t+=`<td class="${cls}${HL&&HL.open?' hv'+HL.level:''}" onclick="goToDay(${m},${d})" oncontextmenu="yearDayMenu(event,${m},${d})"${HL&&HL.open?` title="${HL.free?HL.free+' frei':'voll'}"`:''}>${d}</td>`;
      }
      t+='</tr>';
    }
    t+='</tbody></table></div>';h+=t;
  }
  document.getElementById('yearView').innerHTML=h;
}

/* V1.1: ein Tag der Monatsansicht (auch blass für Vor-/Folgemonat) */
function monthCell(y,m,d,other,heatOn){
  let html='';
  let hols=getHolidays(y),spec=getSpecial(y);
      let date=new Date(y,m,d),dw=date.getDay();
      let isT=date.getTime()===today.getTime();
      let key=`${m+1}-${d}`;
      let isH=!!hols[key],isWe=dw===0||dw===6;
      let holName=hols[key],sp=spec[key];
      let evs=getEventsForDay(y,m,d);
      let fm=isFullMoon(m,d,y);
      let numCls=isWe?'we':'';
      if(isH)numCls='hol';
      let HL=heatOn&&!other?dayLoad(y,m,d):null; // V0.4
      html+=`<td data-ds="${fmtDate(y,m,d)}" class="${other?'other-month ':''}${HL&&HL.open?'hv'+HL.level:''}" onclick="dayClick(${y},${m},${d})" oncontextmenu="dayRightClick(event,${y},${m},${d})" ondragover="event.preventDefault();this.style.background='var(--hover)'" ondragleave="this.style.background=''" ondrop="dropEv(event,${y},${m},${d})">`;
      html+=`<div class="day-num ${numCls}${isT?' today':''}">${d}</div>`;
      if(fm&&SETTINGS.showMoon!==false)html+=`<div class="moon-icon">🌕</div>`;
      if(SETTINGS.showHol!==false){ // V0.5: Ebene Feiertage
      if(isH)html+=`<div class="hol-label" title="${holName}">${holName}</div>`;
      else if(sp)html+=`<div class="spec-label">${sp.emoji} ${sp.label}</div>`;}
      {let fr=SETTINGS.showFerien!==false?ferienOn(fmtDate(y,m,d)):null;if(fr)html+=`<div class="fer-label" title="${escAttr(fr.name)}">🏖️ ${escHtml(fr.name)}</div>`;} // V0.3
      // V0.4: Auslastung zeigt wie im Terminbuch nur Anzahl und freie Zeiten
      if(heatOn){
        if(evs.length)html+=`<div class="heat-cnt">${evs.length} Termin${evs.length>1?'e':''}</div>`;
        if(HL&&HL.open)html+=`<div class="heat-free">${HL.free?HL.free+' frei':'voll'}</div>`;
      }
      if(!heatOn)evs.slice(0,3).forEach(ev=>{
        let cat=getCat(ev.categoryId);
        let evColor=ev.color||cat.color;
        // V2.3: Hintergrund und Rand unabhängig kombinierbar (Punkt 11)
        // V2.4 (Punkt 1): je Termin überschreibbar (ev.chipStyle)
        let chipStyle=chipStyleFor(evColor,ev.textColor,ev.chipStyle);
        html+=`<span class="ev-chip" draggable="true" ondragstart="dragEv(event,'${ev.id}','${fmtDate(y,m,d)}')" ondragover="event.preventDefault();event.stopPropagation()" ondrop="dropOnEvent(event,'${ev.id}','${fmtDate(y,m,d)}')" style="${chipStyle}" onclick="editEvent(event,'${ev.id}','${fmtDate(y,m,d)}')" oncontextmenu="evChipMenu(event,'${ev.id}','${fmtDate(y,m,d)}')" title="${ev.time?evTimeOn(ev,y,m,d)+' – ':''}${escAttr(displayTitle(ev,y,m,d))} – Rechtsklick: Kopieren, Ziehen mit Strg/Umschalt: Kopie erstellen, Ablegen auf anderem Termin: Zusammenführen">${cat.emoji} ${dispT(ev,y,m,d)}<span class="ev-x" role="button" title="Löschen" aria-label="Löschen" onclick="evX(event,'${ev.id}','${fmtDate(y,m,d)}')">×</span></span>`;
      });
      if(!heatOn&&evs.length>3)html+=`<span class="ev-chip" style="background:#888" onclick="event.stopPropagation();goToDay(${m},${d})" title="Alle ${evs.length} Termine dieses Tages in der Tagesansicht anzeigen">+${evs.length-3} mehr</span>`;
      html+='</td>';
  return html;
}
function renderMonth(){
  let y=state.year,m=state.month;
  let days=new Date(y,m+1,0).getDate();
  let shift=(new Date(y,m,1).getDay()+6)%7;
  let rows=Math.ceil((shift+days)/7);

  // V2.0: Hinweis, wenn Termine/Kategorien ausgeblendet sind
  let heatOn=!!(SETTINGS.heat&&SETTINGS.heat.on); // V0.4
  let html=`<div class="month-header"><h2>${mNames[m]} ${y}</h2><button class="sb-btn${heatOn?' pri':''}" onclick="heatToggle()" title="Tage nach belegter Zeit einfärben">🔥 Auslastung</button></div>${heatOn?heatLegend():''}${hiddenSummaryBar()}<div id="calGrid"><table><thead><tr><th style="width:26px">KW</th>`;
  [1,2,3,4,5,6,0].map(i=>dNames[i]).forEach((d,i)=>{
    let we=i>=5;html+=`<th class="${we?'weekend':''}">${d}</th>`;
  });
  html+='</tr></thead><tbody>';

  for(let r=0;r<rows;r++){
    html+='<tr>';
    let firstD=r*7-shift+1;
    let cellDate=new Date(y,m,Math.max(1,firstD));
    if(firstD<1||firstD>days)cellDate=new Date(y,m,firstD<1?1:firstD);
    let kw=getISOWeek(cellDate);
    html+=`<td class="kw-cell">${kw}</td>`;
    for(let c=0;c<7;c++){
      let d0=r*7+c-shift+1,dt0=new Date(y,m,d0); // V1.1: auch Tage des Vor-/Folgemonats
      html+=monthCell(dt0.getFullYear(),dt0.getMonth(),dt0.getDate(),d0<1||d0>days,heatOn);
    }
    html+='</tr>';
  }
  html+='</tbody></table></div>';

  // Mehrtägige Termine gruppiert als Zeitraum (V1.5);
  // V2.0: 'vorschau' = ausgeblendete Termine gedimmt mit 👁-Schalter dabei
  let listItems=renderListRows(y,m,'vorschau',true);
  if(!listItems)listItems=`<div class="empty-list">Keine Termine in ${mNames[m]} ${y}</div>`;

  html+=`<div id="eventListSection" style="margin-top:10px"><div style="background:var(--surface2);padding:7px 12px;font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px">Termine im ${mNames[m]} ${y}</div>${listItems}</div>`;
  document.getElementById('monthView').innerHTML=html;
}

function renderDay(){

  if(isFullMoon(m,d,y)&&SETTINGS.showMoon!==false)pills.push(`<span class="pill">🌕 Vollmond</span>`);

function updateMiniCal(){
  let y=state.miniYear,m=state.miniMonth;
  let hols=getHolidays(y);
  document.getElementById('miniLabel').textContent=`${mNames[m].substr(0,3)} ${y}`;
  let days=new Date(y,m+1,0).getDate(),shift=(new Date(y,m,1).getDay()+6)%7;
  let html='<tr>';
  [1,2,3,4,5,6,0].map(i=>dNames[i]).forEach(d=>{html+=`<th>${d}</th>`;});

  while(d<=days){
    html+='<tr>';

      if(d<1||d>days){html+='<td></td>';continue;}

      let hasEv=getEventsForDay(y,m,d).length>0;

function updateUpcoming(){
  let items=[],seenUp=new Set();
  for(let di=0;di<=90;di++){
    // Datum über Kalender-Arithmetik statt Millisekunden (DST-sicher)
    let dt=new Date(today.getFullYear(),today.getMonth(),today.getDate()+di);
    let y=dt.getFullYear(),m=dt.getMonth(),d=dt.getDate();
    getEventsForDay(y,m,d).forEach(ev=>{
      if(seenUp.has(ev._key||ev.id))return; // jeder Termin nur mit seinem NÄCHSTEN Vorkommen
      seenUp.add(ev._key||ev.id);
      items.push({ev,date:dt,days:di});
    });
    if(items.length>=8)break;
  }
  if(!items.length){document.getElementById('upcomingItems').innerHTML='<div class="upcoming-item"><div class="udate">Keine Termine</div></div>';return;}
  document.getElementById('upcomingItems').innerHTML=items.map(({ev,date,days})=>{
    let cat=getCat(ev.categoryId);
    let dStr=days===0?'Heute':days===1?'Morgen':`${date.getDate()}. ${mNames[date.getMonth()].substr(0,3)}.`;
    return`<div class="upcoming-item" onclick="openEventModal('${ev.id}',null,'${fmtDate(date.getFullYear(),date.getMonth(),date.getDate())}')" oncontextmenu="evChipMenu(event,'${ev.id}','${fmtDate(date.getFullYear(),date.getMonth(),date.getDate())}')">
      <div class="udate"><span class="ev-dot" style="background:${cat.color}"></span>${dStr}${ev.time?' · '+evTimeOn(ev,date.getFullYear(),date.getMonth(),date.getDate()):''}</div>
      <div class="utitle">${cat.emoji} ${dispT(ev,date.getFullYear(),date.getMonth(),date.getDate())}</div>
    </div>`;
  }).join('');
}

/* V2.3 (Punkt 7): Tagesübersicht (Info-Leiste) für das AKTUELL gewählte
   Datum – wird jetzt zentral aus render() aufgerufen und bleibt dadurch
   beim Blättern durch Jahres-/Monats-/Wochen-/Tagesansicht synchron.
   (Bisher aktualisierte nur der Klick in der Monatsansicht die Leiste,
   nach Ausflügen in andere Jahre blieb dort das alte Datum stehen.) */
function updateDayInfo(){
  let y=state.year,m=state.month,d=state.day;
  let date=new Date(y,m,d),hols=getHolidays(y),sp=getSpecial(y);
  let key=`${m+1}-${d}`;
  let info=[];
  if(hols[key])info.push(`🏛️ ${hols[key]}`);
  if(sp[key])info.push(`${sp[key].emoji} ${sp[key].label}`);
  if(isFullMoon(m,d,y))info.push('🌕 Vollmond');
  let evs=getEventsForDay(y,m,d);
  if(evs.length)info.push(`📋 ${evs.length} Termin${evs.length>1?'e':''}`);
  let cd=countdown(y,m,d);
  let dStr=`${dNamesLong[date.getDay()]}, ${d}. ${mNames[m]} ${y}`;
  document.getElementById('infoBar').innerHTML=`📅 ${dStr} · KW ${getISOWeek(date)} · Tag ${getDOY(date)} · <span class="cd">${cd}</span>${info.length?' · '+info.join(' · '):''}`;
}

/* ===== KOPIEREN & EINFÜGEN (V1.7, Monatsansicht) =====
   Rechtsklick (Handy: langer Fingerdruck) auf einen Termin-Chip -> „Kopieren";
   danach Zieltag mit Rechtsklick -> „Einfügen". Die Kopie bekommt eine neue
   ID; Uhrzeit, Farbe, Notizen, mehrtägige Dauer und Wiederholung bleiben
   erhalten. Serien-Ausnahmen (exdates) und Import-Kennungen werden NICHT
   mitkopiert – die Kopie startet sauber am Zieltag. */
let clipboardEv=null;
function copyEvent(id){
  let ev=evById(id); // V0.3: auch Grundplan-Einträge (werden als Einzeltermin kopiert)
  if(!ev)return;
  clipboardEv=JSON.parse(JSON.stringify(ev));
  delete clipboardEv.id;
  ['_plan','_slot','_mon','_mod','_extra','_key'].forEach(k=>delete clipboardEv[k]); // V0.3
  delete clipboardEv.importUid; // Kopie ist kein Import-Duplikat
  delete clipboardEv.hidden;    // V2.0: eingefügte Termine sind nie unsichtbar
  clipboardEv.exdates=[];       // Ausnahmen gehören zur alten Serie
  showToast(`📄 „${ev.title}" kopiert – Zieltag in der Monatsansicht mit Rechtsklick (Handy: lang drücken) → „Einfügen"`,false);
}
function pasteEvent(y,m,d){
  if(!clipboardEv)return;
  let toDate=fmtDate(y,m,d);
  let ev=JSON.parse(JSON.stringify(clipboardEv));
  // Mehrtägige Dauer beibehalten (Ende relativ zum neuen Beginn)
  if(ev.dateEnd&&ev.dateEnd>=ev.date){
    let dur=Math.round((parseDate(ev.dateEnd)-parseDate(ev.date))/86400000);
    let ne=parseDate(toDate);ne.setDate(ne.getDate()+dur);
    ev.dateEnd=fmtDate(ne.getFullYear(),ne.getMonth(),ne.getDate());
  }
  ev.date=toDate;
  // Serien-Ende vor dem neuen Beginn? Dann wäre die Kopie unsichtbar -> Ende entfernen
  if(ev.repeat&&ev.repeat!=='none'&&ev.repeatUntil&&ev.repeatUntil<toDate)ev.repeatUntil='';
  ev.id='ev_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);
  pushUndo(`Termin eingefügt: ${ev.title} (${fmtDisp(toDate)})`);
  DB.events.push(ev);
  saveDB();render();
  showToast(`📋 Eingefügt: ${ev.title} am ${fmtDisp(toDate)}${conflictSuffix(ev)}`,true);
}

/* V2.1: „Verschieben" aus dem Kontextmenü heraus (ohne Drag&Drop) –
   bei Serien wie beim Ziehen: nur das angeklickte Vorkommen wird verschoben. */
function moveEventPrompt(id,instDate){
  if(String(id).startsWith('pl:')){openPlanItemModal(id);return;} // V0.3
  let ev=DB.events.find(x=>x.id===id);
  if(!ev)return;
  let fromDate=instDate||ev.date;
  let inp=prompt(`Termin „${ev.title}" verschieben nach (JJJJ-MM-TT):`,fromDate);
  if(!inp)return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(inp)){alert('Bitte Format JJJJ-MM-TT verwenden.');return;}
  let chk=parseDate(inp);
  if(fmtDate(chk.getFullYear(),chk.getMonth(),chk.getDate())!==inp){alert('Ungültiges Kalenderdatum: '+inp);return;}
  if(inp===fromDate)return;
  if(ev.repeat&&ev.repeat!=='none'){
    moveInstance(id,fromDate,inp);
    return;
  }
  pushUndo(`Termin verschoben: ${ev.title} (${fmtDisp(fromDate)} → ${fmtDisp(inp)})`);
  if(ev.dateEnd&&ev.dateEnd>=ev.date){
    let dur=Math.round((parseDate(ev.dateEnd)-parseDate(ev.date))/86400000);
    let ne=parseDate(inp);ne.setDate(ne.getDate()+dur);
    ev.dateEnd=fmtDate(ne.getFullYear(),ne.getMonth(),ne.getDate());
  }
  ev.date=inp;
  saveDB();render();
  showToast(`↔ Termin verschoben: ${ev.title} → ${fmtDisp(inp)}${conflictSuffix(ev)}`,true);
}

/* ===== DRAG & DROP (Maus, Monatsansicht) ===== */
function dragEv(e,id,instDate){
  e.stopPropagation();
  e.dataTransfer.setData('text/plain',id+'|'+instDate);
  // V2.1 Punkt 10: Strg/Umschalt beim Ziehen -> Kopieren statt Verschieben (nur Hinweis fürs OS-Icon;
  // die tatsächliche Entscheidung fällt beim Ablegen anhand der dort gedrückten Taste, s.u.)
  e.dataTransfer.effectAllowed=(e.ctrlKey||e.shiftKey)?'copy':'move';
}
function dropEv(e,y,m,d){
  e.preventDefault();e.stopPropagation();
  e.currentTarget.style.background='';
  let data=e.dataTransfer.getData('text/plain');
  if(!data||!data.includes('|'))return;
  let[id,fromDate]=data.split('|');
  if(id.startsWith('pl:')){let pv=plVirtual(id);if(pv)plMoveItem(id,fmtDate(y,m,d),toMin(pv.time),e.ctrlKey||e.shiftKey);return;} // V0.3
  let ev=DB.events.find(x=>x.id===id);
  if(!ev)return;
  let toDate=fmtDate(y,m,d);
  // V2.1 Punkt 10: Strg oder Umschalt gedrückt beim Ablegen -> Termin kopieren statt verschieben
  if(e.ctrlKey||e.shiftKey){
    copyEventToDate(id,fromDate,toDate);
    return;
  }
  if(toDate===fromDate)return;
  if(ev.repeat&&ev.repeat!=='none'){
    if(confirm(`Serientermin „${ev.title}":\nNur das Vorkommen vom ${fmtDisp(fromDate)} auf ${fmtDisp(toDate)} verschieben?\n(Ganze Serie: Termin öffnen und Beginn-Datum ändern.)`)){
      moveInstance(id,fromDate,toDate);
    }
    return;
  }
  // Einzeltermin: Datum verschieben, mehrtägige Dauer beibehalten
  pushUndo(`Termin verschoben: ${ev.title} (${fmtDisp(fromDate)} → ${fmtDisp(toDate)})`);
  if(ev.dateEnd&&ev.dateEnd>=ev.date){
    let dur=Math.round((parseDate(ev.dateEnd)-parseDate(ev.date))/86400000);
    let ne=parseDate(toDate);ne.setDate(ne.getDate()+dur);
    ev.dateEnd=fmtDate(ne.getFullYear(),ne.getMonth(),ne.getDate());
  }
  ev.date=toDate;
  saveDB();render();
  showToast(`↔ Termin verschoben: ${ev.title} → ${fmtDisp(toDate)}${conflictSuffix(ev)}`,true);
}
/* V2.1 Punkt 10: Kopie eines Termins an einem neuen Datum erzeugen (Original bleibt unverändert) */
function copyEventToDate(id,fromDate,toDate){
  let ev=DB.events.find(x=>x.id===id);
  if(!ev)return;
  let copy=JSON.parse(JSON.stringify(ev));
  delete copy.importUid;delete copy.hidden;
  copy.exdates=[];
  if(copy.dateEnd&&copy.dateEnd>=copy.date){
    let dur=Math.round((parseDate(copy.dateEnd)-parseDate(copy.date))/86400000);
    let ne=parseDate(toDate);ne.setDate(ne.getDate()+dur);
    copy.dateEnd=fmtDate(ne.getFullYear(),ne.getMonth(),ne.getDate());
  }else copy.dateEnd='';
  copy.date=toDate;
  // Die Kopie entsteht als eigenständiger Einzeltermin (auch wenn das Original eine Serie ist) –
  // konsistent mit „Nur dieses Vorkommen verschieben"; die Original-Serie bleibt unangetastet.
  if(copy.repeat&&copy.repeat!=='none'){copy.repeat='none';copy.repeatUntil='';copy.repeatCount='';}
  copy.id='ev_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);
  pushUndo(`Termin kopiert: ${ev.title} (${fmtDisp(toDate)})`);
  DB.events.push(copy);
  saveDB();render();
  showToast(`📄 Termin kopiert: ${ev.title} → ${fmtDisp(toDate)}${conflictSuffix(copy)}`,true);
}
/* V2.1 Punkt 11: Ablegen eines gezogenen Termins direkt auf einem bestehenden Termin-Chip -> Zusammenführen */
function dropOnEvent(e,targetId,targetInstDate){
  e.preventDefault();e.stopPropagation();
  let data=e.dataTransfer.getData('text/plain');
  if(!data||!data.includes('|'))return;
  let[srcId,srcInstDate]=data.split('|');
  if(srcId===targetId)return;
  mergeEvents(srcId,srcInstDate,targetId,targetInstDate);
}
/* Führt zwei Termine zu einem zusammen: Zieltermin behält sein Datum, bekommt
   aber beide Bezeichnungen (getrennt mit „+") und beide Notizen (getrennt mit „---").
   Der gezogene Termin wird entfernt (bei Serien nur das gezogene Vorkommen als Ausnahme). */
function mergeEvents(srcId,srcDate,targetId,targetDate){
  let src=DB.events.find(x=>x.id===srcId);
  let tgt=DB.events.find(x=>x.id===targetId);
  if(!src||!tgt)return;
  if(!confirm(`Termine zusammenführen?\n\n„${src.title}" (${fmtDisp(srcDate)})\nmit\n„${tgt.title}" (${fmtDisp(targetDate)})\n\nEs entsteht EIN gemeinsamer Termin am ${fmtDisp(targetDate)} mit beiden Bezeichnungen und Notizen.`))return;
  pushUndo(`Termine zusammengeführt: ${src.title} + ${tgt.title}`);
  if(tgt.title!==src.title)tgt.title=`${tgt.title} + ${src.title}`;
  let notesParts=[tgt.notes,src.notes].map(n=>(n||'').trim()).filter(Boolean);
  tgt.notes=notesParts.join('\n---\n');
  if(src.repeat&&src.repeat!=='none'){
    src.exdates=src.exdates||[];
    if(!src.exdates.includes(srcDate))src.exdates.push(srcDate);
  }else{
    DB.events=DB.events.filter(e=>e.id!==src.id);
  }
  saveDB();render();
  showToast(`🔗 Termine zusammengeführt: ${tgt.title}${conflictSuffix(tgt)}`,true);
}

  /* V1.8: Fokus-Falle – bei offenem Dialog bleibt der Tab-Fokus im Dialog
     (role="dialog"/aria-modal allein erzwingen das nicht). Am Ende springt
     Tab zum ersten Element zurück, Shift+Tab am Anfang zum letzten; liegt
     der Fokus außerhalb (z.B. direkt nach dem Öffnen), holt Tab ihn herein. */
  if(e.key==='Tab'&&document.getElementById('overlay').classList.contains('show')){
    let modal=document.getElementById('modal');
    let f=[...modal.querySelectorAll('button,input,select,textarea,a[href],[tabindex]:not([tabindex="-1"])')]
      .filter(el=>!el.disabled&&el.offsetParent!==null);
    if(!f.length)return;
    let first=f[0],last=f[f.length-1],a=document.activeElement;
    if(!modal.contains(a)){e.preventDefault();(e.shiftKey?last:first).focus();}
    else if(!e.shiftKey&&a===last){e.preventDefault();first.focus();}
    else if(e.shiftKey&&a===first){e.preventDefault();last.focus();}
  }
});

let editingId=null,currentTab=0,formData={},instanceDate=null; // V2.8: ungenutztes prefillDate entfernt

  formData._colorTouched=!!(ev&&ev.color&&ev.color.toLowerCase()!==getCat(ev.categoryId).color.toLowerCase());

  let instBtns='';

      <button class="btn-share" style="background:#8e44ad" onclick="moveInstancePrompt('${ev.id}','${instanceDate}')" title="Verschiebt NUR den ${fmtDisp(instanceDate)} – die Serie bleibt erhalten">Nur dieses Vorkommen verschieben</button>`;

          <button class="btn-share" style="background:#16a085" onclick="copyEvent('${ev.id}');closeModal()" title="Kopiert diesen Termin – Zieltag in der Monatsansicht mit Rechtsklick (Handy: lang drücken) → Einfügen">📄 Kopieren</button>`:''}
    <div style="flex:1"></div>
    <button class="btn-cancel" onclick="closeModal()">Abbrechen</button>
    <button class="btn-ok" onclick="saveEvent()">OK</button>`;
  currentTab=0;switchTab(0);
}

/* Einzelnes Vorkommen einer Serie löschen (Ausnahme-Datum) */
function deleteInstance(id,dateStr){
  let ev=DB.events.find(e=>e.id===id);
  if(!ev)return;
  if(!SETTINGS.noConfirmDelete&&!confirm(`NUR dieses Vorkommen löschen?\n\n„${ev.title}" am ${fmtDisp(dateStr)}\n\nAlle anderen Termine der Serie bleiben erhalten.`))return;
  pushUndo(`Vorkommen gelöscht: ${ev.title} (${fmtDisp(dateStr)})`);
  ev.exdates=ev.exdates||[];
  if(!ev.exdates.includes(dateStr))ev.exdates.push(dateStr);
  saveDB();closeModal();render();
  showToast(`🗑 Nur das Vorkommen am ${fmtDisp(dateStr)} gelöscht („${ev.title}")`,true);
}
/* Einzelnes Vorkommen verschieben: Ausnahme + eigenständige Kopie am Zieltag */
function moveInstance(id,fromDate,toDate){
  let ev=DB.events.find(e=>e.id===id);
  if(!ev||!toDate||toDate===fromDate)return false;
  pushUndo(`Vorkommen verschoben: ${ev.title} (${fmtDisp(fromDate)} → ${fmtDisp(toDate)})`);
  ev.exdates=ev.exdates||[];
  if(!ev.exdates.includes(fromDate))ev.exdates.push(fromDate);
  let copy={...ev,id:'ev_'+Date.now()+'_'+Math.random().toString(36).substr(2,6),
    date:toDate,dateEnd:'',repeat:'none',repeatUntil:'',repeatCount:'',exdates:[],
    notes:(ev.notes?ev.notes+'\n':'')+`(verschoben von ${fmtDisp(fromDate)})`};
  // Uhrzeiten (time/timeEnd) bleiben erhalten; mehrtägige Dauer übertragen
  if(ev.dateEnd&&ev.dateEnd>ev.date){
    let dur=Math.round((parseDate(ev.dateEnd)-parseDate(ev.date))/86400000);
    let ne=parseDate(toDate);ne.setDate(ne.getDate()+dur);
    copy.dateEnd=fmtDate(ne.getFullYear(),ne.getMonth(),ne.getDate());
  }
  delete copy.importUid;
  DB.events.push(copy);
  saveDB();render();
  showToast(`↔ Vorkommen verschoben: ${ev.title} → ${fmtDisp(toDate)}${conflictSuffix(copy)}`,true);
  return true;
}
function moveInstancePrompt(id,fromDate){
  let inp=prompt('Vorkommen verschieben nach (JJJJ-MM-TT):',fromDate);
  if(!inp)return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(inp)){alert('Bitte Format JJJJ-MM-TT verwenden.');return;}
  let chk=parseDate(inp); // ungültige Daten wie 2026-02-31 würden sonst stillschweigend "überrollen"
  if(fmtDate(chk.getFullYear(),chk.getMonth(),chk.getDate())!==inp){alert('Ungültiges Kalenderdatum: '+inp);return;}
  if(moveInstance(id,fromDate,inp)){closeModal();}
}

/* Konflikterkennung */
function toMin(t){let[h,m]=t.split(':').map(Number);return h*60+m;}
/* V2.2: Zeitfenster eines Termins an einem KONKRETEN Tag, in Minuten [von,bis).
   Semantik wie im ICS-Export: Beginn-Uhrzeit gilt am ersten Tag, End-Uhrzeit
   am letzten Tag, Zwischentage sind durchgehend (0–24 Uhr) belegt.
   Rückgabe null, wenn der Termin keine Uhrzeit hat oder an dem Tag gar nicht
   vorkommt. Ohne Endzeit gilt wie bisher +60 Minuten Standarddauer. */
function timeWindowOnDate(ev,dateStr){
  if(!ev.time)return null;
  // V2.4 (Punkt 2): Stundenserien werden mit der ERSTEN berechneten Uhrzeit
  // des jeweiligen Tages geprüft (Dauer = Endzeit−Anfangszeit bzw. 60 Min),
  // nicht mehr mit der statischen Anfangszeit des Serienstarts.
  if(isHourSeries(ev)){
    let[yy,mo,dd]=dateStr.split('-').map(Number);
    let ts=hourOccTimesOn(ev,yy,mo-1,dd);
    if(!ts.length)return null;
    let s0=toMin(ts[0]);
    let dur=(ev.timeEnd&&toMin(ev.timeEnd)>toMin(ev.time))?toMin(ev.timeEnd)-toMin(ev.time):60;
    return[s0,Math.min(s0+dur,1440)];
  }
  let s=toMin(ev.time);
  let isSerie=ev.repeat&&ev.repeat!=='none';
  let de=(!isSerie&&ev.dateEnd&&ev.dateEnd>=ev.date)?ev.dateEnd:ev.date;
  if(ev.date===de){ // eintägig
    let e=ev.timeEnd?toMin(ev.timeEnd):s+60;
    if(e<=s)e=s+60; // Altbestand mit inverser Endzeit: defensiv wie bisher
    return[s,e];
  }
  // mehrtägig (nur ohne Wiederholung möglich)
  if(dateStr===ev.date)return[s,1440];
  if(dateStr===de){
    // Endtag: bis zur Endzeit; ohne Endzeit wie im ICS-Export Beginn+60 Min
    let e=ev.timeEnd?toMin(ev.timeEnd):Math.min(s+60,1440);
    return[0,Math.max(e,1)]; // nie leeres Fenster (Endzeit 00:00 -> 1 Minute)
  }
  return[0,1440]; // Zwischentag
}
/* Kern: Zeitüberlappung von ev mit anderen Terminen an einem konkreten Tag */
function findConflictOnDate(ev,dateObj,selfId){
  let dStr=fmtDate(dateObj.getFullYear(),dateObj.getMonth(),dateObj.getDate());
  let w1=timeWindowOnDate(ev,dStr);
  if(!w1)return null;
  let others=getEventsForDay(dateObj.getFullYear(),dateObj.getMonth(),dateObj.getDate(),true)
    .filter(o=>o.id!==selfId&&o.time);
  for(let o of others){
    let w2=timeWindowOnDate(o,dStr);
    if(!w2)continue;
    if(w1[0]<w2[1]&&w2[0]<w1[1])return o;
  }
  return null;
}
/* Für Speichern: Einzeltermin -> alle Tage seines Zeitraums (V2.2, bisher nur
   der Starttag); Serie -> BEWUSST nur die nächsten 90 Tage ab heute bzw. ab
   Serienstart (Performance-Kompromiss: eine Serie „alle 6 Monate" mit
   nächstem Vorkommen jenseits dieses Fensters wird beim Speichern nicht
   gewarnt – das ⚠️ in der Tagesansicht zeigt den Konflikt dort trotzdem). */
function findConflict(ev,selfId){
  if(!ev.time)return null;
  if(!ev.repeat||ev.repeat==='none'){
    let s=parseDate(ev.date);
    let de=(ev.dateEnd&&ev.dateEnd>=ev.date)?parseDate(ev.dateEnd):s;
    let nDays=Math.min(Math.round((de-s)/86400000),366); // Sicherheitsdeckel
    for(let i=0;i<=nDays;i++){
      let t=new Date(s.getFullYear(),s.getMonth(),s.getDate()+i);
      let c=findConflictOnDate(ev,t,selfId);
      if(c)return{...c,__conflictDate:fmtDate(t.getFullYear(),t.getMonth(),t.getDate())};
    }
    return null;
  }
  let s=parseDate(ev.date);
  let from=s>today?s:new Date(today);
  for(let i=0;i<90;i++){
    let t=new Date(from.getFullYear(),from.getMonth(),from.getDate()+i);
    if(!occursOn(ev,t.getFullYear(),t.getMonth(),t.getDate()))continue;
    let c=findConflictOnDate(ev,t,selfId);
    if(c)return{...c,__conflictDate:fmtDate(t.getFullYear(),t.getMonth(),t.getDate())};
  }
  return null;
}
/* V2.2: Kurzer Warnanhang für Bestätigungs-Toasts nach Verschieben/Einfügen/
   Kopieren/Zusammenführen – NICHT blockierend (der Rückgängig-Knopf steht
   direkt daneben); beim regulären Speichern fragt weiterhin ein confirm. */
function conflictSuffix(ev){
  let c=findConflict(ev,ev.id);
  return c?` – ⚠️ Überschneidung mit „${c.title}"${c.time?' um '+c.time:''}${c.__conflictDate?' am '+fmtDisp(c.__conflictDate):''}`:'';
}

/* Sichert Eingaben des aktuell sichtbaren Tabs nach formData */
function captureTab(){
  let g=id=>document.getElementById(id);
  if(g('fTitle')){
    formData.categoryId=g('fCat').value;
    formData.title=g('fTitle').value;
    formData.notes=g('fNotes').value;
    formData.date=g('fDate').value;
    formData.time=g('fTime').value;
    formData.dateEnd=g('fDateEnd').value;
    formData.timeEnd=g('fTimeEnd').value;
    formData.reminder=parseInt(g('fReminder').value||'0');
    if(g('fAlert'))formData.alertMin=g('fAlert').value; // V0.6
    formData.color=g('fColor').value;
    // V2.1: Schriftfarbe nur speichern, wenn "automatisch" abgewählt wurde
    formData.textColor=(g('fTextColorAuto')&&!g('fTextColorAuto').checked&&g('fTextColor'))?g('fTextColor').value:'';
    if(g('fChipStyle'))formData.chipStyle=g('fChipStyle').value; // V2.4 (Punkt 1)
    if(g('fDeathDate'))formData.deathDate=g('fDeathDate').value; // V2.7
  }
  if(document.querySelector('input[name="rep"]')){
    formData.repeat=document.querySelector('input[name="rep"]:checked')?.value||'none';
    if(g('rInt'))formData.repeatInterval=g('rInt').value;
    if(g('rUnit'))formData.repeatUnit=g('rUnit').value;
    if(g('rOrd'))formData.repeatOrd=g('rOrd').value;
    if(g('rWd'))formData.repeatWd=g('rWd').value;
    if(g('rMonth'))formData.repeatMonth=g('rMonth').value;
    if(g('rSkipHol'))formData.skipHolidays=g('rSkipHol').checked;
    let rend=document.querySelector('input[name="rend"]:checked')?.value;
    formData.repeatUntil=(rend==='date'&&g('rUntil'))?g('rUntil').value:'';
    formData.repeatCount=(rend==='count'&&g('rCount'))?g('rCount').value:'';
    if(g('wd0')){let w='';for(let i=0;i<7;i++)w+=g('wd'+i).checked?'1':'0';formData.wdMask=w;}
    if(g('mo0')){let mm='';for(let i=0;i<12;i++)mm+=g('mo'+i).checked?'1':'0';formData.moMask=mm;}
  }
  if(g('fRelative')){
    formData.relative=g('fRelative').value;
    formData.offset=parseInt(g('fOffset').value||'0');
    formData.displayType=document.querySelector('input[name="dtype"]:checked')?.value||'termin';
  }
}
