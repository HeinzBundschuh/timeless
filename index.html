  V1.1 (22.10.2026): WÜNSCHE AUS DEM ALLTAGSTEST (Heinz):
        (1) BESCHRIFTUNG BLEIBT SICHTBAR: Lange Termine im Zeitraster nehmen
            Titel und Uhrzeit beim Scrollen mit, solange der Termin zu sehen ist.
        (2) AUFZIEHEN ÜBER MEHRERE TAGE (Woche): Beim Aufziehen eines neuen
            Termins zusätzlich nach links/rechts ziehen – der Termin wird an
            jedem überstrichenen Tag zur selben Zeit angelegt (ein Dialog,
            ein Rückgängig).
        (3) MONAT: in einer freien Stelle eines Tages drücken und über weitere
            Tage ziehen – der neue Termin entsteht an allen markierten Tagen.
        (4) MONAT: Die Tage des Vor- und Folgemonats in der ersten und letzten
            Zeile werden angezeigt (blass) und nehmen gezogene Termine an –
            z.B. vom 1. Oktober auf den 30. September.
        (5) RÜCKGÄNGIG: Nach einem Rückgängig bleibt der Knopf in der Info-Leiste
            stehen, solange es weitere Schritte gibt.
        (6) LÖSCHEN PER ×: Beim Darüberfahren erscheint an jedem Termin in
            Tag, Woche und Monat ein × zum Löschen (bei Serien nur dieses
            Vorkommen, bei Grundplan-Einträgen je nach „alle Wochen/nur diese
            Woche"; Nachfrage wie unter ⚙️ eingestellt, Rückgängig möglich).

  V0.3 (20.10.2026): VORLAGEN, GRUNDPLAN UND FERIEN (aus timetable):
        (1) VORLAGEN in der Seitenleiste (Name, Kürzel, Kategorie, Farbe,
            Dauer, übliche Uhrzeit, Notiz) – verwalten über „+ Vorlage" bzw.

            Eine Vorlage ins Zeitraster, in die Ganztagszeile oder auf einen
            Monatstag ziehen – oder anklicken (Pinsel) und dann die Stelle
            anklicken; Strg+Klick setzt weitere, Esc legt den Pinsel ab.
            „Ablegen als": Einzeltermin oder Eintrag im Grundplan.
        (2) GRUNDPLAN: Wochenplan aus Vorlagen, der Woche für Woche gilt
            (gilt ab/bis, Feiertage und Ferien wahlweise ausgelassen).
            Einträge erscheinen in allen Ansichten und lassen sich ziehen und
            verlängern. Änderungen gelten wahlweise für ALLE WOCHEN (ab der
            aktuellen Woche) oder NUR DIESE WOCHE (Punkt in der Ecke = weicht
            ab; „Woche auf Grundplan zurücksetzen"). VERGANGENE WOCHEN behalten
            ihren damaligen Stand (Nachkontrolle) und sind gesperrt, bis sie
            ausdrücklich „von Hand" geändert werden. Mehrere Pläne möglich.
        (3) FERIEN und schulfreie Tage: Burgenland 2026/27 vorbelegt, für
            weitere Schuljahre berechenbar, frei bearbeitbar; schraffiert in
            Woche/Tag, beschriftet im Monat. Vorlagen, Grundplan und Ferien
            sind Teil von JSON-Sicherung und Datendatei.
  V0.2 (20.10.2026): DIREKTES ARBEITEN IM ZEITRASTER (Woche + Tag):
        (1) ZIEHEN: Termin mit der Maus an eine andere Uhrzeit oder einen
            anderen Tag ziehen (Viertelstunden-Raster); die Dauer bleibt.
            Mit gedrückter Strg-/Umschalttaste wird KOPIERT. Am Handy: kurz
            gedrückt halten, dann ziehen (gedrückt halten + loslassen öffnet
            wie bisher das Menü). Über-Mitternacht-Termine wandern als Ganzes.
            Serien: nur das gezogene Vorkommen wird verschoben (Ausnahme +
            Einzeltermin wie bisher beim Ziehen in der Monatsansicht).
        (2) VERLÄNGERN/VERKÜRZEN: unteren Rand eines Termins ziehen. Bei
            Serien wird nachgefragt, ob die Dauer für die ganze Serie gilt.
        (3) AUFZIEHEN: in einer freien Stelle drücken und nach unten ziehen –
            der neue Termin bekommt genau diesen Zeitraum.
        (4) NACHRÜCKEN (aus dem Terminbuch): Landet ein verschobener oder
            verlängerter Termin auf belegter Zeit, werden die betroffenen
            Termine des Tages mit ihrer neuen Uhrzeit angezeigt; wahlweise
            „Nachrücken" oder „Überlappen lassen". Ein Rückgängig nimmt
            Verschieben und Nachrücken gemeinsam zurück.
        Esc bricht ein laufendes Ziehen ab. Stundenserien und Termine relativ
        zu Ostern/Advent bleiben vom Ziehen ausgenommen (Dialog verwenden).

        (3) DATENDATEI (aus timetable): In Chrome/Edge wird der ganze Kalender

  --page:#15181c;--surface:#1f242a;--surface2:#272d34;--surface3:#232930;

  --text:#e6e9ec;--text2:#c7cdd3;--muted:#9aa3ab;--muted2:#6d767e;
  --hover:#2e3a45;
  --tint-hol:#3d2e17;--tint-moon:#3b3517;--tint-dup:#3a301c;--tint-err:#40221f;
}
body.dark #calGrid td.other-month{background:var(--page)}
body.dark .imp-tools button{background:var(--surface3);color:var(--text)}
body{font-family:"Segoe UI",sans-serif;background:var(--page);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

/* TOP BAR */
#topbar{background:var(--bg);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;position:sticky;top:0;z-index:200}
#topbar h1{font-size:14px;font-weight:600;margin-right:4px;white-space:nowrap}
.nav-btn{background:rgba(255,255,255,.15);border:none;color:#fff;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600}
.nav-btn:hover{background:rgba(255,255,255,.3)}
#curLabel{font-size:14px;font-weight:600;min-width:140px;text-align:center}
.view-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;padding:4px 9px;border-radius:4px;cursor:pointer;font-size:12px}
.view-btn.active,.view-btn:hover{background:rgba(255,255,255,.3)}
.gap{flex:1}
.icon-btn{background:rgba(255,255,255,.15);border:none;color:#fff;padding:5px 10px;border-radius:4px;cursor:pointer;font-size:12px;white-space:nowrap}
.icon-btn:hover{background:rgba(255,255,255,.3)}
/* V3.0 (Punkt 1): Rückgängig-Knopf – ausgegraut, wenn nichts rückgängig zu machen ist */
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn:disabled:hover{background:rgba(255,255,255,.15)}
.undo-cnt{display:inline-block;min-width:16px;margin-left:5px;padding:0 4px;border-radius:8px;background:#f1c40f;color:#2c3e50;font-size:10px;font-weight:700;line-height:15px;text-align:center}
.undo-cnt:empty{display:none}
@media(max-width:1279px){.undo-lbl{display:none}} /* schmal: nur „↩“ – Kopfleiste bleibt einzeilig */

/* INFO BAR */
#infoBar{background:var(--bar);color:#ecf0f1;padding:6px 16px;font-size:12px;text-align:center;min-height:30px}
#infoBar .cd{color:#f1c40f;font-weight:600}

/* MAIN */
#main{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
#sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
#sidebar h3{background:var(--bg);color:#fff;padding:8px 12px;font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
#miniCal{padding:8px}
.mini-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mini-nav span{font-size:12px;font-weight:600}
.mini-nav button{background:none;border:none;cursor:pointer;font-size:14px;color:var(--bgtext);padding:2px 6px}
#miniGrid{width:100%;border-collapse:collapse;font-size:11px}
#miniGrid th{text-align:center;padding:2px;color:var(--muted);font-weight:600}
#miniGrid td{text-align:center;padding:3px 2px;cursor:pointer;border-radius:3px}
#miniGrid td:hover{background:var(--hover)}
#miniGrid td.mini-today{background:var(--today);color:#fff;border-radius:3px}
#miniGrid td.mini-sel{outline:2px solid #8e44ad;outline-offset:-1px}
#miniGrid td.mini-hol{color:var(--holiday)}
#miniGrid td.mini-we{color:var(--weekend)}
#miniGrid td.mini-event{font-weight:700;text-decoration:underline}

#upcomingList{flex:1;overflow-y:auto}
#upcomingList h3{position:sticky;top:0}
.upcoming-item{padding:6px 10px;border-bottom:1px solid var(--border3);font-size:11px;cursor:pointer}
.upcoming-item:hover{background:var(--surface3)}
.upcoming-item .udate{color:var(--muted);font-size:10px}
.upcoming-item .utitle{font-weight:600;margin-top:1px}
.ev-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}

/* CONTENT */
#content{flex:1;overflow:auto;padding:12px}

/* YEAR VIEW */
#yearView{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:700px){#yearView{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){#yearView{grid-template-columns:1fr}}
.mini-month{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px}
.mini-month h4{text-align:center;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--bgtext);margin-bottom:5px;cursor:pointer}
.mini-month h4:hover{text-decoration:underline}
.mini-month table{width:100%;border-collapse:collapse;font-size:10px}
.mini-month th{text-align:center;color:var(--muted);font-weight:600;padding:1px}
.mini-month td{text-align:center;padding:2px 1px;cursor:pointer;border-radius:2px;position:relative}
.mini-month td:hover{background:var(--hover)}
.mini-month td.mmy-today{background:var(--today);color:#fff;border-radius:3px}
.mini-month td.mmy-hol{color:var(--holiday);font-weight:600}
.mini-month td.mmy-we{color:var(--weekend)}
.mini-month td.mmy-event::after{content:'';position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--event-termin)}
/* V1.9: Kalenderwochen in der Jahresansicht – schmale Spalte, Gesamtgröße unverändert */
.mini-month th.mmy-kw{font-size:7px;color:var(--muted2);width:14px;padding:1px 0;font-weight:600}
.mini-month td.mmy-kw{font-size:7px;color:var(--muted2);padding:2px 0;cursor:default;text-align:center}
.mini-month td.mmy-kw:hover{background:none}

/* MONTH VIEW */
#monthView{}
.month-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.month-header h2{font-size:18px;font-weight:700}
#calGrid{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden}
#calGrid table{width:100%;border-collapse:collapse}
#calGrid th{background:var(--surface2);text-align:center;padding:6px 2px;font-size:12px;font-weight:700;color:var(--text2);border-bottom:2px solid var(--border)}
#calGrid td{border:1px solid var(--border2);vertical-align:top;padding:3px;min-height:72px;cursor:pointer;position:relative}
@media(max-width:600px){#calGrid td{min-height:44px;padding:1px}}
#calGrid td:hover{background:var(--hover)}
.kw-cell{background:var(--surface3) !important;font-size:10px;color:var(--muted);font-weight:600;text-align:center;padding:2px !important;min-height:0 !important;cursor:default !important;width:26px}
.day-num{font-size:13px;font-weight:700;line-height:1}
.day-num.we{color:var(--weekend)}
.day-num.hol{color:var(--holiday)}
.day-num.today{background:var(--today);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.hol-label{font-size:9px;color:var(--holiday);line-height:1.2;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* V2.3 (Punkt 3): besondere Tage in derselben Farbe wie Feiertage – alle
   fixen Kalendereinträge (Feiertage + besondere Tage) erscheinen einheitlich */
.spec-label{font-size:9px;color:var(--holiday);line-height:1.2;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-chip{font-size:9px;color:#fff;border-radius:2px;padding:1px 3px;margin-top:1px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;display:block}
.ev-chip:hover{opacity:.8}
.moon-icon{font-size:9px}
.other-month{color:var(--muted2)}

/* EVENT LIST */
#eventListSection{margin-top:10px;background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden}
#eventListSection h3{background:var(--surface2);padding:7px 12px;font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.ev-list-item{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border3);cursor:pointer}
.ev-list-item:hover{background:var(--surface3)}
.ev-list-item .ev-date{font-size:11px;color:var(--muted);min-width:70px}
.ev-list-item .ev-name{font-size:13px;font-weight:600;flex:1}
.ev-list-item .ev-cat{font-size:10px;color:var(--muted)}
.ev-list-item .ev-actions{display:flex;gap:4px}
.ev-actions button{background:none;border:1px solid var(--border);border-radius:3px;padding:2px 6px;font-size:10px;cursor:pointer}
.ev-actions button:hover{background:var(--border2)}
.empty-list{padding:16px;text-align:center;color:var(--muted2);font-size:13px}
.ev-sub{padding-left:34px;background:var(--surface3)}
.ev-sub .ev-name{font-weight:500}

/* DAY VIEW */
#dayView{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.day-view-header{background:var(--surface2);padding:10px 16px;font-size:16px;font-weight:700}
.day-slot{display:flex;gap:12px;padding:8px 16px;border-bottom:1px solid var(--border3);min-height:40px;cursor:pointer}
.day-slot:hover{background:var(--surface3)}
.day-slot-time{font-size:11px;color:var(--muted);min-width:50px;padding-top:2px}
.day-slot-events{flex:1}

/* WEEK VIEW */
#weekView{display:flex;flex-direction:column;gap:8px}
.week-day{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;cursor:pointer}
.week-day:hover{border-color:#aac}
.week-today{border:2px solid var(--today)}
.week-day-hdr{background:var(--surface2);padding:6px 12px;font-size:13px;font-weight:700;color:var(--text2)}
.week-day-hdr.we{color:var(--weekend)}
.week-day-hdr.hol{color:var(--holiday)}
.week-today .week-day-hdr{background:var(--today);color:#fff}
.week-day-body{padding:4px 8px}
.week-ev{padding:4px 8px;margin:3px 0;background:var(--surface3);border-radius:3px;font-size:13px;cursor:pointer}
.week-ev:hover{background:var(--hover)}
.week-ev-time{font-weight:700;color:var(--text2);margin-right:6px;font-size:12px}
.week-empty{padding:4px 8px;color:var(--muted2);font-size:12px}

/* LIST VIEW */
#listView{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.list-month-header{background:var(--bg);color:#fff;padding:6px 14px;font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.list-ev{display:flex;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border3);cursor:pointer;align-items:center}
.list-ev:hover{background:var(--surface3)}
.list-ev-date{font-size:12px;font-weight:600;min-width:80px;color:var(--text2)}
.list-ev-info{flex:1}
.list-ev-title{font-size:13px;font-weight:600}
.list-ev-cat{font-size:11px;color:var(--muted)}

/* MODAL OVERLAY */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:center;justify-content:center}
#overlay.show{display:flex}
#modal{background:var(--surface);border-radius:8px;width:min(520px,95vw);max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.modal-hdr{background:var(--bg);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-radius:8px 8px 0 0}
.modal-hdr h3{font-size:15px;font-weight:600}
.modal-hdr button{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;line-height:1}
.modal-tabs{display:flex;border-bottom:2px solid var(--border2);background:var(--surface3)}
.modal-tab{padding:10px 18px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px}
.modal-tab.active{color:var(--bgtext);border-bottom-color:var(--bgtext)}
.modal-body{padding:16px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:4px;font-size:13px;font-family:inherit;background:var(--surface);color:var(--text)}
.rep-controls select,.rep-controls input,#modal textarea,#modal input[type=number],#modal input[type=date],#modal input[type=time]{background:var(--surface);color:var(--text)}
.form-row textarea{height:60px;resize:vertical}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:var(--bgtext)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.radio-group{display:flex;flex-direction:column;gap:6px}
.radio-row{display:flex;align-items:center;gap:8px;font-size:13px}
.radio-row input[type=radio]{accent-color:var(--bgtext)}
.modal-footer{padding:12px 16px;border-top:1px solid var(--border2);display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.modal-footer button{flex:1 1 auto;min-width:96px;max-width:100%;padding:9px 8px;font-size:12px;font-weight:600;white-space:nowrap;box-sizing:border-box}
.btn-ok{background:var(--bg);color:#fff;border:none;padding:8px 20px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600}
.btn-ok:hover{background:var(--bar)}
.btn-cancel{background:var(--surface);color:var(--text2);border:1px solid var(--border);padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px}
.btn-cancel:hover{background:var(--border3)}
.btn-del{background:#c0392b;color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px}
.btn-share{background:#2980b9;color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px}
.repeat-details{background:var(--surface3);border-radius:4px;padding:10px;margin-top:6px}
.repeat-details label{font-size:11px;color:var(--muted);font-weight:600;margin-top:6px}
.checkrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.checkrow label{display:flex;align-items:center;gap:3px;font-size:11px;cursor:pointer}
.checkrow input{accent-color:var(--bgtext)}

/* V2.0: Sichtbarkeit – gedimmte (ausgeblendete) Einträge in den Terminlisten */
.ev-list-item.ev-off{opacity:.45}
.ev-list-item.ev-off:hover{opacity:.75}
/* V2.0: Hinweisleiste „Ausgeblendet" über dem Monatsgitter */
.hidden-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 10px;margin:0 0 8px;background:var(--surface2);border:1px dashed var(--border);border-radius:6px;font-size:12px;color:var(--text2)}
.hidden-pill{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:2px 9px;cursor:pointer;font-size:11px;color:var(--text)}
.hidden-pill:hover{background:var(--hover)}
/* CAT MANAGER */
.cat-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border3)}
/* V2.0: Anzeigen-Schalter je Kategorie */
.cat-toggle{position:relative;width:34px;height:18px;flex-shrink:0;cursor:pointer;display:inline-block}
.cat-toggle input{opacity:0;width:0;height:0;position:absolute}
.cat-slider{position:absolute;inset:0;background:var(--muted2);border-radius:10px;transition:background .2s}
.cat-slider:before{content:'';position:absolute;width:14px;height:14px;left:2px;top:2px;background:#fff;border-radius:50%;transition:transform .2s}
.cat-toggle input:checked+.cat-slider{background:var(--today)}
.cat-toggle input:checked+.cat-slider:before{transform:translateX(16px)}
.cat-item.cat-off .cat-swatch,.cat-item.cat-off .cat-em,.cat-item.cat-off .cat-name{opacity:.45}
.cat-swatch{width:16px;height:16px;border-radius:3px;flex-shrink:0}
.cat-name{flex:1;font-size:13px;font-weight:600}
.cat-em{font-size:16px}
.cat-btns{display:flex;gap:4px}
.cat-btns button{background:none;border:1px solid var(--border);border-radius:3px;padding:2px 7px;font-size:11px;cursor:pointer}
.cat-btns button:hover{background:var(--border2)}

/* ICS */
.ics-section{margin-bottom:14px;padding:12px;background:var(--surface3);border-radius:4px}
.ics-section h4{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}

/* UNDO-TOAST (V1.6) */
.undo-btn{background:#f1c40f;color:#2c3e50;border:none;border-radius:4px;padding:3px 12px;margin-left:10px;cursor:pointer;font-size:12px;font-weight:700;vertical-align:middle}
.undo-btn:hover{background:#f7d84a}

/* ICS-IMPORT-VORSCHAU (V1.6) */
.imp-tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.imp-tools button{font-size:11px;padding:4px 8px;border:1px solid var(--border);background:var(--surface);border-radius:4px;cursor:pointer;white-space:nowrap}
.imp-tools button:hover{background:var(--border2)}
.imp-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--border3);font-size:12px}
.imp-row.dup{background:var(--tint-dup)}
.imp-row.err{background:var(--tint-err)}
.imp-badge{font-size:9px;font-weight:700;border-radius:3px;padding:2px 6px;color:#fff;flex-shrink:0;letter-spacing:.5px}
.imp-title{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.imp-date{color:var(--muted);font-size:11px;flex-shrink:0;text-align:right}
.imp-row.err .imp-date{color:#a33}

/* CONTEXT MENU */
#ctxMenu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:600;display:none;min-width:160px}
#ctxMenu.show{display:block}
.ctx-item{padding:8px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px}
.ctx-item:hover{background:var(--hover)}
.ctx-sep{height:1px;background:var(--border2);margin:3px 0}

/* Wiederholungs-Optionen: Radio+Label in einer Zeile, Auswahlfelder darunter eingerückt */
.rep-opt{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.rep-opt input[type=radio]{flex:0 0 auto;width:18px;height:18px;accent-color:var(--bgtext);margin:0}
.rep-opt input[type=checkbox]{flex:0 0 auto;width:18px;height:18px;accent-color:var(--bgtext);margin:0}
.rep-opt span{flex:1}
.rep-block{display:flex;flex-direction:column;gap:6px}
.rep-controls{display:flex;gap:8px;padding-left:26px}
.rep-controls select,.rep-controls input{padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:13px;font-family:inherit}

/* ===== MOBILE / RESPONSIVE ===== */
@media(max-width:820px){
  #main{flex-direction:column;overflow:visible}
  #content{order:1;padding:8px;overflow:visible}
  #sidebar{order:2;width:100%;border-right:none;border-top:2px solid var(--border);flex-direction:column}
  #sidebar #miniCal{max-width:340px;margin:0 auto}
  #calGrid table{table-layout:fixed}
  #calGrid td{min-height:60px}
  #calGrid th{font-size:11px;padding:5px 1px}
  .kw-cell{width:20px;font-size:9px}
  .day-num{font-size:12px}
  .ev-chip,.hol-label,.spec-label{font-size:8px}
  #topbar h1{font-size:13px}
  #topbar{gap:6px;padding:7px 8px}
  #curLabel{min-width:auto;flex:1 1 100%;order:-1;text-align:left;font-size:15px}
  body{overflow-y:auto}
}
@media(max-width:480px){
  #calGrid td{min-height:46px;padding:1px}
  #calGrid th{font-size:10px}
  .kw-cell{width:16px}
  .view-btn,.icon-btn{padding:5px 8px;font-size:12px}
  .nav-btn{padding:5px 10px}
}

/* ===================== TIMELESS V0.1 – NEUE OPTIK =====================
   Farbsystem aus Terminbuch/timetable, Aufbau nach dem Vorbild moderner
   Web-Kalender (Schedule-X): helle Kopfleiste, runde Bedienelemente,
   ruhige Flächen, Akzentfarbe nur für Heute und aktive Elemente. */
:root{
  --page:#f4f6fa;--surface:#fff;--surface2:#eef1f6;--surface3:#f7f8fb;
  --border:#d8deea;--border2:#e4e8f0;--border3:#eef1f6;
  --text:#141b2b;--text2:#3d4659;--muted:#566074;--muted2:#8690a2;
  --hover:#edf3fc;--today:var(--accentc,#1c5cab);--holiday:#c2570c;--weekend:#b3261e;
  --warn:#9a5b00;--nowline:#e5383b;
  --hh:48px;--gut:56px;
  --display:"Sitka Display","Sitka Heading",Charter,"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --uifont:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
body.dark{
  --page:#0e131d;--surface:#161c29;--surface2:#1e2636;--surface3:#1a2130;
  --border:#2f3a4f;--border2:#2a3345;--border3:#222b3b;
  --text:#e7ebf3;--text2:#c3cad6;--muted:#a0aabb;--muted2:#6f7a8e;
  --hover:#22304a;--holiday:#f0a35e;--weekend:#f2847c;--warn:#f1c40f;--nowline:#ff6b6b;
}
body{font-family:var(--uifont);font-size:14px}
.warn-txt{color:var(--warn);font-weight:600}
.tip-txt{color:var(--muted)}

/* Kopfleiste */
#topbar{background:var(--surface);color:var(--text);border-bottom:1px solid var(--border2);padding:10px 16px;gap:8px;row-gap:8px}
#topbar h1{font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:-.01em;margin-right:10px;display:flex;align-items:center;gap:6px}
#topbar h1 .ver{font-family:var(--uifont);font-size:10px;font-weight:600;color:var(--muted);background:var(--surface2);border-radius:999px;padding:1px 7px}
.nav-btn{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:600}
.nav-btn:hover{background:var(--hover)}
.nav-btn.round{width:32px;height:32px;padding:0;font-size:20px;line-height:1;display:inline-grid;place-items:center;border-color:transparent;background:transparent}
.nav-btn.round:hover{background:var(--hover)}
#curLabel{font-size:18px;font-weight:600;min-width:0;text-align:left;margin-left:4px;letter-spacing:-.005em}
.view-seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px;gap:2px}
.view-btn{background:transparent;border:0;color:var(--muted);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600}
.view-btn:hover{background:transparent;color:var(--text)}
.view-btn.active,.view-btn.active:hover{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(20,27,43,.14)}
body.dark .view-btn.active{background:var(--surface3)}
#topbar .tools{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.icon-btn{background:transparent;color:var(--text2);border:0;border-radius:8px;padding:6px 9px;font-size:13px}
.icon-btn:hover{background:var(--hover)}
.icon-btn:disabled:hover{background:transparent}
.icon-btn.pri{background:var(--accentc,#1c5cab);color:#fff;border-radius:999px;padding:6px 15px;font-weight:600;margin-left:6px}
body.dark .icon-btn.pri{color:#0b111c}
.icon-btn.pri:hover{filter:brightness(1.08);background:var(--accentc,#1c5cab)}

#infoBar{background:var(--surface3);color:var(--text2);border-bottom:1px solid var(--border2);font-size:12.5px;padding:6px 16px}
#infoBar .cd{color:var(--today)}
#dataBar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;padding:8px 16px;background:var(--surface);border-bottom:2px solid var(--weekend);font-size:13px}
#dataBar[hidden]{display:none}
#dataBarBtns{display:flex;gap:6px;flex-wrap:wrap}

/* Seitenleiste */
#sidebar{width:236px;background:var(--surface);border-right:1px solid var(--border2)}
#sidebar h3{background:transparent;color:var(--muted);padding:12px 14px 4px;font-size:11px;letter-spacing:.08em}
#miniCal{padding:4px 10px 10px}
#miniGrid td{border-radius:50%;padding:4px 2px}
#miniGrid td.mini-today{background:var(--today);border-radius:50%}
#miniGrid td.mini-sel{outline:2px solid var(--today)}
.upcoming-item{padding:7px 14px;border-bottom:0}
.upcoming-item:hover{background:var(--hover)}
#dataBox{padding-bottom:8px;border-bottom:1px solid var(--border3)}
#dataTxt{font-size:11.5px;color:var(--muted);padding:0 14px 6px;line-height:1.35}
#dataTxt.bad{color:var(--weekend)}
.data-btns{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px}
.sb-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:3px 10px;font-size:11.5px;cursor:pointer;font-weight:600}
.sb-btn:hover{background:var(--hover)}
.sb-btn.pri{background:var(--accentc,#1c5cab);border-color:transparent;color:#fff}
body.dark .sb-btn.pri{color:#0b111c}
[hidden]{display:none!important}

/* Inhalt, Monat, Jahr, Liste */
#content{padding:16px;background:var(--page)}
.month-header h2{font-family:var(--display);font-weight:600;font-size:22px}
#calGrid{border-color:var(--border2);border-radius:12px}
#calGrid th{background:var(--surface);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border2)}
#calGrid td{border-color:var(--border3);height:96px}
#calGrid table{table-layout:fixed}
@media(max-width:820px){#calGrid td{height:64px}}
@media(max-width:480px){#calGrid td{height:50px}}
.day-num{font-size:12.5px;font-weight:600}
.day-num.today{background:var(--today)}
.ev-chip{border-radius:4px;padding:1px 5px;font-size:10.5px}
.kw-cell{background:var(--surface)!important;color:var(--muted2)}
.mini-month{border-color:var(--border2);border-radius:12px}
.mini-month h4{color:var(--text)}
.mini-month td.mmy-today{background:var(--today);border-radius:50%}
#eventListSection,#listView,#dayView{border-color:var(--border2);border-radius:12px}
.list-month-header{background:var(--surface2);color:var(--text2)}

/* Dialoge */
#modal{border-radius:14px;box-shadow:0 18px 48px rgba(10,16,30,.28)}
.modal-hdr{background:var(--surface);color:var(--text);border-bottom:1px solid var(--border2);border-radius:14px 14px 0 0}
.modal-hdr h3{font-size:16px;font-weight:650}
.modal-hdr button{color:var(--muted)}
.modal-tabs{background:var(--surface)}
.modal-tab.active{color:var(--today);border-bottom-color:var(--today)}
.btn-ok{background:var(--accentc,#1c5cab);border-radius:8px}
.btn-ok:hover{background:var(--accentc,#1c5cab);filter:brightness(1.08)}
body.dark .btn-ok{color:#0b111c}
.btn-cancel,.btn-del,.btn-share{border-radius:8px}
#ctxMenu{border-radius:10px;border-color:var(--border2);padding:4px 0}
.ctx-item{font-size:13px}

/* ===================== ZEITRASTER (Woche, Tag) ===================== */
#weekView,#dayView{display:block;background:none;border:0;border-radius:0;overflow:visible}
.tg{background:var(--surface);border:1px solid var(--border2);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.tg-head,.tg-ad,.tg-grid{display:grid;grid-template-columns:var(--gut) repeat(var(--n),minmax(0,1fr))}
.tg-head{border-bottom:1px solid var(--border3)}
.tg-dh{padding:5px 4px;text-align:center;border-left:1px solid var(--border3);min-width:0;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;column-gap:7px}
.tg-dh.click{cursor:pointer}
.tg-dh.click:hover .dn{background:var(--hover)}
.tg-dh .wd{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650}
.tg-dh .dn{font-size:18px;font-weight:600;width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.tg-dh.we .wd{color:var(--weekend)}
.tg-dh.today .wd{color:var(--today)}
.tg-dh.today .dn,.tg-dh.today.click:hover .dn{background:var(--today);color:#fff}
body.dark .tg-dh.today .dn{color:#0b111c}
.tg-dh .hl{flex-basis:100%;font-size:10.5px;color:var(--holiday);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25;margin-top:-1px}
.tg-kw{display:grid;place-items:center;font-size:10px;color:var(--muted2)}
.tg-ad{border-bottom:1px solid var(--border2);min-height:26px}
.tg-adl{font-size:10px;color:var(--muted2);display:grid;place-items:center;text-align:center;line-height:1.1}
.tg-adc{border-left:1px solid var(--border3);padding:3px;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:copy}
.tg-chip{font-size:12px;border-radius:5px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-left:3px solid;color:var(--text)}
.tg-chip:hover{filter:brightness(.96)}
.tg-body{overflow-y:auto;max-height:calc(100vh - 230px);position:relative;overscroll-behavior:contain}
.tg-grid{position:relative;height:calc(24 * var(--hh))}
.tg-gut{position:relative}
.tg-gut span{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;color:var(--muted2);font-variant-numeric:tabular-nums}
.tg-col{position:relative;border-left:1px solid var(--border3);cursor:cell;
  background-image:repeating-linear-gradient(to bottom,var(--border2) 0 1px,transparent 1px var(--hh))}
.tg-col.we{background-color:var(--surface3)}
.tg-col.today{background-color:color-mix(in srgb,var(--today) 5%,var(--surface))}
.tg-ev{position:absolute;border-radius:7px;padding:3px 6px 3px 7px;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;
  border-left:3px solid;color:var(--text);box-shadow:0 0 0 1px var(--surface);min-height:18px}
.tg-ev:hover{z-index:60!important;box-shadow:0 0 0 1px var(--surface),0 4px 12px rgba(10,16,30,.18)}
.tg-ev .t{display:block;font-size:11px;opacity:.78;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg-ev .n{font-weight:650;overflow-wrap:break-word;hyphens:auto}
.tg-ev.short{display:flex;gap:6px;align-items:baseline;white-space:nowrap}
.tg-ev.short .t{display:inline;order:2}
.tg-now{position:absolute;left:-1px;right:0;height:2px;background:var(--nowline);z-index:55;pointer-events:none}
.tg-now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--nowline)}
.tg-info{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:12.5px;color:var(--muted)}
.tg-info .pill{background:var(--surface);border:1px solid var(--border2);border-radius:999px;padding:3px 10px;color:var(--text2)}
.tg-info .pill.hol{color:var(--holiday);border-color:color-mix(in srgb,var(--holiday) 40%,var(--border2))}

@media(max-width:820px){
  #topbar .tools{order:3;width:100%;justify-content:flex-end}
  .view-seg{order:2}
  #topbar h1{font-size:18px}
  #curLabel{flex:1 1 auto;order:1;font-size:16px}
  .tg-body{max-height:calc(100vh - 260px)}
}
@media(max-width:600px){
  :root{--gut:40px;--hh:44px}
  .view-btn{padding:5px 9px;font-size:12px}
  .tg-dh{flex-direction:column;padding:4px 2px}
  .tg-dh .dn{font-size:16px;width:28px;height:28px}
  .tg-dh .wd{font-size:10px;letter-spacing:.02em}
  .tg-dh .hl{display:none}
  .tg-ev{font-size:10.5px;padding:2px 3px 2px 4px}
  .tg-ev .t{font-size:9.5px}
  .tg-chip{font-size:10.5px;padding:1px 3px}
  .tg-ev .em{display:none}
}
@media(max-width:1599px){#topbar .undo-lbl{display:none}}
/* V0.6.1: Am PC ist die Seite genau fensterhoch – Seitenleiste und Inhalt
   scrollen jeweils für sich, die Seite selbst hat keinen Scrollbalken */
@media(min-width:821px){
  body{height:100vh;height:100dvh;min-height:0;overflow:hidden}
  #main{min-height:0}
}
/* V0.2: Ziehen, Verlängern, Aufziehen */
.tg-ev.dr{cursor:grab;touch-action:pan-y}
.tg-ev.dragging{opacity:.92;z-index:80!important;box-shadow:0 0 0 1px var(--surface),0 10px 24px rgba(10,16,30,.28);cursor:grabbing;transition:none}
.tg-ev.ghost{opacity:.95;pointer-events:none;outline:2px dashed color-mix(in srgb,var(--text) 40%,transparent);outline-offset:-2px}
.tg-rs{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize;z-index:3}
.tg-rs::after{content:"";position:absolute;left:50%;bottom:2px;width:22px;height:3px;margin-left:-11px;border-radius:2px;background:currentColor;opacity:0;transition:opacity .12s}
.tg-ev:hover .tg-rs::after,.tg-ev.dragging .tg-rs::after{opacity:.35}
body.tg-dragging,body.tg-dragging *{user-select:none;-webkit-user-select:none}
body.tg-dragging .tg-col{cursor:grabbing}
@media(pointer:coarse){.tg-rs{height:14px}.tg-rs::after{opacity:.3}}
/* V0.3: Vorlagen, Grundplan, Ferien */
#tplBox,#planBox{padding-bottom:8px;border-bottom:1px solid var(--border3)}
.sb-note{font-size:11.5px;color:var(--muted);padding:0 14px 6px;line-height:1.35}
.sb-lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tpl-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px;align-items:center;padding:2px 10px 2px 14px}
.tpl-chip{display:flex;gap:7px;align-items:baseline;border-radius:7px;padding:5px 9px;border-left:3px solid;cursor:grab;user-select:none;min-width:0;color:var(--text);outline:2px solid transparent;outline-offset:1px}
.tpl-chip b{font-size:11px;min-width:1.6em;font-weight:700;opacity:.85}
.tpl-chip span{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpl-chip:hover{filter:brightness(.97)}
.tpl-chip.on{outline-color:var(--today)}
.tpl-cnt{font-size:10.5px;color:var(--muted);min-width:2.2em;text-align:right;font-variant-numeric:tabular-nums}
.tpl-ed{border:0;background:none;color:var(--muted);cursor:pointer;border-radius:6px;padding:2px 5px;font-size:12px}
.tpl-ed:hover{background:var(--hover);color:var(--text)}
.tpl-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 14px 2px}
.mini-seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:2px;gap:1px}
.mini-seg button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;cursor:pointer}
.mini-seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(20,27,43,.15)}
.pl-row{display:flex;align-items:center;gap:4px;padding:3px 10px;margin:0 4px;border-radius:8px}
.pl-row.on{background:var(--hover)}
.pl-eye{border:0;background:none;cursor:pointer;font-size:13px;padding:2px 4px;border-radius:6px}
.pl-name{flex:1;cursor:pointer;font-size:12.5px;font-weight:600;line-height:1.25;min-width:0}
.pl-name small{display:block;font-weight:400;font-size:10.5px;color:var(--muted)}
.pl-banner{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:10px;padding:7px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--border2);border-left:3px solid var(--today);font-size:12.5px;color:var(--text2)}
.pl-banner.wk{border-left-color:#d2540f}
.pl-banner.past{border-left-color:var(--muted2);border-style:dashed;border-left-style:solid}
.pl-banner .muted{color:var(--muted)}
.tg-ev.pl{border-left-width:4px;border-left-style:double}
.tg-ev.pl::after{content:"↻";position:absolute;right:4px;bottom:1px;font-size:10px;opacity:.5}
.tg-ev.ov::before{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:#d2540f;box-shadow:0 0 0 1.5px var(--surface);z-index:2}
.tg-col.fer::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 7px,color-mix(in srgb,var(--holiday) 12%,transparent) 7px 9px);pointer-events:none}
.fer-label{font-size:9px;color:#1f8a70;line-height:1.2;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.dark .fer-label{color:#5fd3b3}
.tpl-float{position:fixed;z-index:900;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;box-shadow:0 8px 22px rgba(10,16,30,.25)}
.drop-hi{outline:2px dashed var(--today)!important;outline-offset:-2px}
body.brush .tg-col,body.brush .tg-adc,body.brush #calGrid td{cursor:copy}
.fer-row{display:grid;grid-template-columns:minmax(0,1fr) 130px 130px 28px;gap:5px}
.fer-row input{padding:5px 7px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;background:var(--surface);color:var(--text);min-width:0}
.fer-row button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px}
@media(max-width:600px){.fer-row{grid-template-columns:1fr 1fr;}.fer-row input:first-child{grid-column:1/-1}}
/* V0.4: Ausfüllen, Auslastung, freie Termine */
.tg-fl,.tg-fr{position:absolute;top:0;bottom:9px;width:7px;cursor:ew-resize;z-index:3}
.tg-fl{left:-1px}.tg-fr{right:0}
.tg-fl::after,.tg-fr::after{content:"";position:absolute;top:50%;width:3px;height:16px;margin-top:-8px;border-radius:2px;background:currentColor;opacity:0;transition:opacity .12s}
.tg-fl::after{left:2px}.tg-fr::after{right:2px}
.tg-ev:hover .tg-fl::after,.tg-ev:hover .tg-fr::after,.tg-ev.filling .tg-fl::after,.tg-ev.filling .tg-fr::after{opacity:.35}
.tg-ev.short .tg-fl::after,.tg-ev.short .tg-fr::after{height:10px;margin-top:-5px}
.tg-ev.filling{outline:2px solid var(--today);outline-offset:1px;z-index:80!important}
.tg-ev.ghost.fill{opacity:.85}
@media(pointer:coarse){.tg-fl,.tg-fr{width:12px}.tg-fl::after,.tg-fr::after{opacity:.3}}
@media(pointer:coarse) and (max-width:600px){.tg-fl,.tg-fr{width:7px}}
:root{--h1:#cde2fb;--h1-fg:#141b2b;--h2:#86b6ef;--h2-fg:#141b2b;--h3:#256abf;--h3-fg:#fff;--h4:#0d366b;--h4-fg:#fff}
body.dark{--h1:#12305a;--h1-fg:#e7ebf3;--h2:#1c5cab;--h2-fg:#fff;--h3:#5598e7;--h3-fg:#0b111c;--h4:#cde2fb;--h4-fg:#0b111c}
.month-header{gap:12px}
#calGrid td.hv0{background:var(--surface)}
#calGrid td.hv1{background:var(--h1)}#calGrid td.hv2{background:var(--h2)}#calGrid td.hv3{background:var(--h3)}#calGrid td.hv4{background:var(--h4)}
#calGrid td.hv1 .day-num:not(.today){color:var(--h1-fg)}#calGrid td.hv2 .day-num:not(.today){color:var(--h2-fg)}
#calGrid td.hv3 .day-num:not(.today),#calGrid td.hv3 .heat-free,#calGrid td.hv3 .hol-label,#calGrid td.hv3 .spec-label,#calGrid td.hv3 .fer-label{color:var(--h3-fg)}
#calGrid td.hv4 .day-num:not(.today),#calGrid td.hv4 .heat-free,#calGrid td.hv4 .hol-label,#calGrid td.hv4 .spec-label,#calGrid td.hv4 .fer-label{color:var(--h4-fg)}
#calGrid td.hv3:hover,#calGrid td.hv4:hover{filter:brightness(1.08)}
.heat-free{font-size:12px;font-weight:700;margin-top:2px;color:var(--text)}
.heat-cnt{font-size:11px;margin-top:6px;opacity:.85;color:var(--text2)}
#calGrid td.hv1 .heat-cnt{color:var(--h1-fg)}#calGrid td.hv2 .heat-cnt,#calGrid td.hv2 .heat-free{color:var(--h2-fg)}#calGrid td.hv3 .heat-cnt{color:var(--h3-fg)}#calGrid td.hv4 .heat-cnt{color:var(--h4-fg)}
.mini-month td.hv1{background:var(--h1);color:var(--h1-fg)}.mini-month td.hv2{background:var(--h2);color:var(--h2-fg)}
.mini-month td.hv3{background:var(--h3);color:var(--h3-fg)}.mini-month td.hv4{background:var(--h4);color:var(--h4-fg)}
.mini-month td.hv0{box-shadow:inset 0 0 0 1px var(--border)}
.heat-legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--muted);margin:-2px 0 10px}
.heat-legend .k{display:inline-flex;align-items:center;gap:5px}
.heat-legend i{width:15px;height:15px;border-radius:4px;display:inline-block;border:1px solid var(--border2)}
.heat-legend i.hv0{background:var(--surface)}.heat-legend i.hv1{background:var(--h1)}.heat-legend i.hv2{background:var(--h2)}.heat-legend i.hv3{background:var(--h3)}.heat-legend i.hv4{background:var(--h4)}
.chips-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.free-list{display:grid;gap:5px;max-height:48vh;overflow-y:auto}
.free-hit{display:grid;grid-template-columns:130px auto 1fr;gap:10px;align-items:baseline;text-align:left;border:1px solid var(--border2);background:var(--surface);color:var(--text);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums}
.free-hit:hover{border-color:var(--today);background:var(--hover)}
.free-hit b{color:var(--today)}
.free-hit small{color:var(--muted);text-align:right}
/* V0.5: Ebenen, einklappbare Seitenleiste */
#layerBox{padding-bottom:8px;border-bottom:1px solid var(--border3)}
.ly-row{display:flex;align-items:center;gap:7px;padding:3px 14px;cursor:pointer;font-size:12.5px;user-select:none}
.ly-row:hover{background:var(--hover)}
.ly-row.off .ly-n,.ly-row.off .ly-sw{opacity:.4}
.ly-eye{width:18px;text-align:center;font-size:12px}
.ly-sw{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.ly-sw.pl{background:none;font-size:11px;line-height:11px;text-align:center;color:var(--muted)}
.ly-sw.none{background:none}
.ly-n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tplBox>h3,#planBox>h3,#layerBox>h3,#dataBox>h3,#upcomingList>h3{cursor:pointer;position:relative;user-select:none}

<script>
const mNames=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const dNames=["So","Mo","Di","Mi","Do","Fr","Sa"];
const dNamesLong=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];

let state={
  view:'monat', year:new Date().getFullYear(),
  month:new Date().getMonth(), day:new Date().getDate(),
  miniYear:new Date().getFullYear(), miniMonth:new Date().getMonth()
};
let today=new Date(); today.setHours(0,0,0,0);
/* STABILITÄT: Seite kann tagelang offen bleiben (Benachrichtigungen!) –
   um Mitternacht müssen Heute-Markierung, Countdown und Erinnerungen umspringen */
function refreshToday(){
  let n=new Date();n.setHours(0,0,0,0);
  if(n.getTime()!==today.getTime()){
    today=n;
    if(typeof render==='function')render();
  }
}

let DB={
  categories:[
    {id:'termin',name:'Termin',color:'#2980b9',emoji:'📋'},
    {id:'geburtstag',name:'Geburtstag',color:'#8e44ad',emoji:'🎂'},
    {id:'feiertag',name:'Feiertag',color:'#e67e22',emoji:'🏛️'},
    {id:'privat',name:'Privater Termin',color:'#e74c3c',emoji:'🔒'},
    {id:'sonstiges',name:'Sonstiges',color:'#27ae60',emoji:'📌'}
  ],
  events:[]
};

let storageOK=true;
function testStorage(){
  try{localStorage.setItem('timeless_test','1');localStorage.removeItem('timeless_test');return true;}
  catch(e){return false;}
}
/* TIMELESS V0.1: eigener Speicherbereich. Beim allerersten Start werden die
   Daten von Endless Calendar Pro (ecpro_v1) einmalig KOPIERT – das Original
   bleibt unverändert, Endless Calendar Pro läuft daneben weiter. */
const DBKEY='timeless_v1';
let migratedFromECP=false;
function loadDB(){
  if(!storageOK)return;
  try{
    let d=localStorage.getItem(DBKEY);
    if(!d&&!localStorage.getItem('timeless_init')){
      let old=localStorage.getItem('ecpro_v1');
      if(old){d=old;migratedFromECP=true;}
      localStorage.setItem('timeless_init','1');
    }
    if(d){let p=JSON.parse(d);DB.categories=p.categories||DB.categories;DB.events=p.events||[];DB.templates=p.templates||[];DB.plans=p.plans||[];if(Array.isArray(p.ferien))DB.ferien=p.ferien;DB.stamp=typeof p.stamp==='string'?p.stamp:'';}
    if(migratedFromECP)localStorage.setItem(DBKEY,JSON.stringify(DB));
  }catch(e){}
  if(typeof evCacheClear==='function')evCacheClear(); // V0.6
}
let warnShown=false;
function showStorageWarning(){
  if(warnShown)return;warnShown=true;
  let bar=document.getElementById('infoBar');
  if(bar)bar.innerHTML=`<span class="warn-txt">⚠️ Speichern nicht möglich in diesem Kontext. Öffne die Datei direkt im Browser (file://) statt über einen Dateimanager. Sichere Termine über „ICS ↕" → Text-Backup.</span>`;
}
function saveDB(){
  if(!storageOK){showStorageWarning();return;}
  DB.stamp=newStamp(); // V0.1: Kennung des Standes für den Datendatei-Abgleich
  try{localStorage.setItem(DBKEY,JSON.stringify(DB));}
  catch(e){storageOK=false;showStorageWarning();}
  if(typeof queueData==='function')queueData();
  if(typeof evCacheClear==='function')evCacheClear(); // V0.6
}
storageOK=testStorage();
loadDB();
const APP_VERSION='1.1';
function newStamp(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);}

/* ===== EINSTELLUNGEN (V1.9): Dunkelmodus, Akzentfarbe, Lösch-Nachfrage ===== */
let SETTINGS={theme:'hell',accent:'#1c5cab',noConfirmDelete:false,chipBg:true,chipBorder:false,overlap:'side',dayStart:7,showFerien:true,plScope:'all',tplTarget:'event',planId:'',heat:{on:false,from:'08:00',to:'18:00',days:[1,2,3,4,5],slot:30,skipHol:true},alertSound:true,alertDefault:'',alertPlan:'',alertEnd:false};
function loadSettings(){
  try{
    let raw=localStorage.getItem('timeless_settings'),s=JSON.parse(raw||'{}');
    // V0.1: erste Einstellungen aus Endless Calendar Pro übernehmen (ohne Akzentfarbe – neue Optik)
    if(!raw){try{let o=JSON.parse(localStorage.getItem('ecpro_settings')||'{}');delete o.accent;s=o;}catch(e){}}
    Object.assign(SETTINGS,s);
    SETTINGS.heat=Object.assign({on:false,from:'08:00',to:'18:00',days:[1,2,3,4,5],slot:30,skipHol:true},s.heat||{}); // V0.4
    // V2.3-Migration (Punkt 11): Bisher bedeutete „Farbhintergrund aus"
    // automatisch „farbiger Rand an". Wer das so eingestellt hatte, bekommt
    // beim ersten Start mit V2.3 den Rand explizit gesetzt – nichts ändert
    // sich optisch. chipBorder ist ab jetzt eine eigenständige Option.
    if(s.chipBorder===undefined&&s.chipBg===false)SETTINGS.chipBorder=true;
  }catch(e){}
}
function saveSettings(){
  try{localStorage.setItem('timeless_settings',JSON.stringify(SETTINGS));}catch(e){}
}
/* Farbe Richtung Weiß (f>0) oder Schwarz (f<0) mischen */
function shade(hex,f){
  let n=parseInt((hex||'#2c3e50').slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;
  let t=f>0?255:0,p=Math.abs(f);
  r=Math.round(r+(t-r)*p);g=Math.round(g+(t-g)*p);b=Math.round(b+(t-b)*p);
  return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
/* V3.0 (Punkt 2): automatische Schriftfarbe für Chips MIT Farbhintergrund.
   Bisher war „automatisch" immer Weiß – auf den hellen Pastell-Presets
   (z.B. #ffffcc Hellgelb) praktisch unlesbar. Jetzt entscheidet die
   relative Helligkeit (WCAG 2.x) des Hintergrunds:
   • dunkle/kräftige Farben (Blau, Violett, Rot, Orange, Grün der
     Standardkategorien) -> Weiß wie bisher
   • helle Farben (alle Pastelltöne, Gelb, Hellgrün …) -> sehr dunkle
     Variante DESSELBEN Farbtons (wirkt ruhiger als reines Schwarz);
     reicht deren Kontrast nicht (< 7:1), wird fast Schwarz verwendet. */
function relLum(hex){
  let n=parseInt(String(hex||'').replace('#','').slice(0,6),16);
  if(isNaN(n))return 0;
  let lin=v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);};
  return 0.2126*lin(n>>16&255)+0.7152*lin(n>>8&255)+0.0722*lin(n&255);
}
function contrastRatio(a,b){let x=relLum(a),y=relLum(b);return(Math.max(x,y)+0.05)/(Math.min(x,y)+0.05);}
function autoTextColor(bg){
  if(!/^#[0-9a-fA-F]{6}$/.test(bg||''))return'#fff';
  if(relLum(bg)<=0.40)return'#fff';            // dunkel genug für Weiß (Standardkategorien unverändert)
  let dk=shade(bg,-0.78);                        // gleicher Farbton, stark abgedunkelt
  return contrastRatio(bg,dk)>=7?dk:'#1a1a1a';
}
function applyTheme(){
  let dark=SETTINGS.theme==='dunkel';
  document.body.classList.toggle('dark',dark);
  let a=SETTINGS.accent||'#1c5cab';
  let rs=document.documentElement.style;
  rs.setProperty('--bg',a);
  rs.setProperty('--bar',shade(a,dark?-0.18:0.12));
  /* Akzent als TEXTfarbe braucht im Dunkelmodus eine hellere Variante,
     sonst ist z.B. die Monatsüberschrift der Jahresansicht unlesbar */
  rs.setProperty('--bgtext',dark?shade(a,0.6):a);
  rs.setProperty('--accentc',dark?shade(a,0.45):a); // V0.1: Akzent für Heute-Markierung, aktive Elemente
}
function setTheme(t){SETTINGS.theme=t;saveSettings();applyTheme();}
function setAccent(v){SETTINGS.accent=v;saveSettings();applyTheme();openSettingsModal();}
const ACCENT_PRESETS=['#1c5cab','#2c3e50','#1a5276','#145a32','#6c3483','#922b21','#7d6608','#212121'];
/* V2.1: dezente Pastelltöne statt der bisherigen grellen 8 Farben – wirkt am
   Handy (und am Desktop) ruhiger; „Eigene Farbe" startet mit der aktuell
   gewählten Farbe, wenn diese keinem Preset entspricht (siehe pickColor). */
const EVENT_COLOR_PRESETS=['#fbb4ae','#b3cde3','#ccebc5','#decbe4','#fed9a6','#ffffcc','#e5d8bd','#fddaec'];
/* Baut einen Farbwähler: 8 Pastell-Kacheln + „Eigene Farbe" (native Farbauswahl).
   inputId = Hidden-Input, das den tatsächlichen Wert für captureTab()/addCat() hält. */
function colorPickerHtml(inputId,current){
  current=(current||'#2980b9');
  let cLow=current.toLowerCase();
  let isPreset=EVENT_COLOR_PRESETS.some(p=>p.toLowerCase()===cLow);
  let swatches=EVENT_COLOR_PRESETS.map(p=>
    `<span class="color-swatch" data-color="${p}" onclick="pickColor('${inputId}','${p}')" style="width:28px;height:28px;border-radius:6px;background:${p};cursor:pointer;display:inline-block;border:2px solid ${cLow===p.toLowerCase()?'var(--bgtext)':'transparent'};box-shadow:0 0 0 1px var(--border)"></span>`
  ).join('');
  // „Eigene Farbe"-Kachel: zeigt die zuletzt gewählte custom Farbe als Startwert (V2.1, Punkt 4b)
  swatches+=`<span class="color-swatch" id="${inputId}_custom" onclick="document.getElementById('${inputId}_native').click()" title="Eigene Farbe wählen" style="width:28px;height:28px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px;border:2px solid ${!isPreset?'var(--bgtext)':'transparent'};box-shadow:0 0 0 1px var(--border);background:${!isPreset?current:'repeating-conic-gradient(#ccc 0% 25%, #eee 0% 50%) 50%/10px 10px'}">${isPreset?'🎨':''}</span>`;
  swatches+=`<input type="color" id="${inputId}_native" value="${current}" style="display:none" oninput="pickColor('${inputId}',this.value)">`;
  swatches+=`<input type="hidden" id="${inputId}" value="${current}">`;
  return `<div class="color-picker" id="${inputId}_wrap" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${swatches}</div>`;
}
/* V2.2 FIX: Der Picker wurde hier früher per outerHTML komplett neu aufgebaut.
   Dabei wurde auch das (unsichtbare) native <input type="color"> zerstört, an
   dem der gerade GEÖFFNETE System-Farbdialog hing – nach der ersten Änderung
   kamen keine weiteren oninput-Ereignisse mehr an ("nur Einmalklick möglich").
   Jetzt werden nur Markierungsrahmen und die Eigene-Farbe-Kachel im Bestand
   aktualisiert; der Dialog bleibt verbunden, freies Ziehen im Farbfeld
   funktioniert und die Kachel zeigt die Farbe live. */
function pickColor(inputId,color,auto){
  // V3.1: manuelle Farbwahl im Termin-Dialog merken (auto=true: Kategoriewechsel)
  if(inputId==='fColor'&&!auto&&typeof formData==='object'&&formData)formData._colorTouched=true;
  let hid=document.getElementById(inputId);
  if(hid)hid.value=color;
  let wrap=document.getElementById(inputId+'_wrap');
  if(!wrap)return;
  let cLow=(color||'').toLowerCase();
  let isPreset=EVENT_COLOR_PRESETS.some(p=>p.toLowerCase()===cLow);
  wrap.querySelectorAll('.color-swatch[data-color]').forEach(sw=>{
    sw.style.borderColor=sw.dataset.color.toLowerCase()===cLow?'var(--bgtext)':'transparent';
  });
  let cust=document.getElementById(inputId+'_custom');
  if(cust){
    cust.style.borderColor=!isPreset?'var(--bgtext)':'transparent';
    cust.style.background=!isPreset?color:'repeating-conic-gradient(#ccc 0% 25%, #eee 0% 50%) 50%/10px 10px';
    cust.textContent=isPreset?'🎨':'';
  }
  // Preset-Klick: nativen Picker synchron halten (nicht nötig/erwünscht, wenn
  // die Änderung gerade AUS dem nativen Picker kam – Wert ist dann identisch)
  let nat=document.getElementById(inputId+'_native');
  if(nat&&/^#[0-9a-fA-F]{6}$/.test(color)&&nat.value.toLowerCase()!==cLow)nat.value=color;
  // V3.0 (Punkt 2): Vorschau der automatischen Schriftfarbe im Termin-Dialog mitführen
  if(inputId==='fColor')syncAutoTextColor();
}
/* V3.0 (Punkt 2): <input type=color> kennt nur #rrggbb – Kurzform #fff erweitern */
function autoTextHex(bg){let c=autoTextColor(bg);return c==='#fff'?'#ffffff':c;}
function syncAutoTextColor(){
  let auto=document.getElementById('fTextColorAuto'),tc=document.getElementById('fTextColor'),col=document.getElementById('fColor');
  if(auto&&auto.checked&&tc&&col)tc.value=autoTextHex(col.value);
}
function toggleTextColorAuto(on){
  let tc=document.getElementById('fTextColor');
  if(tc)tc.disabled=on;
  if(on)syncAutoTextColor(); // zurück auf automatisch -> passende Farbe anzeigen
}

function toggleFullscreen(){
  if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});}
  else{
    let el=document.documentElement;
    let req=el.requestFullscreen||el.webkitRequestFullscreen;
    if(!req){alert('Vollbild wird von diesem Browser nicht unterstützt.');return;}
    req.call(el).catch(()=>alert('Vollbild konnte nicht aktiviert werden.'));
  }
}

/* ===== UNDO (V1.6) =====
   Klein und sicher: In-Memory-Stapel der letzten 30 Änderungen (kompletter
   DB-Snapshot VOR jeder destruktiven Aktion). Toast in der Info-Leiste mit
   „Rückgängig"-Knopf; Strg+Z nur, wenn kein Textfeld aktiv bearbeitet wird.
   Bei Änderungen aus einem anderen Tab wird Undo GESPERRT, damit hier nie
   fremde (neuere) Daten mit einem alten Snapshot überschrieben werden. */
const UNDO_MAX=30;
let undoStack=[];
let undoLockedReason='';
function pushUndo(label){
  try{
    undoStack.push({label,snap:JSON.stringify(DB)});
    if(undoStack.length>UNDO_MAX)undoStack.shift();
    undoLockedReason='';
  }catch(e){}
  updateUndoBtn();
}
function lockUndo(reason){
  undoStack.length=0;
  undoLockedReason=reason;
  updateUndoBtn();
}
/* V3.0 (Punkt 1): Der Rückgängig-Knopf stand bisher NUR im Toast der
   Info-Leiste – und die wird bei jedem render() (Tagesklick, Blättern …)
   durch die Tagesübersicht überschrieben. Daher gibt es jetzt zusätzlich
   einen festen Knopf in der Kopfleiste: aktiv, solange Schritte im Speicher
   sind; Tooltip nennt die Aktion, die zurückgenommen wird; die gelbe Zahl
   zeigt die Anzahl verfügbarer Schritte. */
function updateUndoBtn(){
  let b=document.getElementById('undoBtn');
  if(!b)return;
  let n=undoStack.length,last=undoStack[n-1];
  b.disabled=!n;
  let cnt=document.getElementById('undoCnt');
  if(cnt)cnt.textContent=n>1?String(n):'';
  b.title=n?`Rückgängig: ${last.label} (Strg+Z)${n>1?` – ${n} Schritte verfügbar`:''}`
    :(undoLockedReason?`Rückgängig gesperrt: ${undoLockedReason}`:'Nichts zum Rückgängigmachen');
  b.setAttribute('aria-label',b.title);
}
function performUndo(){
  if(undoLockedReason){showToast('↩ Rückgängig nicht möglich: '+undoLockedReason,false);return;}
  let u=undoStack.pop();
  if(!u){showToast('Nichts zum Rückgängigmachen vorhanden',false);updateUndoBtn();return;}
  try{DB=JSON.parse(u.snap);}
  catch(e){showToast('Rückgängig fehlgeschlagen ('+e.message+')',false);updateUndoBtn();return;}
  saveDB();render();
  // offener Kategorien-Dialog zeigt sonst den alten Stand
  if(document.getElementById('overlay').classList.contains('show')&&document.getElementById('modalTitle').textContent==='Kategorien verwalten'){editCatId=null;renderCatModal();}
  updateUndoBtn();
  showToast('↩ Rückgängig gemacht: '+u.label+(undoStack.length?` – noch ${undoStack.length} Schritt${undoStack.length>1?'e':''} möglich`:''),undoStack.length>0); // V1.1: Knopf bleibt
}
function showToast(msg,withUndo){
  let bar=document.getElementById('infoBar');
  if(!bar)return;
  bar.innerHTML=`<span class="warn-txt">${escHtml(msg)}</span>`+
    (withUndo?`<button class="undo-btn" onclick="performUndo()">↩ Rückgängig</button>`:'');
}
/* Persistenter Sicherungspunkt vor riskanten Massen-Aktionen
   (Import, Duplikatbereinigung) – überlebt auch ein Neuladen der Seite */
function saveRestorePoint(label,dbObj){
  try{localStorage.setItem('timeless_restore',JSON.stringify({label,ts:new Date().toISOString(),db:dbObj||DB}));}catch(e){}
}
function restoreRestorePoint(){
  let raw=null;
  try{raw=localStorage.getItem('timeless_restore');}catch(e){}
  if(!raw){alert('Kein Sicherungspunkt vorhanden.\nEr wird automatisch vor jedem Import und jeder Duplikatbereinigung angelegt.');return;}
  try{
    let p=JSON.parse(raw);
    let when=new Date(p.ts).toLocaleString('de-AT');
    if(!confirm(`Sicherungspunkt wiederherstellen?\n\nAngelegt: ${when}\nVor Aktion: ${p.label}\nTermine damals: ${(p.db.events||[]).length} (aktuell: ${DB.events.length})\n\nDie aktuellen Daten werden ersetzt.`))return;
    pushUndo('Sicherungspunkt wiederhergestellt');
    DB=p.db;
    saveDB();closeModal();render();
    showToast('⏪ Sicherungspunkt wiederhergestellt ('+p.label+')',true);
  }catch(e){alert('Sicherungspunkt beschädigt: '+e.message);}
}
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&e.key.toLowerCase()==='z'){
    let a=document.activeElement;
    if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.isContentEditable))return; // Textfeld: Browser-Undo lassen
    // V3.0: Im offenen Termin-Dialog nicht die Datenbank unter dem Formular austauschen
    if(document.getElementById('overlay').classList.contains('show')&&document.getElementById('modalTabs').style.display!=='none')return;
    e.preventDefault();
    performUndo();
  }
});

/* Bug-Fix "gelöschter Termin wieder da": Wenn eine andere Instanz (2. Tab, anderes
   Gerät via gleichem Origin) speichert, übernehmen wir deren Stand sofort,
   statt ihn später mit unserer veralteten Kopie zu überschreiben. */
window.addEventListener('storage',e=>{
  if(e.key===DBKEY){
    lockUndo('Daten wurden in einem anderen Tab geändert'); // fremden Stand nie mit altem Snapshot überschreiben
    loadDB();
    if(typeof render==='function')render();
  }
});

  if(document.hidden)return;
  refreshToday();                 // Tab war evtl. über Mitternacht im Hintergrund
  if(storageOK){
    // Nur wenn der gespeicherte Stand von unserem abweicht, hat ein anderer Tab
    // geschrieben -> Undo sperren, dann fremden Stand übernehmen
    let cur=null;
    try{cur=localStorage.getItem(DBKEY);}catch(e){}
    // V0.5.1: Stand-Kennung vergleichen statt des ganzen Textes
    let curStamp=null;try{curStamp=cur===null?null:(JSON.parse(cur).stamp||'');}catch(e){curStamp='?';}
    if(curStamp!==null&&curStamp!==(DB.stamp||'')){
      lockUndo('Daten wurden in einem anderen Tab geändert');
      loadDB();
    }
  }
  if(typeof render==='function')render();
});

/* Titel normalisieren: "(51)" und "(geb. 5.6.1975)" am Ende ignorieren */
function normTitle(t){
  return(t||'').replace(/\s*\(\d+\)\s*$/,'').replace(/\s*\(geb\.[^)]*\)\s*$/i,'').trim().toLowerCase();
}
/* Bereinigung in 3 Stufen:
   1) exakte Duplikate (Titel+Datum+Zeit+Wiederholung)
   2) ähnliche Paare (gleicher Name + Datum, z.B. alter "Termin"-Import
      neben neuem "Geburtstag"-Import) -> bessere Version bleibt
   3) verwaiste Alt-Geburtstage reparieren: "(geb. ...)"-Titel als
      Termin/einmalig -> Geburtstag/jährlich umstellen */
function scoreEvent(e){
  let s=0;
  if(e.categoryId==='geburtstag')s+=4;
  if(e.repeat&&e.repeat!=='none')s+=4;
  if(e.importUid)s+=2;
  if(e.exdates&&e.exdates.length)s+=1;
  if(e.reminder)s+=1;
  if((e.notes||'').trim())s+=1;   // V2.5: Version mit Notizen bevorzugen
  if(e.hidden===true)s-=1;        // V2.5: sichtbare Version bevorzugen
  return s;
}
function removeDuplicates(){
  /* V1.8: ATOMAR. Alle 3 Stufen laufen zuerst NUR auf einer Arbeitskopie –
     DB bleibt bis zur Bestätigung vollständig unangetastet. Erst nach „OK"
     werden Sicherungspunkt und Undo geschrieben und DB durch die Arbeitskopie
     ersetzt. Ein Abbruch hinterlässt garantiert keinerlei Änderung.
     (Vorher-Fehler: Stufe 1 und die Geburtstags-Reparaturen aus Stufe 3
     wurden bereits direkt in DB ausgeführt, bevor die Nachfrage kam – bei
     Abbruch wurden sie trotz der Meldung „Nur exakte Duplikate" gespeichert.) */
  let work=JSON.parse(JSON.stringify(DB));
  /* Vorkommens-Vergleich (für Stufe 2 und 2b): erzeugen zwei Termine ab dem
     späteren Startdatum 730 Tage lang exakt dieselben Vorkommen? Bei
     Stundenserien werden zusätzlich die tatsächlichen Tages-Uhrzeiten
     verglichen (V2.6-Bugfix, s.u.). */
  let sameDays=(a,b)=>{
    let sa=parseDate(a.date||''),sb=parseDate(b.date||'');
    let ws=(!isNaN(sa)&&!isNaN(sb))?(sa>sb?sa:sb):new Date(today);
    let cur=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()),hit=0;
    for(let i=0;i<730;i++){
      let oa=occursOn(a,cur.getFullYear(),cur.getMonth(),cur.getDate());
      if(oa!==occursOn(b,cur.getFullYear(),cur.getMonth(),cur.getDate()))return false;
      /* V2.6 (Bugfix): Stundenserien zusätzlich über die TATSÄCHLICHEN
         Tages-Uhrzeiten vergleichen – zwei Serien können an denselben
         TAGEN, aber (durch versetzten Anker oder anderes Intervall) zu
         unterschiedlichen UHRZEITEN vorkommen; solche Paare sind sichtbar
         verschieden und dürfen nicht entfernt werden. */
      if(oa&&(isHourSeries(a)||isHourSeries(b))
        &&evTimeOn(a,cur.getFullYear(),cur.getMonth(),cur.getDate())!==evTimeOn(b,cur.getFullYear(),cur.getMonth(),cur.getDate()))return false;
      if(oa)hit++;
      cur.setDate(cur.getDate()+1);
    }
    return hit>0;
  };
  // Stufe 1: exakt (Titel+Datum+Zeit+Wiederholung INKL. Details).
  // V2.6 (Bugfix): Der Schlüssel enthielt nur den Wiederholungs-TYP – zwei
  // Serien „alle 9 Stunden" und „alle 10 Stunden" mit gleichem Start galten
  // als exakte Duplikate, obwohl sie völlig verschiedene Vorkommen erzeugen.
  // Jetzt fließen Intervall, Einheit, Wochentags-Regel, Ende und Masken mit ein.
  let seen=new Map(),exact=0;
  work.events=work.events.filter(ev=>{
    let key=[ev.title,ev.date,ev.time||'',ev.repeat||'none',
      ev.repeatInterval||'',ev.repeatUnit||'',ev.repeatOrd||'',ev.repeatWd||'',ev.repeatMonth??'',
      ev.repeatUntil||'',ev.repeatCount||'',ev.wdMask||'',ev.moMask||'',ev.relative||'',ev.offset||0,ev.deathDate||''].join('|'); // V2.7: + Sterbedatum
    if(seen.has(key)){exact++;return false;}
    seen.set(key,1);return true;
  });
  // Stufe 2: ähnlich (normalisierter Name + Datum)
  let groups=new Map();
  work.events.forEach(ev=>{
    let key=normTitle(ev.title)+'|'+ev.date;
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(ev);
  });
  let similar=0,removedNames=[];
  let removeIds=new Set();
  groups.forEach(list=>{
    if(list.length<2)return;
    list.sort((a,b)=>scoreEvent(b)-scoreEvent(a)); // bester zuerst
    let removedAny=false;
    list.slice(1).forEach(loser=>{
      /* V2.6 (Bugfix): Sind BEIDE Einträge Serien, gelten sie nur dann als
         Doppel-Eintrag, wenn sie tatsächlich dieselben Vorkommen erzeugen –
         zwei bewusst verschieden eingestellte Serien mit gleichem Namen und
         Startdatum (z.B. alle 9 vs. alle 10 Stunden) bleiben beide erhalten.
         Der klassische Fall „alter Einmal-Import neben neuem Geburtstag"
         (einer davon ohne Wiederholung) wird weiterhin zusammengeführt. */
      if(list[0].repeat&&list[0].repeat!=='none'&&loser.repeat&&loser.repeat!=='none'&&!sameDays(list[0],loser))return;
      removeIds.add(loser.id);similar++;removedAny=true;
    });
    if(removedAny)removedNames.push(list[0].title.replace(/\s*\(geb\.[^)]*\)\s*$/i,''));
  });
  work.events=work.events.filter(e=>!removeIds.has(e.id));
  /* Stufe 2b (V2.5): DECKUNGSGLEICHE Doppel-Einträge – gleicher Name
     (normalisiert) und gleiche Uhrzeit, aber z.B. ANDERES Startdatum oder
     anderer Wiederholungstyp, die trotzdem an exakt denselben Tagen
     erscheinen. Solche Paare sahen bisher überall identisch aus (und lösten
     das ⚠️-Konfliktdreieck aus), wurden aber von Stufe 1/2 nie gefunden,
     weil dort das Datumsfeld exakt übereinstimmen muss. Typische Fälle:
     • dieselbe Serie zweimal angelegt, Start um eine Periode versetzt
       (wöchentlich ab 1.7. UND ab 8.7. -> ab 8.7. jede Woche doppelt)
     • Geburtstag einmal mit Geburtsjahr, einmal mit aktuellem Jahr erfasst
     • Serienkopie per Ziehen/Einfügen auf einen späteren Serientag
     Geprüft wird ausschließlich über die TATSÄCHLICHEN Vorkommen (occursOn):
     beide Termine werden ab dem späteren der beiden Startdaten 730 Tage lang
     Tag für Tag verglichen; nur bei vollständiger Übereinstimmung mit
     mindestens einem gemeinsamen Vorkommen gilt das Paar als deckungsgleich.
     Behalten wird die „bessere" Version (scoreEvent), bei Gleichstand die mit
     dem FRÜHEREN Startdatum (bewahrt Historie, z.B. das echte Geburtsjahr
     und damit die korrekte Altersanzeige). */
  let congruent=0,congruentNames=[];
  {
    let g2=new Map();
    work.events.forEach(ev=>{
      let k=normTitle(ev.title)+'|'+(ev.time||'');
      if(!g2.has(k))g2.set(k,[]);
      g2.get(k).push(ev);
    });
    // sameDays: gemeinsame Vorkommens-Prüfung, oben vor Stufe 1 definiert (V2.6)
    let drop=new Set();
    g2.forEach(list=>{
      if(list.length<2)return;
      // beste Version zuerst: höherer Score, dann früheres Startdatum
      list.sort((a,b)=>(scoreEvent(b)-scoreEvent(a))||((a.date||'')<(b.date||'')?-1:1));
      for(let i=0;i<list.length;i++){
        if(drop.has(list[i].id))continue;
        for(let j=i+1;j<list.length;j++){
          if(drop.has(list[j].id))continue;
          if(sameDays(list[i],list[j])){
            drop.add(list[j].id);congruent++;
            congruentNames.push(list[i].title);
          }
        }
      }
    });
    work.events=work.events.filter(e=>!drop.has(e.id));
  }
  // Stufe 3: verwaiste Alt-Geburtstage reparieren
  let repaired=0;
  work.events.forEach(ev=>{
    if(/\(geb\.[^)]*\)\s*$/i.test(ev.title)&&ev.categoryId!=='geburtstag'&&(!ev.repeat||ev.repeat==='none')){
      ev.categoryId='geburtstag';ev.repeat='yearly';repaired++;
    }
  });
  if(exact+similar+congruent+repaired===0){alert('Keine Duplikate oder Reparaturen nötig – alles sauber!');return;}
  // Zusammenfassung VOR jeder Änderung – eine Bestätigung für alles
  let names=removedNames.slice(0,10).join(', ')+(removedNames.length>10?' …':'');
  let cNames=congruentNames.slice(0,10).join(', ')+(congruentNames.length>10?' …':'');
  function buildMsg(verb){ // verb: false=Vorschau ("entfernen"), true=erledigt ("entfernt")
    let m='Bereinigung'+(verb?':':' – geplante Änderungen:')+'\n';
    if(exact)m+=`• ${exact} exakte Duplikate ${verb?'entfernt':'entfernen'}\n`;
    if(similar)m+=`• ${similar} ähnliche Doppel-Einträge ${verb?'entfernt':'entfernen'} (Termin/Geburtstag-Paare):\n  ${names}\n`;
    if(congruent)m+=`• ${congruent} deckungsgleiche Doppel-Einträge ${verb?'entfernt':'entfernen'} (gleicher Name + Uhrzeit, identische Tage trotz unterschiedlichem Startdatum):\n  ${cNames}\n`;
    if(repaired)m+=`• ${repaired} Alt-Geburtstage ${verb?'repariert':'reparieren'} (Kategorie Geburtstag, jährlich)\n`;
    return m;
  }
  if(!confirm(buildMsg(false)+'\nJetzt ausführen?\n(Abbrechen ändert garantiert nichts.)'))return;
  saveRestorePoint('Duplikatbereinigung'); // DB ist hier noch der Stand VOR der Bereinigung
  pushUndo('Duplikatbereinigung');
  DB=work;
  saveDB();render();
  alert(buildMsg(true));
  showToast('🧹 Duplikatbereinigung ausgeführt',true);
}

const HOLIDAY_COLOR='#e67e22'; // Einheitliche Farbe für alle Feiertage und festen Tage
const atFixed={'1-1':'Neujahr','1-6':'Hl. Drei Könige','5-1':'Tag der Arbeit','8-15':'Mariä Himmelfahrt','10-26':'Nationalfeiertag','11-1':'Allerheiligen','12-8':'Mariä Empfängnis','12-25':'Christtag','12-26':'Stefanitag'};

function getEaster(y){
  let a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
      f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
      h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,
      l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
      mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,da);
}
function getHolidays(y){

  addOffset(e,1,'Ostermontag');addOffset(e,39,'Christi Himmelfahrt');

  function nth(y,m,n){let f=new Date(y,m,1),fs=1+((7-f.getDay())%7);return new Date(y,m,fs+(n-1)*7);}

  return s;
