        <div class="checkrow" style="margin-top:6px">
          ${mNames.map((mn,i)=>`<label><input type="checkbox" id="mo${i}" ${(f.moMask||'111111111111')[i]!=='0'?'checked':''}>${mn.substr(0,3)}</label>`).join('')}
          <button type="button" style="font-size:10px" onclick="setMaskAll('mo',true)">Alle</button>
          <button type="button" style="font-size:10px" onclick="setMaskAll('mo',false)">Kein</button>
        </div>
        <p style="font-size:10px;color:var(--muted2);margin-top:6px">Beispiele: „Freitag der 13." = Start am 13., monatlich, nur Fr angehakt. „Sommerferien nur werktags" = mehrtägiger Termin, Sa+So abgehakt.</p>
      </div>`;
    updateRepeatUI();
  }else if(t===2){
    mb.innerHTML=`
      <div class="form-row"><label>Relativer Bezug</label>
        <select id="fRelative">
          <option value="">Keiner (absolutes Datum)</option>
          <option value="ostern" ${f.relative==='ostern'?'selected':''}>Relativ zu Ostern</option>
          <option value="advent1" ${f.relative==='advent1'?'selected':''}>Relativ zum 1. Advent</option>
        </select>
      </div>
      <div class="form-row"><label>Offset (Tage, z.B. -2 = Karfreitag)</label><input type="number" id="fOffset" value="${f.offset||0}"></div>
      <p style="font-size:11px;color:var(--muted);margin:-6px 0 12px">Bei gesetztem Bezug erscheint der Termin jedes Jahr relativ zu Ostern bzw. zum 1. Advent – das Datum aus „Beschreibung" wird ignoriert.</p>
      <div class="form-row"><label>Anzeigetyp</label>
        <div class="radio-group">
          <label class="rep-opt"><input type="radio" name="dtype" value="termin" ${(!f.displayType||f.displayType==='termin')?'checked':''}> <span>Termin</span></label>
          <label class="rep-opt"><input type="radio" name="dtype" value="feiertag" ${f.displayType==='feiertag'?'checked':''}> <span>Feiertag</span></label>
          <label class="rep-opt"><input type="radio" name="dtype" value="privat" ${f.displayType==='privat'?'checked':''}> <span>Privater Termin</span></label>
          <label class="rep-opt"><input type="radio" name="dtype" value="versteckt" ${f.displayType==='versteckt'?'checked':''}> <span>Versteckter Termin (nur in Listenansicht)</span></label>
        </div>
      </div>`;
  }
}

function setMaskAll(prefix,on){
  let n=prefix==='wd'?7:12;
  for(let i=0;i<n;i++){let el=document.getElementById(prefix+i);if(el)el.checked=on;}
}
function updateRepeatUI(){
  let r=document.querySelector('input[name="rep"]:checked')?.value||'none';
  let re=document.getElementById('repeatEnd');
  if(re)re.style.display=r==='none'?'none':'block';
  // V2.3 (Punkt 4): Platzhalter des Intervall-Felds folgt der Einheit
  let ri=document.getElementById('rInt'),ru=document.getElementById('rUnit');
  if(ri&&ru){
    let isH=ru.value==='stunden';
    ri.placeholder=isH?'HH:MM':'';
    ri.title=isH?'Format: HH:MM (z.B. 02:30 für alle 2,5 Stunden) oder ganze Stundenzahl':'Anzahl';
    // V2.4 (Punkt 2): Serienstart (Datum + Uhrzeit aus dem Register
    // „Beschreibung") direkt bei der Stunden-Wiederholung anzeigen
    let hh=document.getElementById('rHourHint');
    if(hh){
      let show=isH&&r==='interval';
      hh.style.display=show?'block':'none';
      if(show){
        hh.textContent=formData.time
          ?`Serienstart: ${formData.date?fmtDisp(formData.date)+' ':''}um ${formData.time} Uhr (Feld „Uhrzeit" im Register „Beschreibung"). Beispiel: alle 27 Stunden ab 16:40 → nächstes Vorkommen 19:40 am Folgetag.`
          :'⚠️ Bitte im Register „Beschreibung" eine Uhrzeit eintragen – sie ist der Startpunkt der Stundenserie (z.B. Start 16:40, alle 27 Stunden).';
      }
    }
  }
}

function saveEvent(){
  captureTab();
  let f=formData;
  let title=(f.title||'').trim();
  if(!title){alert('Bitte im Register „Beschreibung" einen Titel eingeben!');switchTab(0);return;}
  if(!f.date){alert('Bitte ein Datum eingeben!');switchTab(0);return;}

  /* ===== V2.2: Plausibilitätsprüfung der Datums-/Zeitangaben =====
     Fängt Eingabefehler ab, BEVOR sie stillschweigend in der Datenbank
     landen (inverses Enddatum verhielt sich bisher wie ein Eintagestermin,
     blieb aber gespeichert; inverse Endzeit wanderte unverändert bis in den
     ICS-Export, wo DTEND vor DTSTART läge). */
  // (1) Enddatum vor dem Beginn -> anbieten, die beiden Daten zu tauschen
  if(f.dateEnd&&f.dateEnd<f.date){
    if(confirm(`Das Enddatum (${fmtDisp(f.dateEnd)}) liegt VOR dem Beginn (${fmtDisp(f.date)}).\n\nOK = Datumsangaben tauschen\nAbbrechen = zurück zur Eingabe`)){
      let tmp=f.date;f.date=f.dateEnd;f.dateEnd=tmp;
      // sichtbare Felder mitziehen – sonst würde das nächste captureTab
      // (z.B. nach abgebrochener Konfliktabfrage) den Tausch wieder aufheben
      let el;if(el=document.getElementById('fDate'))el.value=f.date;
      if(el=document.getElementById('fDateEnd'))el.value=f.dateEnd;
    }else{switchTab(0);renderEventTab(0);return;}
  }
  // V2.7: Sterbedatum vor dem Geburts-/Startdatum abfangen
  if(f.deathDate&&f.deathDate<f.date){
    alert(`Das Sterbedatum (${fmtDisp(f.deathDate)}) liegt VOR dem Geburtsdatum (${fmtDisp(f.date)}) – bitte korrigieren.`);
    switchTab(0);renderEventTab(0);return;
  }
  // V2.3 (Punkt 4): Intervall-Eingabe prüfen. Bei Einheit „Stunden" ist das
  // Format HH:MM (z.B. 02:30 = alle 2,5 Stunden) oder eine ganze Zahl erlaubt;
  // bei allen anderen Einheiten nur eine ganze Zahl.
  if(f.repeat==='interval'){
    let v=String(f.repeatInterval||'').trim();
    if((f.repeatUnit||'jahre')==='stunden'){
      if(!/^\d{1,4}(:[0-5]\d)?$/.test(v)||parseHHMM(v)<1){
        alert('Bitte das Stunden-Intervall als ganze Zahl (z.B. 2) oder im Format HH:MM (z.B. 02:30 für alle 2,5 Stunden) eingeben.');
        switchTab(1);return;
      }
    }else if(!/^\d{1,5}$/.test(v)||parseInt(v)<1){
      alert('Bitte das Wiederholungs-Intervall als ganze Zahl eingeben (z.B. 2).');
      switchTab(1);return;
    }
    // V2.4 (Punkt 2): Eine Stundenserie braucht eine Anfangszeit als
    // Startpunkt – sonst würde die Serie stillschweigend um 00:00 beginnen.
    if((f.repeatUnit||'jahre')==='stunden'&&!f.time){
      alert('Für die Wiederholung „alle X Stunden" wird eine Anfangszeit benötigt.\nBitte im Register „Beschreibung" das Feld „Uhrzeit" ausfüllen – sie ist der Startpunkt der Serie (z.B. Start 16:40, alle 27 Stunden → 16:40, 19:40 am Folgetag, …).');
      switchTab(0);renderEventTab(0);return;
    }
  }
  // (2) Endzeit ohne Anfangszeit -> der Termin wäre für die Konfliktprüfung
  //     unsichtbar und die Anzeige uneindeutig
  if(f.timeEnd&&!f.time){
    alert('Es ist eine Endzeit („Bis"), aber keine Anfangszeit eingetragen.\nBitte eine Uhrzeit für den Beginn eingeben oder das „Bis"-Feld leeren.');
    switchTab(0);renderEventTab(0);return;
  }
  // (3) Endzeit vor/gleich der Anfangszeit am selben Tag -> Rückfrage, ob der
  //     Termin über Mitternacht bis in den Folgetag gehen soll (z.B. 22:00–01:00).
  //     Nur für Einzeltermine – bei SERIEN wird das Enddatum in der Anzeige
  //     ignoriert, ein „Folgetag" ließe sich dort nicht abbilden.
  if(f.time&&f.timeEnd&&toMin(f.timeEnd)<=toMin(f.time)&&(!f.dateEnd||f.dateEnd===f.date)){
    if(f.repeat&&f.repeat!=='none'){
      alert(`Die Endzeit (${f.timeEnd}) liegt nicht nach der Anfangszeit (${f.time}).\nBei Serienterminen muss die Endzeit am selben Tag liegen – bitte korrigieren.`);
      switchTab(0);renderEventTab(0);return;
    }
    let nd=parseDate(f.date);nd.setDate(nd.getDate()+1);
    let nextDay=fmtDate(nd.getFullYear(),nd.getMonth(),nd.getDate());
    if(confirm(`Die Endzeit (${f.timeEnd}) liegt nicht nach der Anfangszeit (${f.time}).\n\nOK = Termin geht über Mitternacht bis ${f.timeEnd} am ${fmtDisp(nextDay)}\nAbbrechen = zurück zur Eingabe (Tippfehler korrigieren)`)){
      f.dateEnd=nextDay;
      let el;if(el=document.getElementById('fDateEnd'))el.value=nextDay; // Feld mitziehen (s.o.)
    }else{switchTab(0);renderEventTab(0);return;}
  }

  let ev={
    categoryId:f.categoryId||'termin',title,notes:(f.notes||'').trim(),
    date:f.date,time:f.time||'',dateEnd:f.dateEnd||'',timeEnd:f.timeEnd||'',
    reminder:f.reminder||0,alertMin:(f.alertMin===undefined||f.alertMin===null)?'':String(f.alertMin), // V0.6
    // V3.1: Farbe = Kategoriefarbe -> leer speichern, Termin folgt dann auch
    // späteren Farbänderungen der Kategorie
    color:(f.color&&f.color.toLowerCase()!==getCat(f.categoryId||'termin').color.toLowerCase())?f.color:'',textColor:f.textColor||'',chipStyle:f.chipStyle||'',
    repeat:f.repeat||'none',repeatInterval:f.repeatInterval||'1',repeatUnit:f.repeatUnit||'jahre',
    repeatOrd:f.repeatOrd||'first',repeatWd:f.repeatWd||'1',repeatMonth:f.repeatMonth??'',
    repeatUntil:f.repeatUntil||'',repeatCount:f.repeatCount||'',skipHolidays:!!f.skipHolidays,exdates:f.exdates||[],wdMask:f.wdMask||'1111111',moMask:f.moMask||'111111111111',
    relative:f.relative||'',offset:f.offset||0,displayType:f.displayType||'termin',
    deathDate:f.deathDate||'' // V2.7: Gedenktag
  };
  if(f.importUid)ev.importUid=f.importUid;
  // V3.0 (Fix): Ausblende-Status (👁/🙈) beim Bearbeiten erhalten – bisher
  // tauchte ein ausgeblendeter Termin nach jedem Speichern wieder auf
  if(f.hidden===true)ev.hidden=true;

  // Konflikterkennung: Zeitüberschneidung am selben Tag (nur Termine mit Uhrzeit)
  let conflict=findConflict(ev,editingId);
  if(conflict&&!confirm(`⚠️ Überschneidung mit „${conflict.title}"${conflict.time?' um '+conflict.time:''} am ${fmtDisp(conflict.__conflictDate||ev.date)}.\nTrotzdem speichern?`))return;

  let wasEdit=!!editingId;
  pushUndo((wasEdit?'Termin bearbeitet: ':'Termin erstellt: ')+title);
  if(editingId){
    let idx=DB.events.findIndex(e=>e.id===editingId);
    if(idx>=0)DB.events[idx]={...ev,id:editingId};
    else DB.events.push({...ev,id:editingId}); // in anderem Tab gelöscht? Bearbeitung nicht verlieren
  }else{
    ev.id='ev_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);
    DB.events.push(ev);
    // V1.1: beim Aufziehen über mehrere Tage gleich alle Tage anlegen
    if(tgMultiDays.length){
      let extra=tgMultiDays.slice();
      extra.forEach(ds=>{
        let c=JSON.parse(JSON.stringify(ev)),dd=tgDayNum(ds)-tgDayNum(ev.date);
        c.id='ev_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);
        c.date=ds;if(c.dateEnd)c.dateEnd=tgDayStr(tgDayNum(c.dateEnd)+dd);
        DB.events.push(c);
      });
      title+=` (${extra.length+1} Tage)`;
    }
  }
  tgMultiDays=[];
  saveDB();closeModal();render();
  // V2.3: Speicher-Meldungen ohne „Rückgängig"-Knopf (Punkt 2) – die Änderung
  // bleibt über Strg+Z zurücknehmbar, aber der Knopf direkt neben „gespeichert"
  // wirkte irreführend (als wäre das Speichern selbst fehlgeschlagen).
  showToast(`✓ ${wasEdit?'Termin gespeichert':'Termin erstellt'}: ${title}`,false);
}

function deleteEvent(id){
  if(String(id).startsWith('pl:')){openPlanItemModal(id);return;} // V0.3
  let ev=DB.events.find(e=>e.id===id);
  if(!ev)return;
  let isSerie=ev.repeat&&ev.repeat!=='none';
  let isRange=!isSerie&&ev.dateEnd&&ev.dateEnd>ev.date;
  let msg,kind;
  if(isSerie){
    kind='Serie';
    msg=`GANZE SERIE löschen?\n\n„${ev.title}"\n\nALLE Vorkommen dieser Serie werden entfernt.\n(Nur einen einzelnen Tag löschen: Vorkommen in der Ansicht anklicken → „Nur dieses Vorkommen löschen".)`;
  }else if(isRange){
    kind='Zeitraum';
    let n=Math.round((parseDate(ev.dateEnd)-parseDate(ev.date))/86400000)+1;
    msg=`GESAMTEN ZEITRAUM löschen?\n\n„${ev.title}"\n${fmtDisp(ev.date)} – ${fmtDisp(ev.dateEnd)} (${n} Tage)\n\nAlle ${n} Tage dieses Termins werden entfernt.`;
  }else{
    kind='Termin';
    msg=`Termin löschen?\n\n„${ev.title}" am ${fmtDisp(ev.date)}${ev.time?' um '+ev.time:''}`;
  }
  /* V1.9: Nachfrage abschaltbar (⚙️ Einstellungen) – Rückgängig bleibt über
     den Undo-Knopf/Strg+Z immer möglich. Serien und Zeiträume fragen aus
     Sicherheitsgründen weiterhin nach, da hier viele Tage auf einmal fallen. */
  let skipAsk=SETTINGS.noConfirmDelete&&!isSerie&&!isRange;
  if(!skipAsk&&!confirm(msg+(SETTINGS.noConfirmDelete?'':'\n\n(Tipp: Diese Nachfrage lässt sich unter ⚙️ Einstellungen abschalten.)')))return;
  pushUndo(`${kind} gelöscht: ${ev.title}`);
  DB.events=DB.events.filter(e=>e.id!==id);
  saveDB();closeModal();render();
  showToast(`🗑 ${kind} gelöscht: ${ev.title}`,true);
}

function closeModal(){
  tgMultiDays=[]; // V1.1
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('modalBody').innerHTML=''; // verwaiste Felder entfernen – sonst liest captureTab beim nächsten Öffnen alte Werte
  editingId=null;icsPreview=null; // offene Import-Vorschau verwerfen (es wurde ja noch nichts geschrieben)
}

function shareEvent(id){

/* ===== SUCHE ===== */
function openSearchModal(){
  editingId=null;
  openOverlay();
  document.getElementById('modalTabs').style.display='none';
  document.getElementById('modalTitle').textContent='🔍 Termine suchen';
  document.getElementById('modalBody').innerHTML=`
    <div class="form-row"><input id="searchInput" placeholder="Titel, Notiz oder Kategorie eingeben..." oninput="doSearch()" autocomplete="off"></div>
    <div id="searchResults" style="max-height:50vh;overflow-y:auto"></div>`;
  document.getElementById('modalFooter').innerHTML=`<button class="btn-cancel" onclick="closeModal()">Schließen</button>`;
  document.getElementById('searchInput').focus();
  doSearch();
}
/* V2.1: feste Kalendertage (Feiertage/besondere Tage) für die Suche –
   durchsucht werden das aktuell gewählte Jahr sowie je 2 Jahre davor/danach,
   damit auch beim Vor-/Zurückblättern gefundene Treffer plausibel bleiben */
function searchFixedDays(q){
  let out=[];
  for(let y=state.year-2;y<=state.year+2;y++){
    let hols=getHolidays(y),spec=getSpecial(y);
    Object.keys(hols).forEach(key=>{
      let label=hols[key];
      if(!label.toLowerCase().includes(q))return;
      let[mm,dd]=key.split('-').map(Number);
      out.push({label,emoji:'🏛️',dateStr:fmtDate(y,mm-1,dd)});
    });
    Object.keys(spec).forEach(key=>{
      let s=spec[key];
      if(!s.label.toLowerCase().includes(q))return;
      let[mm,dd]=key.split('-').map(Number);
      out.push({label:s.label,emoji:s.emoji,dateStr:fmtDate(y,mm-1,dd)});
    });
  }
  return out.sort((a,b)=>a.dateStr.localeCompare(b.dateStr));
}
function doSearch(){
  let q=(document.getElementById('searchInput')?.value||'').toLowerCase().trim();
  let res=document.getElementById('searchResults');
  if(!res)return;
  let hits=DB.events.filter(ev=>{
    if(!q)return true;
    let cat=getCat(ev.categoryId);
    return ev.title.toLowerCase().includes(q)||(ev.notes||'').toLowerCase().includes(q)||cat.name.toLowerCase().includes(q);
  }).sort((a,b)=>a.date.localeCompare(b.date));
  // V2.1: zusätzlich feste Bezeichnungen wie Feiertage/besondere Tage durchsuchen (nur bei Texteingabe)
  let fixedHits=q?searchFixedDays(q):[];
  let tplAny=q&&(DB.templates||[]).some(t=>!t.deleted&&((t.title||'').toLowerCase().includes(q)||(t.notes||'').toLowerCase().includes(q)));
  if(!hits.length&&!fixedHits.length&&!tplAny){res.innerHTML='<div style="padding:16px;text-align:center;color:var(--muted2)">Keine Treffer</div>';return;}
  let html=hits.slice(0,100).map(ev=>{
    let cat=getCat(ev.categoryId);
    return`<div class="list-ev" onclick="openEventModal('${ev.id}')">
      <div class="list-ev-date">${fmtDisp(ev.date)}</div>
      <span class="ev-dot" style="background:${ev.color||cat.color}"></span>
      <div class="list-ev-info">
        <div class="list-ev-title">${cat.emoji} ${escHtml(ev.title)}${ev.displayType==='versteckt'?' 🙈':''}</div>
        <div class="list-ev-cat">${escHtml(cat.name)}${ev.time?' · '+ev.time:''}${ev.repeat&&ev.repeat!=='none'?' · 🔁':''}${isEvOff(ev)?' · ausgeblendet':''}</div>
      </div>
      <div class="ev-actions">
        <button onclick="event.stopPropagation();closeModal();jumpToEvent('${ev.id}','${ev.date}')" title="Springe zu Termin">📍</button>
        <button onclick="event.stopPropagation();deleteEvent('${ev.id}')" title="Löschen">🗑</button>
      </div>
    </div>`;
  }).join('')+(hits.length>100?'<div style="padding:8px;text-align:center;color:var(--muted2);font-size:12px">…und '+(hits.length-100)+' weitere</div>':'');
  // V0.5.1: Vorlagen (und damit Grundplan-Einträge) mit durchsuchen
  let tplHits=q?(DB.templates||[]).filter(t=>!t.deleted&&((t.title||'').toLowerCase().includes(q)||(t.notes||'').toLowerCase().includes(q))):[];
  if(tplHits.length){
    html+=`<div style="padding:7px 12px;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;background:var(--surface2);margin-top:6px">Vorlagen &amp; Grundplan</div>`;
    html+=tplHits.map(t=>{let n=0;(DB.plans||[]).forEach(p=>p.slots.forEach(x=>{if(x.tpl===t.id)n++;}));let c=t.color||getCat(t.categoryId).color;
      return`<div class="list-ev" onclick="openTplModal('${t.id}')" style="cursor:pointer"><span class="ev-dot" style="background:${c}"></span><div class="list-ev-info"><div class="list-ev-title">⭐ ${escHtml(t.title)}</div><div class="list-ev-cat">${t.dur||60} Min.${t.time?' · üblich '+t.time:''}${n?` · ${n}× im Grundplan`:''}</div></div></div>`;}).join('');
  }
  if(fixedHits.length){
    html+=`<div style="padding:7px 12px;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;background:var(--surface2);margin-top:6px">Feiertage &amp; besondere Tage</div>`;
    html+=fixedHits.slice(0,60).map(fh=>`<div class="list-ev" onclick="closeModal();jumpToDate('${fh.dateStr}')" style="cursor:pointer">
      <div class="list-ev-date">${fmtDisp(fh.dateStr)}</div>
      <div class="list-ev-info">
        <div class="list-ev-title">${fh.emoji} ${escHtml(fh.label)}</div>
      </div>
      <div class="ev-actions"><button onclick="event.stopPropagation();closeModal();jumpToDate('${fh.dateStr}')" title="Springe zu Tag">📍</button></div>
    </div>`).join('');
  }
  res.innerHTML=html;
}

/* ===== BENACHRICHTIGUNGEN (solange die Seite geöffnet ist) ===== */
function notifyEnabled(){try{return localStorage.getItem('timeless_notify')==='1';}catch(e){return false;}}
/* V2.3 (Punkt 9): Der Glocken-Status ist jetzt eindeutig – auf Desktop UND
   Handy identisch: 🔔 kräftig = Benachrichtigungen EIN, 🔕 abgedimmt = AUS.
   Zusätzlich sagt der Tooltip den aktuellen Zustand, und jedes Umschalten
   bestätigt sich mit einer Meldung in der Info-Leiste (am Handy, wo es
   keinen Tooltip gibt, ist die Meldung die Hauptrückmeldung). */
function updateBell(){
  let b=document.getElementById('bellBtn');
  if(!b)return;
  let on=notifyEnabled();
  b.textContent=on?'🔔':'🔕';
  b.style.opacity=on?'1':'.45';
  b.title=on?'Benachrichtigungen sind EIN – klicken zum Ausschalten':'Benachrichtigungen sind AUS – klicken zum Einschalten';
  b.setAttribute('aria-label',b.title);
}
function toggleNotifications(){
  if(notifyEnabled()){
    try{localStorage.setItem('timeless_notify','0');}catch(e){}
    updateBell();
    showToast('🔕 Benachrichtigungen ausgeschaltet',false); // V2.3 (Punkt 9)
    return;
  }
  let activate=()=>{try{localStorage.setItem('timeless_notify','1');}catch(e){}updateBell();showToast('🔔 Benachrichtigungen eingeschaltet',false);checkReminders();};
  if(!('Notification' in window)){
    alert('Dieser Browser unterstützt keine System-Benachrichtigungen.\nErinnerungen erscheinen stattdessen in der Info-Leiste.');
    activate();
  }else if(Notification.permission!=='granted'){
    Notification.requestPermission().then(p=>{
      if(p!=='granted')alert('Berechtigung verweigert – Erinnerungen erscheinen nur in der Info-Leiste.');
      activate();
    });
  }else activate();
}
function getNotified(){try{return JSON.parse(localStorage.getItem('timeless_notified')||'{}');}catch(e){return{};}}
function checkReminders(){
  if(!notifyEnabled())return;
  let done=getNotified(),fired=[];
  let todayNum=parseInt(fmtDate(today.getFullYear(),today.getMonth(),today.getDate()).replace(/-/g,''));
  Object.keys(done).forEach(k=>{if(todayNum-done[k]>100)delete done[k];}); // Aufräumen
  DB.events.forEach(ev=>{
    if(!ev.reminder||ev.reminder<1)return;
    [parseInt(ev.reminder),0].forEach(off=>{
      let t=new Date(today.getFullYear(),today.getMonth(),today.getDate()+off);
      if(!occursOn(ev,t.getFullYear(),t.getMonth(),t.getDate()))return;
      let key=ev.id+'@'+fmtDate(t.getFullYear(),t.getMonth(),t.getDate())+'@'+off;
      if(done[key])return;
      done[key]=todayNum;
      let when=off===0?'HEUTE':`in ${off} Tag${off>1?'en':''}`;
      let msg=`${getCat(ev.categoryId).emoji} ${displayTitle(ev,t.getFullYear(),t.getMonth(),t.getDate())} – ${when}${ev.time?' um '+evTimeOn(ev,t.getFullYear(),t.getMonth(),t.getDate()):''}`;
      fired.push(msg);
      if('Notification' in window&&Notification.permission==='granted'){
        try{new Notification('Timeless',{body:msg});}catch(e){}
      }
    });
  });
  if(fired.length){
    try{localStorage.setItem('timeless_notified',JSON.stringify(done));}catch(e){}
    document.getElementById('infoBar').innerHTML=`<span class="warn-txt">🔔 ${fired.map(escHtml).join(' · ')}</span>`;
  }
}

/* ICS-Sonderzeichen escapen (RFC 5545) */
function icsEscape(s){
  return(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
}
const ICS_WD=['SU','MO','TU','WE','TH','FR','SA'];
const ORD_NUM={first:1,second:2,third:3,fourth:4,fifth:5,last:-1};

/* Erzeugt VEVENT-Zeilen für ein Event – alle Wiederholungstypen, Alarm, UNTIL */
function buildVEVENT(ev){
  let cat=getCat(ev.categoryId);
  let ds=ev.date.replace(/-/g,''); // V2.8: tote Variable 'de' entfernt (Enddatum wird unten je Zweig neu berechnet)
  let lines=['BEGIN:VEVENT',`UID:${ev.id}@ecpro`];
  if(ev.time){
    lines.push(`DTSTART;TZID=Europe/Vienna:${ds}T${ev.time.replace(':','')}00`);
    /* V2.6 (Bugfix): DTEND darf nie vor DTSTART liegen. Bisher wurde die
       Standarddauer +1h mit (h+1)%24 berechnet – ein Termin um 23:30 ohne
       Endzeit bekam damit DTEND 00:30 AM SELBEN TAG (vor dem Beginn!);
       Google/Outlook lehnen solche VEVENTs ab. Jetzt rollt die Endzeit
       korrekt auf den Folgetag über. Zusätzlich wird Altbestand mit
       inverser Endzeit am selben Tag defensiv als +60 Min exportiert –
       identisch zur Konfliktprüfung (timeWindowOnDate). */
    let sMin=toMin(ev.time);
    let endDay=(ev.dateEnd&&ev.dateEnd>=ev.date)?ev.dateEnd:ev.date;
    let eMin;
    if(ev.timeEnd&&!(endDay===ev.date&&toMin(ev.timeEnd)<=sMin))eMin=toMin(ev.timeEnd);
    else eMin=sMin+60; // keine Endzeit bzw. Altbestand mit inverser Endzeit
    if(eMin>=1440){ // z.B. 23:30 +1h -> 00:30 am Folgetag
      eMin-=1440;
      let ne=parseDate(endDay);ne.setDate(ne.getDate()+1);
      endDay=fmtDate(ne.getFullYear(),ne.getMonth(),ne.getDate());
    }
    let et=String(Math.floor(eMin/60)).padStart(2,'0')+String(eMin%60).padStart(2,'0')+'00';
    lines.push(`DTEND;TZID=Europe/Vienna:${endDay.replace(/-/g,'')}T${et}`);
  }else{
    lines.push(`DTSTART;VALUE=DATE:${ds}`);
    // DTEND ist exklusiv → letzter Tag +1
    let end=parseDate(ev.dateEnd&&ev.dateEnd>=ev.date?ev.dateEnd:ev.date);
    end.setDate(end.getDate()+1);
    lines.push(`DTEND;VALUE=DATE:${fmtDate(end.getFullYear(),end.getMonth(),end.getDate()).replace(/-/g,'')}`);
  }
  lines.push(`SUMMARY:${icsEscape(ev.title)}`);
  if(ev.notes)lines.push(`DESCRIPTION:${icsEscape(ev.notes)}`);
  lines.push(`CATEGORIES:${icsEscape(cat.name)}`);
  // RRULE
  let rr='';
  switch(ev.repeat){
    case 'yearly':rr='FREQ=YEARLY';break;
    case 'monthly':rr='FREQ=MONTHLY';break;
    case 'monthly-last':rr='FREQ=MONTHLY;BYMONTHDAY=-1';break;
    case 'weekly':rr='FREQ=WEEKLY';break;
    case 'wochentag':{
      let n=ORD_NUM[ev.repeatOrd||'first'],wd=ICS_WD[parseInt(ev.repeatWd||'1')];
      if(ev.repeatMonth!==''&&ev.repeatMonth!==undefined&&ev.repeatMonth!==null){
        rr=`FREQ=YEARLY;BYMONTH=${parseInt(ev.repeatMonth)+1};BYDAY=${n}${wd}`; // z.B. erster Montag im Mai
      }else{
        rr=`FREQ=MONTHLY;BYDAY=${n}${wd}`;
      }
      break;
    }
    case 'interval':{
      let n,freq;
      if(ev.repeatUnit==='stunden'){
        // V2.3: HH:MM-Intervall – ganze Stunden als HOURLY, sonst MINUTELY
        // (beides RFC 5545-konform; MINUTELY erhält z.B. „02:30" exakt)
        let mins=parseHHMM(ev.repeatInterval);
        if(mins%60===0){freq='HOURLY';n=mins/60;}
        else{freq='MINUTELY';n=mins;}
      }else{
        n=parseInt(ev.repeatInterval)||1;
        freq={tage:'DAILY',wochen:'WEEKLY',monate:'MONTHLY',jahre:'YEARLY'}[ev.repeatUnit||'tage'];
      }
      rr=`FREQ=${freq}`+(n>1?`;INTERVAL=${n}`:'');break;
    }
  }
  if(rr){
    // RFC 5545: hat DTSTART eine Uhrzeit, muss UNTIL DATE-TIME sein (sonst lehnen z.B. Google/Outlook den Import ab)
    if(ev.repeatUntil)rr+=`;UNTIL=${ev.repeatUntil.replace(/-/g,'')}`+(ev.time?'T235959Z':'');
    else if(parseInt(ev.repeatCount)>0)rr+=`;COUNT=${parseInt(ev.repeatCount)}`;
    lines.push(`RRULE:${rr}`);
    /* V3.0 (Fix): RFC 5545 verlangt für EXDATE denselben Werttyp wie DTSTART.
       Bei Serien MIT Uhrzeit wurde bisher ein reines Datum exportiert – Google/
       Outlook ignorieren solche Ausnahmen, gelöschte Vorkommen erschienen dort
       wieder. Jetzt: Datum+Uhrzeit mit derselben TZID wie DTSTART. (Der eigene
       Import liest weiterhin nur die ersten 8 Ziffern -> Roundtrip unverändert.) */
    if(ev.exdates&&ev.exdates.length){
      if(ev.time)lines.push(`EXDATE;TZID=Europe/Vienna:${ev.exdates.map(x=>x.replace(/-/g,'')+'T'+ev.time.replace(':','')+'00').join(',')}`);
      else lines.push(`EXDATE;VALUE=DATE:${ev.exdates.map(x=>x.replace(/-/g,'')).join(',')}`);
    }
    if(ev.skipHolidays)lines.push('X-SKIP-HOLIDAYS:TRUE');
  }
  if(ev.wdMask&&ev.wdMask.includes('0'))lines.push(`X-WD-MASK:${ev.wdMask}`);
  if(ev.moMask&&ev.moMask.includes('0'))lines.push(`X-MO-MASK:${ev.moMask}`);
  if(ev.reminder>0){
    lines.push('BEGIN:VALARM',`TRIGGER:-P${ev.reminder}D`,'ACTION:DISPLAY',`DESCRIPTION:${icsEscape(ev.title)}`,'END:VALARM');
  }
  if(ev.time&&ev.alertMin!==undefined&&ev.alertMin!==null&&ev.alertMin!==''){ // V0.6: Minuten-Hinweis
    let am=parseInt(ev.alertMin)||0;
    lines.push('BEGIN:VALARM',am?`TRIGGER:-PT${am}M`:'TRIGGER:PT0M','ACTION:AUDIO','END:VALARM');
  }
  let now=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  lines.push(`DTSTAMP:${now}`,'END:VEVENT');
  return lines;
}
function buildICS(){
  let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Timeless//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  // V2.3 (Punkt 6): nur Termine mit mindestens einem verbleibenden Vorkommen
  // (sichtbare + ausgeblendete); komplett „leergelöschte" Serien-Reste nicht
  DB.events.filter(hasAnyOccurrence).forEach(ev=>{
    lines.push(...buildVEVENT(ev));
    // V2.7: Gedenktag als eigenes jährliches VEVENT ab dem Sterbedatum –
    // eigene UID, damit Fremdkalender (Google/Outlook) beide Serien führen.
    if(ev.deathDate&&ev.repeat==='yearly'){
      let dds=ev.deathDate.replace(/-/g,'');
      let de=parseDate(ev.deathDate);de.setDate(de.getDate()+1);
      let now=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
      let mem=['BEGIN:VEVENT',`UID:${ev.id}-gedenk@ecpro`,
        `DTSTART;VALUE=DATE:${dds}`,
        `DTEND;VALUE=DATE:${fmtDate(de.getFullYear(),de.getMonth(),de.getDate()).replace(/-/g,'')}`,
        `SUMMARY:${icsEscape('✝ '+ev.title)}`,
        `CATEGORIES:${icsEscape(getCat(ev.categoryId).name)}`,
        'RRULE:FREQ=YEARLY',`DTSTAMP:${now}`,'END:VEVENT'];
      lines.push(...mem);
    }
  });
  // V0.5.1: Grundplan wahlweise als Einzeltermine der nächsten 26 Wochen
  if(SETTINGS.icsPlan&&DB.plans&&DB.plans.length){
    let n0=tgDayNum(plThisMon());
    for(let i=0;i<26*7;i++){
      let ds=tgDayStr(n0+i),[y,m,d]=ds.split('-').map(Number);
      plOccurrences(y,m-1,d).forEach(v=>{let e=Object.assign({},v,{id:'tl-'+v._plan+'-'+v._slot+'-'+ds.replace(/-/g,'')});lines.push(...buildVEVENT(e));});
    }
  }
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

/* Download versuchen; bei Fehlschlag (z.B. content://-Kontext) Text-Fallback */
function tryDownload(content,filename,mime,fallbackBoxId){
  try{
    let blob=new Blob([content],{type:mime});
    let url=URL.createObjectURL(blob);
    let a=document.createElement('a');a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){
    let box=fallbackBoxId?document.getElementById(fallbackBoxId):null;
    if(box){box.value=content;box.style.display='block';box.select();}
    alert('Datei-Download hier nicht möglich. '+(box?'Der Inhalt wird als Text angezeigt – markieren und kopieren.':'Nutze „ICS ↕" → Als Text anzeigen.'));
  }
}

/* ===== ICS-IMPORT MIT VORSCHAU & EINZELAUSWAHL (V1.6) =====
   Nichts wird sofort geschrieben. Ablauf:
   1) Datei/Text einlesen und strukturieren
   2) validieren (Datum vorhanden? echtes Kalenderdatum?)
   3) zusammenfassen: neu / Dublette / fehlerhaft
   4) Einzelauswahl (Alle/Keine/Nur neue/Dubletten abwählen; Filter nach
      Titel, Zeitraum, Status)
   5) erst „Ausgewählte importieren" schreibt in die Datenbank
      (mit Sicherungspunkt + Undo) */
let icsPreview=null;
function parseAndImportICS(text){
  let items=parseICSCandidates(text);
  if(!items.length){alert('Keine Termine (VEVENT) im ICS-Inhalt gefunden.');return;}
  icsPreview={items,qRaw:'',q:'',from:'',to:'',status:'alle'};
  renderICSPreview();
}
function parseICSCandidates(text){
  // RFC 5545: gefaltete Zeilen zusammenfügen (CRLF+Space), dann CR entfernen
  text=text.replace(/\r\n[ \t]/g,'').replace(/\n[ \t]/g,'').replace(/\r/g,'');
  let items=[];
  let blocks=text.split('BEGIN:VEVENT');
  blocks.slice(1).forEach((raw,idx)=>{
    let alarmPart=raw.split('BEGIN:VALARM')[1]||'';
    let block=raw.split('BEGIN:VALARM')[0];
    let get=key=>{let m=block.match(new RegExp('(?:^|\\n)'+key+'[^:\\n]*:(.+)'));return m?m[1].trim().replace(/\\n/gi,'\n').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\\\/g,'\\'):null;};
    let title=get('SUMMARY')||'Importiert';
    let uid=get('UID')||'';
    let dtstart=get('DTSTART')||'';
    let dtend=get('DTEND')||'';
    let desc=get('DESCRIPTION')||'';
    let cats=get('CATEGORIES')||'';
    let rrule=get('RRULE')||'';
    let dclean=dtstart.replace(/[^0-9TZ]/g,'');
    let dateStr='',timeStr='';
    if(dclean.length>=8)dateStr=`${dclean.substr(0,4)}-${dclean.substr(4,2)}-${dclean.substr(6,2)}`;
    let tPos=dclean.indexOf('T');
    if(tPos>=0&&dclean.length>=tPos+5)timeStr=`${dclean.substr(tPos+1,2)}:${dclean.substr(tPos+3,2)}`;
    /* V3.0 (Fix): UTC-Zeitangaben („…T080000Z", typisch für Google/Outlook-
       Exporte) wurden bisher unverändert als Ortszeit übernommen – ein
       Termin um 10:00 Wiener Sommerzeit landete als 08:00 im Kalender.
       Jetzt Umrechnung in die lokale Zeit (inkl. evtl. Datumswechsel). */
    let utcToLocal=(c)=>{
      let dt=new Date(Date.UTC(+c.substr(0,4),+c.substr(4,2)-1,+c.substr(6,2),+c.substr(9,2),+c.substr(11,2)));
      return{d:fmtDate(dt.getFullYear(),dt.getMonth(),dt.getDate()),t:String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0')};
    };
    if(timeStr&&tPos===8&&/Z$/.test(dclean)&&dclean.length>=15){let l=utcToLocal(dclean);dateStr=l.d;timeStr=l.t;}
    // Validierung -> Status "fehlerhaft" statt stilles Überspringen
    if(!dateStr){
      items.push({sel:false,status:'fehlerhaft',err:'Kein Startdatum (DTSTART)',title,date:'',time:'',dateEnd:'',rep:false,ev:null});
      return;
    }
    let chk=parseDate(dateStr);
    if(fmtDate(chk.getFullYear(),chk.getMonth(),chk.getDate())!==dateStr){
      items.push({sel:false,status:'fehlerhaft',err:'Ungültiges Datum: '+dateStr,title,date:dateStr,time:timeStr,dateEnd:'',rep:false,ev:null});
      return;
    }
    /* DTEND auswerten. V2.6 (Bugfix): bisher nur bei All-Day-Terminen –
       bei Terminen MIT Uhrzeit gingen Endzeit (timeEnd) und ein späteres
       Enddatum (Über-Mitternacht/mehrtägig) beim Import komplett verloren,
       sogar beim Wiedereinlesen des eigenen ICS-Exports. Jetzt:
       • mit Uhrzeit: DTEND ist der tatsächliche Endzeitpunkt → Endzeit
         übernehmen; liegt das DTEND-Datum später, wird es zum Enddatum
         (entspricht exakt der eigenen Über-Mitternacht-Semantik)
       • ohne Uhrzeit (All-Day): DTEND ist exklusiv → dateEnd = DTEND-1 */
    let dateEnd='',timeEndStr='';
    if(dtend){
      if(timeStr){
        let ec=dtend.replace(/[^0-9TZ]/g,'');
        if(ec.length>=8){
          let es=`${ec.substr(0,4)}-${ec.substr(4,2)}-${ec.substr(6,2)}`;
          let tp=ec.indexOf('T');
          if(tp>=0&&ec.length>=tp+5)timeEndStr=`${ec.substr(tp+1,2)}:${ec.substr(tp+3,2)}`;
          if(timeEndStr&&tp===8&&/Z$/.test(ec)&&ec.length>=15){let l=utcToLocal(ec);es=l.d;timeEndStr=l.t;} // V3.0: UTC -> lokal
          if(es>dateStr)dateEnd=es;
        }
      }else{
        let ec=dtend.replace(/[^0-9]/g,'');
        if(ec.length>=8){
          let ed=new Date(+ec.substr(0,4),+ec.substr(4,2)-1,+ec.substr(6,2)-1);
          let es=fmtDate(ed.getFullYear(),ed.getMonth(),ed.getDate());
          if(es>dateStr)dateEnd=es;
        }
      }
    }
    // RRULE → internes Modell
    let repeat='none',repeatInterval='1',repeatUnit='tage',repeatOrd='first',repeatWd='1',repeatMonth='',repeatUntil='',repeatCount='';
    if(rrule){
      let um=rrule.match(/UNTIL=(\d{8})/);
      if(um)repeatUntil=`${um[1].substr(0,4)}-${um[1].substr(4,2)}-${um[1].substr(6,2)}`;
      let cm=rrule.match(/COUNT=(\d+)/);
      if(cm)repeatCount=cm[1];
      let im=rrule.match(/INTERVAL=(\d+)/);
      let iv=im?parseInt(im[1]):1;
      let bd=rrule.match(/BYDAY=(-?\d)(SU|MO|TU|WE|TH|FR|SA)/);
      let bm=rrule.match(/BYMONTH=(\d{1,2})/);
      if(bd&&(/FREQ=MONTHLY/.test(rrule)||(/FREQ=YEARLY/.test(rrule)&&bm))){
        repeat='wochentag';
        repeatOrd=Object.keys(ORD_NUM).find(k=>ORD_NUM[k]===parseInt(bd[1]))||'first';
        repeatWd=String(ICS_WD.indexOf(bd[2]));
        if(bm)repeatMonth=String(parseInt(bm[1])-1); // "erster Montag im Mai"
      }
      else if(/FREQ=MONTHLY/.test(rrule)&&/BYMONTHDAY=-1/.test(rrule))repeat='monthly-last';
      else if(/FREQ=YEARLY/.test(rrule))repeat=iv>1?'interval':'yearly',iv>1&&(repeatInterval=String(iv),repeatUnit='jahre');
      else if(/FREQ=MONTHLY/.test(rrule))repeat=iv>1?'interval':'monthly',iv>1&&(repeatInterval=String(iv),repeatUnit='monate');
      else if(/FREQ=WEEKLY/.test(rrule))repeat=iv>1?'interval':'weekly',iv>1&&(repeatInterval=String(iv),repeatUnit='wochen');
      else if(/FREQ=DAILY/.test(rrule)){repeat='interval';repeatInterval=String(iv);repeatUnit='tage';}
      else if(/FREQ=HOURLY/.test(rrule)){repeat='interval';repeatInterval=String(iv);repeatUnit='stunden';}
      else if(/FREQ=MINUTELY/.test(rrule)){ // V2.3: Minuten-Intervall -> HH:MM
        repeat='interval';repeatUnit='stunden';
        repeatInterval=String(Math.floor(iv/60)).padStart(2,'0')+':'+String(iv%60).padStart(2,'0');
      }
    }
    // EXDATE: gelöschte Einzelvorkommen (mehrere Zeilen und/oder kommagetrennt)
    let exdates=[];
    let exRe=/(?:^|\n)EXDATE[^:\n]*:(.+)/g,exm;
    while((exm=exRe.exec(block))!==null){
      exm[1].split(',').forEach(x=>{
        let c=x.replace(/[^0-9]/g,'').substr(0,8);
        if(c.length===8)exdates.push(`${c.substr(0,4)}-${c.substr(4,2)}-${c.substr(6,2)}`);
      });
    }
    let skipHolidays=/(?:^|\n)X-SKIP-HOLIDAYS[^:\n]*:TRUE/i.test(block);
    let wm=block.match(/(?:^|\n)X-WD-MASK[^:\n]*:([01]{7})/);
    let mo=block.match(/(?:^|\n)X-MO-MASK[^:\n]*:([01]{12})/);
    let wdMask=wm?wm[1]:'1111111';
    let moMask=mo?mo[1]:'111111111111';
    // Erinnerung aus VALARM (TRIGGER:-P3D bzw. -PT…)
    let reminder=0;
    let tm=alarmPart.match(/TRIGGER:-P(\d+)D/);
    if(tm)reminder=parseInt(tm[1]);
    // V0.6: Minuten-/Stunden-Hinweise aus allen VALARM-Blöcken
    let alertMin='',am=raw.match(/TRIGGER[^:\n]*:-?PT(\d+)([HMS])/);
    if(am&&timeStr){let v=parseInt(am[1]);alertMin=String(am[2]==='H'?v*60:am[2]==='S'?Math.round(v/60):v);}
    // Kategorie
    let catId='termin',cl=cats.toLowerCase();
    if(cl.includes('birthday')||cl.includes('geburtstag'))catId='geburtstag';
    else if(cl.includes('holiday')||cl.includes('feiertag'))catId='feiertag';
    else DB.categories.forEach(c=>{if(cl.includes(c.name.toLowerCase()))catId=c.id;});
    let id='ics_'+Date.now()+'_'+idx+'_'+Math.random().toString(36).substr(2,4);
    // Dubletten-Erkennung: erst Import-Kennung, dann Titel+Datum
    let nt=normTitle(title);
    let dup=(uid&&DB.events.find(e=>e.importUid&&e.importUid===uid))
          ||DB.events.find(e=>normTitle(e.title)===nt&&e.date===dateStr);
    let ev={id,importUid:uid,categoryId:catId,title,notes:desc,date:dateStr,time:timeStr,timeEnd:timeEndStr,dateEnd,
      repeat,repeatInterval,repeatUnit,repeatOrd,repeatWd,repeatMonth,repeatUntil,repeatCount,exdates,skipHolidays,wdMask,moMask,reminder,alertMin,displayType:'termin'};
    // neu = angehakt, Dublette = abgewählt (kann bewusst wieder angehakt werden)
    items.push({sel:!dup,status:dup?'dublette':'neu',err:'',title,date:dateStr,time:timeStr,timeEnd:timeEndStr,dateEnd,rep:repeat!=='none',ev});
  });
  return items;
}
function previewMatch(i){
  let p=icsPreview;
  if(p.status!=='alle'&&i.status!==p.status)return false;
  if(p.q&&!(i.title||'').toLowerCase().includes(p.q))return false;
  if(p.from&&i.date&&i.date<p.from)return false;
  if(p.to&&i.date&&i.date>p.to)return false;
  return true;
}
function icsSetFilter(field,val){
  if(!icsPreview)return;
  if(field==='q'){icsPreview.qRaw=val;icsPreview.q=val.toLowerCase().trim();}
  else icsPreview[field]=val;
  renderICSPreview(field==='q');
}
function icsToggle(idx,checked){
  if(!icsPreview)return;
  icsPreview.items[idx].sel=checked;
  renderICSPreview();
}
function icsBulk(mode){
  let p=icsPreview;if(!p)return;
  if(mode==='alle')p.items.forEach(i=>{if(previewMatch(i)&&i.status!=='fehlerhaft')i.sel=true;});
  else if(mode==='keine')p.items.forEach(i=>{if(previewMatch(i))i.sel=false;});
  else if(mode==='neue')p.items.forEach(i=>{i.sel=(i.status==='neu');});
  else if(mode==='nodup')p.items.forEach(i=>{if(i.status==='dublette')i.sel=false;});
  renderICSPreview();
}
const IMP_BADGE={neu:['NEU','#27ae60'],dublette:['DUBLETTE','#e67e22'],fehlerhaft:['FEHLER','#c0392b']};

  let rows=visible.map(({i,idx})=>{
    let bd=IMP_BADGE[i.status];

    return`<div class="imp-row ${i.status==='dublette'?'dup':''}${i.status==='fehlerhaft'?'err':''}">
      <input type="checkbox" ${i.sel?'checked':''} ${i.status==='fehlerhaft'?'disabled':''} onchange="icsToggle(${idx},this.checked)">
      <span class="imp-badge" style="background:${bd[1]}">${bd[0]}</span>
      <span class="imp-title" title="${escAttr(i.title)}">${escHtml(i.title)}</span>
      <span class="imp-date">${i.status==='fehlerhaft'?escHtml(i.err):dateTxt}</span>
    </div>`;
  }).join('')||'<div style="padding:16px;text-align:center;color:var(--muted2);font-size:12px">Kein Eintrag entspricht dem Filter</div>';
  document.getElementById('modalBody').innerHTML=`
    <p style="font-size:12px;color:var(--text2);margin-bottom:8px"><b>${p.items.length}</b> Einträge gelesen:
      <b style="color:#27ae60">${c.neu} neu</b> ·
      <b style="color:#e67e22">${c.dublette} Dubletten</b> ·
      <b style="color:#c0392b">${c.fehlerhaft} fehlerhaft</b>

    <div class="imp-tools">
      <button onclick="icsBulk('alle')">☑ Alle auswählen</button>
      <button onclick="icsBulk('keine')">☐ Keine auswählen</button>
      <button onclick="icsBulk('neue')">✳ Nur neue auswählen</button>
      <button onclick="icsBulk('nodup')">🚫 Dubletten abwählen</button>
    </div>
    <div class="imp-tools">
      <input id="icsQ" placeholder="Nach Titel filtern…" value="${escAttr(p.qRaw)}" oninput="icsSetFilter('q',this.value)" style="flex:1;min-width:130px;padding:5px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px;font-family:inherit">
      <input type="date" value="${p.from}" onchange="icsSetFilter('from',this.value)" title="Zeitraum: von" style="padding:4px;border:1px solid var(--border);border-radius:4px;font-size:11px;font-family:inherit">
      <input type="date" value="${p.to}" onchange="icsSetFilter('to',this.value)" title="Zeitraum: bis" style="padding:4px;border:1px solid var(--border);border-radius:4px;font-size:11px;font-family:inherit">
      <select onchange="icsSetFilter('status',this.value)" style="padding:5px;border:1px solid var(--border);border-radius:4px;font-size:12px;font-family:inherit">
        <option value="alle" ${p.status==='alle'?'selected':''}>Alle Status</option>
        <option value="neu" ${p.status==='neu'?'selected':''}>Nur neue</option>
        <option value="dublette" ${p.status==='dublette'?'selected':''}>Nur Dubletten</option>
        <option value="fehlerhaft" ${p.status==='fehlerhaft'?'selected':''}>Nur fehlerhafte</option>
      </select>
    </div>
    <p style="font-size:10px;color:var(--muted2);margin-bottom:4px">„Alle/Keine auswählen" wirkt auf die aktuell gefilterte Liste. Fehlerhafte Einträge können nicht importiert werden.</p>
    <div id="icsPrevList" style="max-height:42vh;overflow-y:auto;border:1px solid var(--border2);border-radius:4px">${rows}</div>`;
  document.getElementById('modalFooter').innerHTML=`
    <button class="btn-cancel" onclick="icsPreview=null;openICSModal()">Abbrechen</button>
    <button class="btn-ok" onclick="commitICSImport()"${selCount?'':' disabled style="opacity:.5;cursor:not-allowed"'}>📥 Ausgewählte Termine importieren (${selCount})</button>`;
  let nl=document.getElementById('icsPrevList');
  if(nl)nl.scrollTop=scroll;
  if(keepFocus){
    let s=document.getElementById('icsQ');
    if(s){s.focus();let l=s.value.length;try{s.setSelectionRange(l,l);}catch(e){}}
  }
}
function commitICSImport(){
  let p=icsPreview;if(!p)return;
  let chosen=p.items.filter(i=>i.sel&&i.status!=='fehlerhaft'&&i.ev);
  if(!chosen.length){alert('Bitte mindestens einen Termin auswählen.');return;}
  saveRestorePoint(`ICS-Import (${chosen.length} Termine)`); // persistent (V1.6)
  pushUndo(`ICS-Import (${chosen.length} Termine)`);
  chosen.forEach(i=>DB.events.push(i.ev));
  icsPreview=null;
  saveDB();closeModal();render();
  showToast(`📥 ${chosen.length} Termin${chosen.length>1?'e':''} importiert`,true);
  if(!storageOK)alert('⚠️ Achtung: Nicht dauerhaft gespeichert (siehe Hinweis oben).');
}

/* Backup-Inhalt: ALLE Termine & Kategorien; Duplikate werden beim Schreiben gefiltert */
/* ===== V2.3 (Punkt 6): Export-Filter =====
   Serien, deren Wiederholung komplett beendet wurde (repeatUntil vor dem
   Start) oder deren sämtliche Vorkommen als Ausnahmen entfernt wurden, sind
   im Kalender nirgends mehr sichtbar – die Datensätze blieben aber in der DB
   und wanderten bisher mit in ICS- und JSON-Export. Exportiert werden jetzt
   nur Termine, die noch mindestens EIN Vorkommen haben (sichtbare UND per
   Auge-Schalter ausgeblendete – Letztere sind ja nur optisch versteckt).
   Bei sehr langen begrenzten Serien (> ca. 11 Jahre Spannweite) wird
   großzügig exportiert statt lange zu rechnen. */
function hasAnyOccurrence(ev){
  if(ev.relative)return true;                       // jährlich relativ zu Ostern/Advent
  if(!(ev.repeat&&ev.repeat!=='none'))return true;  // Einzeltermine/Zeiträume: gelöschte sind gar nicht mehr in der DB
  if(ev.repeatUntil){
    let s=parseDate(ev.date),e=parseDate(ev.repeatUntil);
    s.setHours(0,0,0,0);e.setHours(0,0,0,0);
    if(e<s)return false;                            // Serie endete vor ihrem Start -> tot
    let span=Math.round((e-s)/86400000);
    if(span>4000)return true;                       // Performance-Grenze: im Zweifel behalten
    let cur=new Date(s);
    for(let i=0;i<=span;i++){
      if(occursOn(ev,cur.getFullYear(),cur.getMonth(),cur.getDate()))return true;
      cur.setDate(cur.getDate()+1);
    }
    return false;                                   // alle Vorkommen entfernt -> tot
  }
  return true;                                      // unbegrenzte/anzahlbegrenzte Serien: behalten
}
function exportPayload(){
  ensureDBShape();
  let seen=new Set(),skipped=0; // V2.8: toten Zähler 'dead' entfernt
  let events=DB.events.filter(ev=>{
    if(!hasAnyOccurrence(ev))return false; // V2.3 (Punkt 6)
    // V2.6 (Bugfix): Schlüssel wie in der Duplikatbereinigung um die
    // Wiederholungs-Details erweitert – zwei verschieden eingestellte Serien
    // mit gleichem Titel/Start fielen sonst stillschweigend aus dem Backup.
    let key=[ev.title,ev.date,ev.time||'',ev.repeat||'none',
      ev.repeatInterval||'',ev.repeatUnit||'',ev.repeatOrd||'',ev.repeatWd||'',ev.repeatMonth??'',
      ev.repeatUntil||'',ev.repeatCount||'',ev.wdMask||'',ev.moMask||'',ev.relative||'',ev.offset||0,ev.deathDate||''].join('|'); // V2.7: + Sterbedatum
    if(seen.has(key)){skipped++;return false;}
    seen.add(key);return true;
  });
  try{localStorage.setItem('timeless_lastBackup',new Date().toISOString());}catch(e){}
  return {app:'Timeless',version:APP_VERSION,exportedAt:new Date().toISOString(),
    duplicatesSkipped:skipped,categories:DB.categories,events,templates:DB.templates,plans:DB.plans,ferien:DB.ferien,
    settings:{notify:(function(){try{return localStorage.getItem('timeless_notify')||'0'}catch(e){return'0'}})()}};
}
function exportJSON(){ tryDownload(JSON.stringify(exportPayload(),null,2),`timeless_backup_${new Date().toISOString().split('T')[0]}.json`,'application/json','jsonExportBox'); }
function exportJSONText(){ let b=document.getElementById('jsonExportBox');b.value=JSON.stringify(exportPayload(),null,2);b.style.display='block';b.select(); }

function importJSON(input){
  let file=input.files[0];if(!file)return;
  let reader=new FileReader();
  reader.onload=e=>loadJSONData(e.target.result);
  reader.onerror=()=>alert('Datei konnte nicht gelesen werden.');
  reader.readAsText(file);
}
function importJSONText(){
  let txt=document.getElementById('jsonImportBox').value.trim();
  if(!txt){alert('Bitte JSON-Text einfügen.');return;}
  loadJSONData(txt);
}
function loadJSONData(txt){
  try{
    let d=JSON.parse(txt);
    if(!d.events&&!d.categories){alert('Kein gültiges Backup.');return;}
    let merge=confirm(`Backup mit ${d.events?.length||0} Terminen, ${d.categories?.length||0} Kategorien.\n\nOK = ZUSAMMENFÜHREN (empfohlen: nur neue Einträge werden ergänzt)\nAbbrechen = komplett ERSETZEN`);
    if(merge){
      saveRestorePoint('JSON-Backup zusammengeführt'); // persistent (V1.6)
      pushUndo('JSON-Backup zusammengeführt');
      let addedE=0,addedC=0;
      (d.categories||[]).forEach(c=>{
        if(!DB.categories.find(x=>x.id===c.id||x.name===c.name)){DB.categories.push(c);addedC++;}
      });
      (d.events||[]).forEach(ev=>{
        let dup=DB.events.find(x=>x.id===ev.id||(x.title===ev.title&&x.date===ev.date&&(x.time||'')===(ev.time||'')));
        if(!dup){DB.events.push(ev);addedE++;}
      });
      // V0.3: Vorlagen, Grundpläne und Ferien ergänzen
      ensureDBShape();
      (d.templates||[]).forEach(t=>{if(!DB.templates.find(x=>x.id===t.id))DB.templates.push(t);});
      (d.plans||[]).forEach(p=>{if(!DB.plans.find(x=>x.id===p.id))DB.plans.push(p);});
      (d.ferien||[]).forEach(f=>{if(!DB.ferien.find(x=>x.name===f.name&&x.from===f.from))DB.ferien.push(f);});
      saveDB();render();closeModal();
      showToast(`💾 Zusammengeführt: ${addedE} Termine und ${addedC} Kategorien ergänzt`,true);
    }else{
      if(!confirm('Wirklich ALLE aktuellen Daten ersetzen?\n(Über „Rückgängig" bzw. den Sicherungspunkt in der Wartung wiederherstellbar.)'))return;
      saveRestorePoint('JSON-Backup geladen (ersetzt)'); // persistent (V1.6)
      pushUndo('JSON-Backup geladen (ersetzt)');
      DB={categories:d.categories||DB.categories,events:d.events||[],templates:d.templates||[],plans:d.plans||[],ferien:Array.isArray(d.ferien)?d.ferien:undefined};ensureDBShape();
      saveDB();render();closeModal();
      showToast('💾 Backup geladen (Daten ersetzt)',true);
    }
  }catch(ex){alert('Fehler beim Laden: '+ex.message);}
}

/* ===== birthday.dat (Ewiger Kalender) direkt importieren ===== */
function importBirthdayDat(input){
  let file=input.files[0];if(!file)return;
  let reader=new FileReader();
  reader.onload=e=>parseBirthdayDat(e.target.result);
  reader.onerror=()=>alert('Datei konnte nicht gelesen werden.');
  reader.readAsText(file);
}
function importBirthdayDatText(){
  let txt=document.getElementById('bdayImportBox')?.value.trim();
  if(!txt){alert('Bitte birthday.dat-Inhalt einfügen.');return;}
  parseBirthdayDat(txt);
}
function parseBirthdayDat(text){
  /* V3.0 (Fix): (a) Ungültige Kalenderdaten wie 31.02. wurden bisher als
     „1980-02-31" gespeichert und erschienen dann am 2./3. März; jetzt werden
     sie wie andere fehlerhafte Zeilen übersprungen. (b) Sicherungspunkt und
     Undo-Schritt entstehen nur noch, wenn tatsächlich etwas importiert wird
     (vorher belegte auch ein Import ohne Treffer einen Rückgängig-Schritt). */
  let snapshot=JSON.parse(JSON.stringify(DB)),undoSnap=JSON.stringify(DB);
  let imported=0,skipped=0;
  text.split('|').forEach(entry=>{
    entry=entry.trim();
    if(!entry)return;
    let f=entry.split(';');
    if(f.length<4)return;
    let name=f[0].trim();
    let y=parseInt(f[1]),m=parseInt(f[2]),d=parseInt(f[3]);
    if(!name||isNaN(y)||isNaN(m)||isNaN(d)||m<1||m>12||d<1||d>31){skipped++;return;}
    let dateStr=fmtDate(y,m-1,d);
    let chk=new Date(y,m-1,d);
    if(chk.getMonth()!==m-1||chk.getDate()!==d){skipped++;return;} // V3.0: 31.02. u.ä.
    if(DB.events.find(e=>e.title===name&&e.date===dateStr)){skipped++;return;}
    DB.events.push({
      id:'bday_'+Date.now()+'_'+Math.random().toString(36).substr(2,5),
      categoryId:'geburtstag',title:name,notes:'Import aus birthday.dat',
      date:dateStr,time:'',repeat:'yearly',reminder:1,displayType:'termin',exdates:[]
    });
    imported++;
  });
  if(imported){
    saveRestorePoint('birthday.dat-Import',snapshot); // Stand VOR dem Import (persistent, V1.6)
    undoStack.push({label:'birthday.dat-Import',snap:undoSnap});
    if(undoStack.length>UNDO_MAX)undoStack.shift();
    undoLockedReason='';updateUndoBtn();
  }
  saveDB();render();
  alert(`${imported} Geburtstage importiert`+(skipped?`, ${skipped} übersprungen (ungültig/bereits vorhanden)`:'')+'.');
  if(imported)showToast(`🎂 ${imported} Geburtstage importiert`,true);
}

/* ===== MAUSRAD-NAVIGATION (V1.9 Monat, V2.1 Jahr, V2.3 Woche + Tag) =====
   Scrollen über der jeweiligen Ansicht blättert vor/zurück (Monat/Jahr/
   Woche/Tag). Die Terminliste unter der Monatsansicht scrollt weiterhin
   normal. Eine kurze Sperre (250 ms) verhindert, dass ein Rad-Schwung
   mehrere Schritte überspringt. In Wochen-/Tagesansicht gilt: kann ein
   Bereich unter dem Mauszeiger selbst noch in Rad-Richtung scrollen
   (lange Terminlisten), wird normal gescrollt statt geblättert –
   geblättert wird erst am Anschlag. */
(function(){
  let lastWheelNav=0;
  document.getElementById('content').addEventListener('wheel',e=>{
    let grid=null;
    if(state.view==='monat')grid=document.getElementById('calGrid');

/* ===== SWIPE-NAVIGATION (Touch) ===== */
(function(){
  let sx=0,sy=0,st=0;
  let area=document.getElementById('content');
  area.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    let x=e.touches[0].clientX;
    // Randzone (≈30px) gehört der Zurück-/Vor-Geste des Browsers –
    // dort startende Wischer NICHT als Kalender-Navigation werten (V1.6)
    if(x<30||x>window.innerWidth-30){st=0;return;}
    sx=x;sy=e.touches[0].clientY;st=Date.now();
  },{passive:true});
  area.addEventListener('touchend',e=>{
    if(!st)return;
    let dx=e.changedTouches[0].clientX-sx;
    let dy=e.changedTouches[0].clientY-sy;
    let dt=Date.now()-st;st=0;
    // Nur schnelle, klar horizontale Wischer (kein Konflikt mit Scrollen)
    if(dt<600&&Math.abs(dx)>60&&Math.abs(dx)>2*Math.abs(dy)){
      if(dx<0)navNext();else navPrev();
    }
  },{passive:true});
})();

/* ===== ZURÜCK-GESTE/-TASTE ABFANGEN (V1.6) =====
   Problem: Wischen nach links/rechts löst im Browser "Zurück" aus und wirft
   aus der (dauerhaft offenen!) Kalenderseite. Doppelter Schutz:
   1) CSS overscroll-behavior:none (verhindert die Wisch-Navigation in
      Chrome/Edge/Firefox direkt)
   2) History-Fänger: geht der Browser trotzdem "zurück", legen wir sofort
      wieder einen Eintrag nach – die Seite bleibt offen. Die Geste bekommt
      dabei eine sinnvolle Aufgabe: ein offener Dialog wird geschlossen. */
(function(){
  try{
    history.pushState({ecpro:1},'');
    window.addEventListener('popstate',()=>{
      history.pushState({ecpro:1},'');
      let ov=document.getElementById('overlay');
      if(ov&&ov.classList.contains('show'))closeModal();
      else showToast('⛔ Zurück-Geste abgefangen – der Kalender bleibt offen (Tab schließen: ✕ des Browsers)',false);
    });
  }catch(e){}
})();

/* Mehrseitiges PDF aus JPEG-Bildern (nach timetable, je Bild eine A4-Seite) */
function jpegPdfMulti(pages,title){
  let parts=[],len=0,offs=[];
  let latin=s=>{let b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i)&255;return b;};
  let add=x=>{let b=typeof x==='string'?latin(x):x;parts.push(b);len+=b.length;};
  let obj=(n,str)=>{offs[n]=len;add(n+' 0 obj\n'+str+'\nendobj\n');};
  let t=String(title).replace(/[^\x20-\x7E\xA0-\xFF]/g,'').replace(/([()\\])/g,'\\$1');
  let N=pages.length,info=3+3*N;
  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids ['+pages.map((p,i)=>(3+3*i)+' 0 R').join(' ')+'] /Count '+N+' >>');
  pages.forEach((p,i)=>{
    let pn=3+3*i,im=pn+1,cn=pn+2,land=p.w>=p.h,PW=land?842:595,PH=land?595:842,M=24;
    let sc=Math.min((PW-2*M)/p.w,(PH-2*M)/p.h),dw=p.w*sc,dh=p.h*sc,X=(PW-dw)/2,Y=PH-M-dh;
    let content='q '+dw.toFixed(2)+' 0 0 '+dh.toFixed(2)+' '+X.toFixed(2)+' '+Y.toFixed(2)+' cm /Im1 Do Q';
    obj(pn,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /XObject << /Im1 '+im+' 0 R >> >> /Contents '+cn+' 0 R >>');
    offs[im]=len;add(im+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.bytes.length+' >>\nstream\n');add(p.bytes);add('\nendstream\nendobj\n');
    obj(cn,'<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream');
  });
  obj(info,'<< /Title ('+t+') /Producer (Timeless) >>');
  let xr=len,x='xref\n0 '+(info+1)+'\n0000000000 65535 f \n';
  for(let i=1;i<=info;i++)x+=('0000000000'+offs[i]).slice(-10)+' 00000 n \n';
  add(x+'trailer\n<< /Size '+(info+1)+' /Root 1 0 R /Info '+info+' 0 R >>\nstartxref\n'+xr+'\n%%EOF\n');
  return new Blob(parts,{type:'application/pdf'});
}

function collectDays(from,to,opt){

function cvColors(c){
  if(!/^#[0-9a-fA-F]{6}$/.test(c||''))c='#2980b9';
  return relLum(c)>0.55?{bg:c,bd:shade(c,-0.38)}:{bg:shade(c,0.8),bd:c};
}
function cvRound(x,X,Y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function cvFit(x,t,w){t=String(t);if(x.measureText(t).width<=w)return t;while(t.length>1&&x.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…';}
function weekCanvas(monDs,scale){
  scale=scale||2;
  let days=[];for(let i=0;i<7;i++)days.push(tgDayStr(tgDayNum(monDs)+i));
  let F='"Segoe UI",system-ui,Arial,sans-serif',H=heatCfg();
  let h0=Math.floor(toMin(H.from)/60),h1=Math.ceil(toMin(H.to)/60),cols=[],maxAd=0;
  days.forEach(ds=>{
    let[y,m,d]=ds.split('-').map(Number),items=[],ad=[];
    getEventsForDay(y,m-1,d).forEach(ev=>{
      let c=ev.color||getCat(ev.categoryId).color,t=displayTitle(ev,y,m-1,d);
      if(!ev.time){ad.push({t,c});return;}
      tgWindows(ev,y,m-1,d).forEach(([a,b])=>{items.push({s:a,e:b,t,c,ev});h0=Math.min(h0,Math.floor(a/60));h1=Math.max(h1,Math.ceil(b/60));});
    });
    tgLayout(items);maxAd=Math.max(maxAd,ad.length);
    cols.push({ds,y,m,d,items,ad});
  });
  h1=Math.min(24,Math.max(h1,h0+1));
  let W=1600,P=34,gut=58,colW=(W-2*P-gut)/7,ph=54,titleH=58,headH=58,adH=maxAd?maxAd*24+8:0;
  let Hh=P*2+titleH+headH+adH+(h1-h0)*ph;
  let cv=document.createElement('canvas');cv.width=W*scale;cv.height=Hh*scale;
  let x=cv.getContext('2d');x.scale(scale,scale);
  x.fillStyle='#ffffff';x.fillRect(0,0,W,Hh);
  let mon=parseDate(monDs),sun=parseDate(days[6]);
  x.fillStyle='#141b2b';x.font='600 26px Georgia,"Palatino Linotype",serif';x.textBaseline='alphabetic';
  x.fillText(`${LANG==='en'?'Week':'KW'} ${getISOWeek(mon)} · ${mon.getDate()}.${mon.getMonth()+1}. – ${sun.getDate()}.${sun.getMonth()+1}.${sun.getFullYear()}`,P,P+28);
  x.font='13px '+F;x.fillStyle='#8690a2';x.textAlign='right';x.fillText('Timeless',W-P,P+26);x.textAlign='left';
  let top=P+titleH,gTop=top+headH+adH;
  cols.forEach((c,i)=>{
    let X0=P+gut+i*colW,dt=new Date(c.y,c.m-1,c.d),we=dt.getDay()===0||dt.getDay()===6;
    let hol=SETTINGS.showHol!==false?getHolidays(c.y)[`${c.m}-${c.d}`]:'',fer=SETTINGS.showFerien!==false?ferienOn(c.ds):null; // V0.5.1
    if(we||fer){x.fillStyle=fer?'#f3f8f6':'#f7f8fb';x.fillRect(X0,gTop,colW,(h1-h0)*ph);}
    x.fillStyle=we||hol?'#b3261e':'#566074';x.font='600 12px '+F;x.textAlign='center';
    x.fillText(dNames[dt.getDay()].toUpperCase(),X0+colW/2,top+16);
    x.fillStyle='#141b2b';x.font='600 22px '+F;x.fillText(String(c.d),X0+colW/2,top+40);
    let lbl=[tr(hol),fer&&tr(fer.name)].filter(Boolean).join(' · ');
    if(lbl){x.fillStyle='#c2570c';x.font='11px '+F;x.fillText(cvFit(x,lbl,colW-8),X0+colW/2,top+54);}
    x.textAlign='left';
    c.ad.forEach((a,k)=>{let cc=cvColors(a.c);cvRound(x,X0+3,top+headH+4+k*24,colW-6,20,5);x.fillStyle=cc.bg;x.fill();x.fillStyle=cc.bd;x.fillRect(X0+3,top+headH+4+k*24,3,20);x.fillStyle='#141b2b';x.font='600 12px '+F;x.fillText(cvFit(x,a.t,colW-18),X0+11,top+headH+18+k*24);});
  });
  x.strokeStyle='#e4e8f0';x.lineWidth=1;
  for(let h=h0;h<=h1;h++){let Y=gTop+(h-h0)*ph+.5;x.beginPath();x.moveTo(P+gut,Y);x.lineTo(W-P,Y);x.stroke();if(h<h1){x.fillStyle='#8690a2';x.font='11px '+F;x.textAlign='right';x.fillText(String(h).padStart(2,'0')+':00',P+gut-8,Y+4);x.textAlign='left';}}
  for(let i=0;i<=7;i++){let X0=P+gut+i*colW+.5;x.beginPath();x.moveTo(X0,top);x.lineTo(X0,gTop+(h1-h0)*ph);x.stroke();}
  x.beginPath();x.moveTo(P+gut,top+headH+.5);x.lineTo(W-P,top+headH+.5);x.stroke();
  cols.forEach((c,i)=>{
    let X0=P+gut+i*colW;

      let w=(colW-6)/it.n,bx=X0+3+it.col*w,by=gTop+(it.s/60-h0)*ph+1,bh=Math.max((it.e-it.s)/60*ph-2,16),cc=cvColors(it.c);

      x.fillStyle='#141b2b';x.font='600 13px '+F;x.fillText(cvFit(x,it.t,w-14),bx+9,by+16);
      if(bh>=34){x.fillStyle='#3d4659';x.font='11.5px '+F;x.fillText(cvFit(x,`${tgHM(it.s)}–${it.e>=1440?'24:00':tgHM(it.e)}`,w-14),bx+9,by+31);}
      x.restore();
    });
  });
  return cv;
}

/* ----- Speichern: Dateidialog (Chrome/Edge) oder Download ----- */
function saveBlobAs(name,mime,ext,make,out){
  let msg=t=>{if(out)out.textContent=t;};
  let viaLink=b=>{try{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);msg('Gespeichert als '+name+' (Download-Ordner).');}catch(e){msg('Speichern ist fehlgeschlagen.');}};
  let canPick=typeof window.showSaveFilePicker==='function'&&(function(){try{return window.self===window.top;}catch(e){return false;}})();
  if(!canPick){Promise.resolve().then(make).then(viaLink,e=>msg('Die Datei ließ sich nicht erzeugen: '+(e&&e.message||e)));return;}
  let acc={};acc[mime]=['.'+ext];
  window.showSaveFilePicker({id:'timeless-export',suggestedName:name,types:[{description:ext.toUpperCase(),accept:acc}]}).then(h=>{
    msg('Wird gespeichert …');
    return Promise.resolve().then(make).then(b=>h.createWritable().then(w=>w.write(b).then(()=>w.close()))).then(()=>msg('Gespeichert: '+h.name),()=>msg('Speichern ist fehlgeschlagen.'));
  },e=>{if(e&&e.name==='AbortError')return;Promise.resolve().then(make).then(viaLink);});
}

function secToggle(id){
  let c=SETTINGS.collapsed=Array.isArray(SETTINGS.collapsed)?SETTINGS.collapsed:[];
  let i=c.indexOf(id);if(i>=0)c.splice(i,1);else c.push(id);saveSettings();secApply();
}
function secApply(){
  let c=Array.isArray(SETTINGS.collapsed)?SETTINGS.collapsed:[];
  ['tplBox','planBox','layerBox','dataBox','upcomingList'].forEach(id=>{let el=document.getElementById(id);if(el)el.classList.toggle('collapsed',c.includes(id));});

/* ===== V1.0: ALS APP INSTALLIERBAR (nur über https, z.B. GitHub Pages) =====
   Manifest und Offline-Speicher (sw.js) liegen als Begleitdateien neben der
   HTML-Datei. Als lokale Datei (file://) wird nichts davon angefordert –
   die Datei bleibt dort vollständig eigenständig. */
let installPrompt=null;
(function(){
  let secure=location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  if(!secure||location.protocol==='file:')return;
  let add=(rel,href)=>{let l=document.createElement('link');l.rel=rel;l.href=href;document.head.appendChild(l);};
  add('manifest','manifest.webmanifest');add('apple-touch-icon','apple-touch-icon.png');
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});
  window.addEventListener('appinstalled',()=>{installPrompt=null;showToast(tr('📲 Timeless ist jetzt als App installiert'),false);});
})();
function isStandalone(){try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){return false;}}
function installApp(){
  if(installPrompt){installPrompt.prompt();installPrompt.userChoice.finally(()=>{installPrompt=null;closeModal();});return;}
  alert(location.protocol==='file:'
    ?'Installieren geht nur, wenn Timeless über https geöffnet wird – z.B. über die GitHub-Seite. Als lokale Datei läuft Timeless wie bisher im Browser.'
    :'Im Browser-Menü „App installieren" bzw. „Zum Startbildschirm hinzufügen" wählen (iPhone/iPad: Teilen → Zum Home-Bildschirm).');
}

/* ===== V1.1: BESCHRIFTUNG MITNEHMEN, MEHRTAGES-AUFZIEHEN, × LÖSCHEN ===== */
/* (1) Lange Blöcke: Titel/Zeit wandern mit, solange der Block sichtbar ist */
function tgStick(body){
  if(!body)return;
  let st=body.scrollTop;
  body.querySelectorAll('.tg-ev:not(.ghost)').forEach(el=>{
    let top=el.offsetTop,h=el.offsetHeight,lab=el.querySelector('.n');
    let lh=lab?(lab.offsetHeight+(el.querySelector('.t')||{offsetHeight:0}).offsetHeight):0;
    let y=Math.max(0,Math.min(st-top+2,h-lh-8));
    if(y>0)el.style.setProperty('--sy',y+'px');else el.style.removeProperty('--sy');
  });
}
document.addEventListener('scroll',e=>{
  let b=e.target;if(!b||!b.classList||!b.classList.contains('tg-body'))return;
  if(b._stickRaf)return;b._stickRaf=requestAnimationFrame(()=>{b._stickRaf=0;tgStick(b);});
},true);
/* (6) × an Terminen */
function evX(e,id,ds){
  e.preventDefault();e.stopPropagation();
  if(Date.now()-tgJustDragged<350)return;
  if(String(id).startsWith('pl:')){
    let v=plParse(id),mon=plWeekOf(v.ds);
    if(plLocked(mon)){showToast('🔒 Vergangene Woche – erst „Diese Woche von Hand ändern" wählen',false);return;}
    let p=plById(v.pid),eff=p&&plWeekSlots(p,mon).find(x=>x.id===v.sid);
    plItemDelete(id,plScopeFor(mon,eff));return;
  }
  let ev=DB.events.find(x=>x.id===id);if(!ev)return;
  if(ev.repeat&&ev.repeat!=='none')deleteInstance(id,ds);else deleteEvent(id);
}
/* (2)/(3) Neuer Termin an mehreren Tagen: Liste der zusätzlichen Tage,
   wird beim Speichern eines NEUEN Termins ausgewertet (ein Rückgängig) */
let tgMultiDays=[];
function openMultiNew(days,t0,t1){
  days=[...new Set(days)].sort();
  openEventModal(null,days[0]);
  if(t0!==undefined&&t0!==null){formData.time=tgHM(t0);formData.timeEnd=tgHM(Math.min(t1,1439));}
  renderEventTab(0);
  tgMultiDays=days.slice(1);
  if(tgMultiDays.length){
    let lst=days.map(x=>`${dNames[plDow(x)]} ${fmtDisp(x)}`).join(', ');
    document.getElementById('modalTitle').textContent=`Neuer Termin – an ${days.length} Tagen`;
    let b=document.getElementById('modalBody'),n=document.createElement('div');
    n.className='multi-note';n.textContent=`Wird angelegt am: ${lst}`;b.insertBefore(n,b.firstChild);
  }
  let t=document.getElementById('fTitle');if(t)t.focus();
}
/* Monat: in einer freien Stelle drücken und über weitere Tage ziehen */
let mSel=null;
document.addEventListener('pointerdown',e=>{
  if(e.button!==0||e.pointerType==='touch'||state.view!=='monat')return;
  let td=e.target.closest&&e.target.closest('#calGrid td[data-ds]');
  if(!td||e.target.closest('.ev-chip'))return;
  mSel={a:td.dataset.ds,b:td.dataset.ds,active:false,x0:e.clientX,y0:e.clientY};
});
document.addEventListener('pointermove',e=>{
  if(!mSel)return;
  if(!mSel.active){if(Math.hypot(e.clientX-mSel.x0,e.clientY-mSel.y0)<6)return;mSel.active=true;document.body.classList.add('tg-dragging');}
  let el=document.elementFromPoint(e.clientX,e.clientY),td=el&&el.closest&&el.closest('#calGrid td[data-ds]');
  if(td)mSel.b=td.dataset.ds;
  let lo=mSel.a<mSel.b?mSel.a:mSel.b,hi=mSel.a<mSel.b?mSel.b:mSel.a;
  document.querySelectorAll('#calGrid td[data-ds]').forEach(c=>c.classList.toggle('msel',c.dataset.ds>=lo&&c.dataset.ds<=hi));
});
document.addEventListener('pointerup',()=>{
  let m=mSel;mSel=null;if(!m)return;
  document.body.classList.remove('tg-dragging');
  document.querySelectorAll('#calGrid td.msel').forEach(c=>c.classList.remove('msel'));
  if(!m.active||m.a===m.b)return;
  tgJustDragged=Date.now();
  let lo=m.a<m.b?m.a:m.b,hi=m.a<m.b?m.b:m.a,days=[];
  for(let n=tgDayNum(lo);n<=tgDayNum(hi)&&days.length<62;n++)days.push(tgDayStr(n));
  openMultiNew(days,null,null);
});

/* ===== V1.0.1: .ICS-DATEIEN MIT TIMELESS ÖFFNEN =====
   (1) Installierte App: Das Betriebssystem übergibt die Datei über
       window.launchQueue (File Handling API, Chrome/Edge ab Version 102).
   (2) Überall: Datei ins Fenster ziehen. Termin-Ziehen im Monat bleibt
       unberührt, weil dabei keine Dateien übertragen werden. */
function openDroppedFiles(files){
  let ics=[],json=null;
  return Promise.all([...files].map(f=>f.text().then(t=>{
    if(/BEGIN:VCALENDAR/i.test(t))ics.push(t);
    else if(/\.json$/i.test(f.name)||/^\s*\{/.test(t))json=t;
  }))).then(()=>{
    if(ics.length){
      // mehrere Kalender zu einem zusammenfassen
      let merged=ics.length===1?ics[0]:'BEGIN:VCALENDAR\r\n'+ics.map(t=>(t.match(/BEGIN:VEVENT[\s\S]*?END:VEVENT/gi)||[]).join('\r\n')).join('\r\n')+'\r\nEND:VCALENDAR';
      parseAndImportICS(merged);
    }else if(json)loadJSONData(json);
    else showToast(tr('⚠️ Keine Kalenderdatei erkannt (.ics oder JSON-Sicherung)'),false);
  });
}
if('launchQueue' in window&&window.launchQueue&&typeof window.launchQueue.setConsumer==='function'){
  window.launchQueue.setConsumer(params=>{
    if(!params||!params.files||!params.files.length)return;
    Promise.all(params.files.map(h=>h.getFile())).then(openDroppedFiles).catch(()=>alert('Datei konnte nicht gelesen werden.'));
  });
}
document.addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();e.dataTransfer.dropEffect='copy';document.body.classList.add('file-over');}});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('file-over');});
document.addEventListener('drop',e=>{
  document.body.classList.remove('file-over');
  if(!e.dataTransfer||!e.dataTransfer.files||!e.dataTransfer.files.length)return;
  e.preventDefault();e.stopPropagation();
  openDroppedFiles(e.dataTransfer.files);
},true);

    let v=el.nodeValue;if(!/[A-Za-zÄÖÜäöüß]/.test(v))return;
    let t=tr(v);if(t!==v)el.nodeValue=t;return;
  }
  if(el.nodeType!==1||el.matches('script,style,[data-noi18n]'))return;
  I18N_ATTR.forEach(a=>{let v=el.getAttribute(a);if(v){let t=tr(v);if(t!==v)el.setAttribute(a,t);}});
  let w=document.createTreeWalker(el,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT),n;
  while((n=w.nextNode())){
    if(n.nodeType===3)i18nEl(n);
    else{if(n.matches('script,style,[data-noi18n]'))continue;I18N_ATTR.forEach(a=>{let v=n.getAttribute(a);if(v){let t=tr(v);if(t!==v)n.setAttribute(a,t);}});}
  }
}
let i18nObs=null;
function i18nInit(){
  let pref=SETTINGS.lang;
  if(pref!=='de'&&pref!=='en'){let nl=(navigator.languages&&navigator.languages[0])||navigator.language||'de';pref=/^de/i.test(nl)?'de':'en';}
  LANG=pref;
  document.documentElement.lang=LANG;
  if(LANG!=='en')return;
  mNames.splice(0,12,...EN_M);dNames.splice(0,7,...EN_D);dNamesLong.splice(0,7,...EN_DL);
  TLX.XHEAD.splice(0,TLX.XHEAD.length,'Start','End','Duration','Title','Category','Note');
  TLX.SHEAD.splice(0,TLX.SHEAD.length,'Date','Weekday','Start','End','Duration (min)','Title','Category','Note');
  const _al=window.alert,_cf=window.confirm,_pr=window.prompt;
  window.alert=m=>_al.call(window,trMsg(m));
  window.confirm=m=>_cf.call(window,trMsg(m));
  window.prompt=(m,d)=>_pr.call(window,trMsg(m),d);
  i18nEl(document.body);
  i18nObs=new MutationObserver(muts=>{
    muts.forEach(mu=>{
      if(mu.type==='childList')mu.addedNodes.forEach(i18nEl);
      else if(mu.type==='characterData')i18nEl(mu.target);
      else if(mu.type==='attributes'){let v=mu.target.getAttribute(mu.attributeName);if(v){let t=tr(v);if(t!==v)mu.target.setAttribute(mu.attributeName,t);}}
    });
    i18nObs.takeRecords(); // eigene Änderungen nicht noch einmal bearbeiten
  });
  i18nObs.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:I18N_ATTR});
}
