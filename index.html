/* ===== V1.0: SERIEN IM ZEITRASTER GANZ VERSCHIEBEN =====
   Beim Ziehen eines Serien-Vorkommens wird gefragt: nur dieses Vorkommen,
   dieses und alle folgenden (Serie wird geteilt) oder die ganze Serie.
   Verschoben wird um dieselbe Zeitspanne wie das gezogene Vorkommen; Tage
   verschieben Beginn, Ausnahmen und Wochentagsauswahl mit. */
function tgSeriesAsk(id,fromDs,delta){
  let ev=DB.events.find(e=>e.id===id);if(!ev)return;
  let dd=Math.floor((toMin(ev.time)+delta)/1440),nt=((toMin(ev.time)+delta)%1440+1440)%1440;
  let what=`${dd?`${dd>0?'+':''}${dd} Tag${Math.abs(dd)===1?'':'e'}`:''}${dd&&nt!==toMin(ev.time)?', ':''}${nt!==toMin(ev.time)?`Beginn ${tgHM(nt)}`:''}`;
  let first=fromDs===ev.date,canFollow=!first&&!ev.repeatCount;
  editingId=null;openOverlay();
  document.getElementById('modalTabs').style.display='none';
  document.getElementById('modalTitle').textContent='🔁 Serientermin verschieben';
  document.getElementById('modalBody').innerHTML=`<p style="font-size:14px;margin-bottom:6px"><b>${escHtml(ev.title)}</b></p>
    <p style="font-size:13px;color:var(--text2);margin-bottom:12px">Gezogen: Vorkommen vom ${fmtDisp(fromDs)} → ${escHtml(what)}. Was soll sich ändern?</p>
    <div class="ser-choice">
      <button onclick="tgSeriesApply('${id}','${fromDs}',${delta},'one');closeModal()"><b>Nur dieses Vorkommen</b><span>Wird zum Einzeltermin, die Serie bleibt wie sie ist.</span></button>
      ${canFollow?`<button onclick="tgSeriesApply('${id}','${fromDs}',${delta},'follow');closeModal()"><b>Dieses und alle folgenden</b><span>Die Serie wird am ${fmtDisp(fromDs)} geteilt; frühere Termine bleiben.</span></button>`:''}
      <button onclick="tgSeriesApply('${id}','${fromDs}',${delta},'all');closeModal()"><b>Die ganze Serie</b><span>Alle Vorkommen${first?'':' – auch die vergangenen –'} rücken mit.</span></button>
    </div>`;
  document.getElementById('modalFooter').innerHTML=`<div style="flex:1"></div><button class="btn-cancel" onclick="closeModal()">Abbrechen</button>`;
}
/* ganze Serie (bzw. Teilserie) um delta Minuten versetzen */
function tgSeriesShift(ev,delta){
  let t0=toMin(ev.time),dd=Math.floor((t0+delta)/1440),md=((t0+delta)%1440+1440)%1440-t0;
  ev.time=tgHM(t0+md);
  if(ev.timeEnd)ev.timeEnd=tgHM(((toMin(ev.timeEnd)+md)%1440+1440)%1440);
  if(dd){
    let sh=ds=>ds?tgDayStr(tgDayNum(ds)+dd):ds;
    ev.date=sh(ev.date);
    if(ev.dateEnd)ev.dateEnd=sh(ev.dateEnd);
    ev.exdates=(ev.exdates||[]).map(sh);
    let r=((dd%7)+7)%7;
    if(r&&ev.wdMask&&ev.wdMask.length===7&&ev.wdMask!=='1111111'){let o=ev.wdMask;ev.wdMask=[0,1,2,3,4,5,6].map(i=>o[(i-r+7)%7]).join('');}
    if(r&&ev.repeat==='wochentag'&&ev.repeatWd!==undefined)ev.repeatWd=String((parseInt(ev.repeatWd)+r)%7);
  }
}
function tgSeriesApply(id,fromDs,delta,mode){
  let ev=DB.events.find(e=>e.id===id);if(!ev||!tgIsSerie(ev))return null;
  let res;
  if(mode==='one'){
    pushUndo(`Vorkommen verschoben: ${ev.title}`);
    res=JSON.parse(JSON.stringify(ev));
    Object.assign(res,{id:tgNewId(),date:fromDs,dateEnd:'',repeat:'none',repeatUntil:'',repeatCount:'',exdates:[]});
    delete res.importUid;delete res.hidden;delete res.deathDate;
    ev.exdates=ev.exdates||[];if(!ev.exdates.includes(fromDs))ev.exdates.push(fromDs);
    res.notes=(ev.notes?ev.notes+'\n':'')+`(verschoben von ${fmtDisp(fromDs)})`;
    tgShift(res,delta);DB.events.push(res);
  }else if(mode==='follow'&&fromDs>ev.date&&!ev.repeatCount){
    pushUndo(`Serie ab ${fmtDisp(fromDs)} verschoben: ${ev.title}`);
    res=JSON.parse(JSON.stringify(ev));
    res.id=tgNewId();delete res.importUid;res.date=fromDs;
    res.exdates=(ev.exdates||[]).filter(x=>x>=fromDs);
    ev.exdates=(ev.exdates||[]).filter(x=>x<fromDs);
    ev.repeatUntil=tgDayStr(tgDayNum(fromDs)-1);
    tgSeriesShift(res,delta);DB.events.push(res);
  }else{
    pushUndo(`Ganze Serie verschoben: ${ev.title}`);
    tgSeriesShift(ev,delta);res=ev;
  }
  saveDB();render();
  let lbl=mode==='one'?'Vorkommen':mode==='follow'?'Serie ab '+fmtDisp(fromDs):'Ganze Serie';
  showToast(`↔ ${lbl}: ${res.title} → ${mode==='one'?fmtDisp(res.date)+' ':''}${res.time}${res.timeEnd?'–'+res.timeEnd:''}${conflictSuffix(res)}`,true);
  if(mode==='one')tgOfferPush(res);
  return res;
}

/* ===== V1.0: DRUCKANSICHT (Strg+P) =====
   Vor dem Drucken: helle Farben, Woche/Tag mit einer Stundenhöhe, bei der
   die belegten Stunden (mindestens die Arbeitszeit) auf eine A4-Seite quer
   passen; danach wird die Bildschirmansicht wiederhergestellt. */
let printState=null;
function printPrep(){
  if(printState)return;
  printState={dark:document.body.classList.contains('dark'),hh:document.documentElement.style.getPropertyValue('--hh')};
  document.body.classList.remove('dark');
  document.body.classList.add('printing');
  let c=document.getElementById('content'),lbl=(document.getElementById('curLabel')||{}).textContent||'';
  c.dataset.print=`${lbl}   ·   Timeless`;
  if(state.view==='woche'||state.view==='tag'){
    let dates=[];
    if(state.view==='tag')dates=[new Date(state.year,state.month,state.day)];
    else{let ws=weekStart(state.year,state.month,state.day);for(let i=0;i<7;i++){let x=new Date(ws);x.setDate(ws.getDate()+i);dates.push(x);}}
    let H=heatCfg(),a=Math.floor(toMin(H.from)/60),b=Math.ceil(toMin(H.to)/60),ad=0;
    dates.forEach(dt=>{
      let evs=getEventsForDay(dt.getFullYear(),dt.getMonth(),dt.getDate());
      ad=Math.max(ad,evs.filter(e=>!e.time).length);
      evs.filter(e=>e.time).forEach(ev=>tgWindows(ev,dt.getFullYear(),dt.getMonth(),dt.getDate()).forEach(([s0,e0])=>{a=Math.min(a,Math.floor(s0/60));b=Math.max(b,Math.ceil(e0/60));}));
    });
    b=Math.min(24,Math.max(b,a+1));
    let avail=700-34-(state.view==='woche'?44:40)-(ad?ad*22+8:28)-(state.view==='tag'?40:0);
    let hh=Math.max(14,Math.min(46,Math.floor(avail/(b-a))));
    document.documentElement.style.setProperty('--hh',hh+'px');
    printState.range=[a,b];
    render();
    document.querySelectorAll('.tg').forEach(t=>{t.style.setProperty('--ps',a);t.style.setProperty('--pe',b);});
  }else if(state.view==='monat'){
    let rows=document.querySelectorAll('#calGrid tbody tr').length||6;
    c.style.setProperty('--mrow',Math.floor((700-34-60)/rows)+'px');
  }
}
function printDone(){
  if(!printState)return;
  let p=printState;printState=null;
  document.body.classList.toggle('dark',p.dark);
  document.body.classList.remove('printing');
  if(p.hh)document.documentElement.style.setProperty('--hh',p.hh);else document.documentElement.style.removeProperty('--hh');
  if(p.range)render();
}
window.addEventListener('beforeprint',printPrep);
window.addEventListener('afterprint',printDone);
try{let mq=window.matchMedia('print');(mq.addEventListener?mq.addEventListener.bind(mq,'change'):mq.addListener.bind(mq))(e=>{if(e.matches)printPrep();else printDone();});}catch(e){}
function doPrint(){closeModal();setTimeout(()=>window.print(),120);}

/* ===== V1.0: ICS FÜR EINEN ZEITRAUM (Export-Dialog) =====
   Alle sichtbaren Termine, die im Zeitraum vorkommen (Serien als Serie),
   dazu Grundplan-Einträge des Zeitraums als Einzeltermine. */
function buildICSRange(from,to){
  let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Timeless//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  let seen=new Set(),n=0;
  for(let k=tgDayNum(from);k<=tgDayNum(to);k++){
    let ds=tgDayStr(k),[y,m,d]=ds.split('-').map(Number);
    getEventsForDay(y,m-1,d).forEach(ev=>{
      if(ev._plan){lines.push(...buildVEVENT(Object.assign({},ev,{id:'tl-'+ev._plan+'-'+ev._slot+'-'+ds.replace(/-/g,'')})));n++;return;}
      if(seen.has(ev.id))return;seen.add(ev.id);lines.push(...buildVEVENT(ev));n++;
    });
  }
  lines.push('END:VCALENDAR');
  return{text:lines.join('\r\n'),n};
}

/* ===== V0.6: HINWEISE MIT FARBWELLE UND GLOCKENKLANG =====
   Vorbild: Benachrichtigung der Claude-App am Tablet. Alle 15 s wird geprüft,
   ob ein Termin (heute/morgen, mit Uhrzeit, mit Hinweis) fällig ist. Fällig
   = ab „Beginn minus Vorlauf" bis 10 Minuten nach Beginn (falls das Gerät
   kurz geschlafen hat). Jeder Hinweis kommt genau einmal (Merkliste im
   Browser), „5 Min. später" schiebt ihn auf. */
let audioCtx=null;
function audioUnlock(){
  try{
    if(!audioCtx){let AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=new AC();}
    if(audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){}
}
document.addEventListener('pointerdown',audioUnlock,{passive:true});
document.addEventListener('keydown',audioUnlock);
/* Glocke: zwei Schläge, je Grundton + unharmonische Obertöne, abklingend */
function playChime(){
  if(SETTINGS.alertSound===false)return;
  audioUnlock();if(!audioCtx)return;
  try{
    let t0=audioCtx.currentTime+0.02;
    [[0,880],[0.42,660]].forEach(([dt,f])=>{
      [[1,0.32],[2.76,0.12],[5.4,0.05]].forEach(([mul,vol])=>{
        let o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.type='sine';o.frequency.value=f*mul;
        g.gain.setValueAtTime(0.0001,t0+dt);g.gain.exponentialRampToValueAtTime(vol,t0+dt+0.012);
        g.gain.exponentialRampToValueAtTime(0.0001,t0+dt+(mul===1?1.6:0.7));
        o.connect(g);g.connect(audioCtx.destination);o.start(t0+dt);o.stop(t0+dt+1.7);
      });
    });
  }catch(e){}
}
function alertDone(){try{return JSON.parse(localStorage.getItem('timeless_alerted')||'{}');}catch(e){return{};}}
function alertSaveDone(m){try{localStorage.setItem('timeless_alerted',JSON.stringify(m));}catch(e){}}
let alertSnooze=[];
function alertLead(ev){
  let v=ev._plan?SETTINGS.alertPlan:ev.alertMin;
  if(v===undefined||v===null||v==='')return null;
  let n=parseInt(v);return isNaN(n)?null:Math.max(0,n);
}
/* fällige Hinweise ermitteln (now = Date, für Tests übergebbar) */
function alertDue(now){
  now=now||new Date();
  let out=[],done=alertDone(),nowMs=now.getTime();
  for(let k=0;k<2;k++){
    let dt=new Date(now.getFullYear(),now.getMonth(),now.getDate()+k),y=dt.getFullYear(),m=dt.getMonth(),d=dt.getDate(),ds=fmtDate(y,m,d);
    getEventsForDay(y,m,d).forEach(ev=>{
      if(!ev.time)return;
      let lead=alertLead(ev);if(lead===null)return;
      tgWindows(ev,y,m,d).forEach(([s0,e0])=>{
        let cont=isContDay(ev,ds)&&s0===0;
        let marks=[];
        if(!cont)marks.push({kind:'start',min:s0,at:new Date(y,m,d,0,s0-lead).getTime()});
        if(SETTINGS.alertEnd&&e0<1440&&(!ev.dateEnd||ev.dateEnd<=ds||tgIsSerie(ev)))marks.push({kind:'end',min:e0,at:new Date(y,m,d,0,e0).getTime()});
        marks.forEach(mk=>{
          let key=`${ev._key||ev.id}@${ds}@${mk.kind}@${mk.min}`;
          if(done[key])return;
          if(nowMs>=mk.at&&nowMs<=mk.at+(lead+10)*60000)out.push({key,ev,ds,s:s0,e:e0,kind:mk.kind,lead,at:mk.at});
        });
      });
    });
  }
  alertSnooze=alertSnooze.filter(z=>{if(nowMs>=z.until){out.push(Object.assign({},z.item,{snoozed:true}));return false;}return true;});
  return out;
}
function alertTick(){
  let due=alertDue();if(!due.length)return;
  let done=alertDone(),cut=Date.now()-3*86400000;
  Object.keys(done).forEach(k=>{if(done[k]<cut)delete done[k];});
  due.forEach(a=>{done[a.key]=Date.now();});
  alertSaveDone(done);
  due.forEach(a=>alertShow(a));
}
function alertText(a){
  let t=displayTitle(a.ev,...a.ds.split('-').map((x,i)=>+x-(i===1?1:0)));
  let when=a.kind==='end'?'endet jetzt':a.lead&&!a.snoozed&&Date.now()<a.at+a.lead*60000?`beginnt in ${Math.max(1,Math.round((a.at+a.lead*60000-Date.now())/60000))} Min.`:'beginnt jetzt';
  return{t,when,time:`${tgHM(a.s)}–${a.e>=1440?'24:00':tgHM(a.e)}`};
}

  if(document.hidden&&notifyEnabled()&&'Notification' in window&&Notification.permission==='granted'){
    try{new Notification('Timeless – '+tr(x.when),{body:`${x.t}\n${x.time}`,tag:a.key});}catch(e){}
  }
}

/* ===== V0.4: AUSFÜLLEN ÜBER MEHRERE TAGE =====
   Kopie eines Termins um delta Minuten versetzt. Serien liefern eine Kopie
   des Vorkommens vom Tag fromDs als Einzeltermin (wie Strg-Ziehen). */
function tgCopyFor(ev,fromDs,delta){
  let res=JSON.parse(JSON.stringify(ev));
  res.id=tgNewId();delete res.importUid;delete res.hidden;res.exdates=[];
  if(tgIsSerie(ev)){Object.assign(res,{date:fromDs,dateEnd:'',repeat:'none',repeatUntil:'',repeatCount:''});delete res.deathDate;}
  tgShift(res,delta);
  return res;
}
function tgApplyFill(id,fromDs,days){
  let ev=DB.events.find(e=>e.id===id);
  if(!ev||!tgMovable(ev)||!days.length)return null;
  pushUndo(`„${ev.title}" auf ${days.length} Tag${days.length>1?'e':''} kopiert`);
  let made=days.map(ds=>{let c=tgCopyFor(ev,fromDs,(tgDayNum(ds)-tgDayNum(fromDs))*1440);DB.events.push(c);return c;});
  saveDB();render();
  let clash=made.filter(c=>findConflict(c,c.id)).length;
  let names=days.map(ds=>dNames[plDow(ds)]).join(', ');
  showToast(`📄 „${ev.title}" kopiert nach ${names}${clash?` – ⚠️ an ${clash} Tag${clash>1?'en':''} Überschneidung`:''}`,true);
  return made;
}
function plFillItem(vid,days){
  let v=plParse(vid),p=plById(v.pid);if(!p)return null;
  let mon=plWeekOf(v.ds);
  if(plLocked(mon)){showToast('🔒 Vergangene Woche – erst „Diese Woche von Hand ändern" wählen',false);render();return null;}
  let eff=plWeekSlots(p,mon).find(x=>x.id===v.sid);if(!eff){render();return null;}
  let scope=plScopeFor(mon,eff),t=tplById(eff.tpl)||{title:'?'},n=0;
  pushUndo(`Grundplan: ${t.title} auf ${days.length} Tage kopiert`);
  days.forEach(ds=>{
    let m=plWeekOf(ds),wd=plDow(ds);
    if(plWeekSlots(p,m).some(x=>x.tpl===eff.tpl&&x.wd===wd&&x.start===eff.start))return; // schon vorhanden
    plAddSlot(p,m,{id:plUid(),tpl:eff.tpl,wd,start:eff.start,dur:eff.dur,note:eff.note||''},scope);n++;
  });
  saveDB();render();
  showToast(`🔁 ${t.title} an ${n} weiteren Tag${n===1?'':'en'} im Grundplan (${plScopeTxt(scope,mon)})`,true);
  return n;
}

/* ===== V0.4: AUSLASTUNG (HEATMAP) UND FREIE TERMINE =====
   Wie im Terminbuch: belegte Minuten innerhalb der Arbeitszeit, Lücken
   zerlegt in Stücke der üblichen Terminlänge. Grundplan-Einträge zählen mit. */
function heatCfg(){return SETTINGS.heat||{from:'08:00',to:'18:00',days:[1,2,3,4,5],slot:30,skipHol:true};}
function dayLoad(y,m,d){
  let H=heatCfg(),dow=new Date(y,m,d).getDay();
  if(!(H.days||[]).includes(dow))return{open:false};
  if(H.skipHol&&getHolidays(y)[`${m+1}-${d}`])return{open:false,hol:true};
  let a=toMin(H.from),b=toMin(H.to);if(b<=a)return{open:false};
  let iv=[];
  getEventsForDay(y,m,d).forEach(ev=>{if(!ev.time)return;tgWindows(ev,y,m,d).forEach(([s0,e0])=>{s0=Math.max(s0,a);e0=Math.min(e0,b);if(e0>s0)iv.push([s0,e0]);});});
  iv.sort((x,z)=>x[0]-z[0]);
  let merged=[];iv.forEach(x=>{let l=merged[merged.length-1];if(l&&x[0]<=l[1])l[1]=Math.max(l[1],x[1]);else merged.push([x[0],x[1]]);});
  let booked=0,gaps=[],cur=a;
  merged.forEach(x=>{booked+=x[1]-x[0];if(x[0]>cur)gaps.push([cur,x[0]]);cur=Math.max(cur,x[1]);});
  if(cur<b)gaps.push([cur,b]);
  let slot=Math.max(5,parseInt(H.slot)||30),free=0;gaps.forEach(g=>{free+=Math.floor((g[1]-g[0])/slot);});
  let open=b-a,lv=free===0?4:booked===0?0:booked/open<=1/3?1:booked/open<=2/3?2:3;
  return{open:true,a,b,booked,gaps,free,level:lv};
}
function heatLegend(){
  let H=heatCfg(),dn=(H.days||[]).slice().sort((x,z)=>((x+6)%7)-((z+6)%7)).map(x=>dNames[x]).join(' ');
  return`<div class="heat-legend"><span>Belegte Zeit je Tag (${dn}, ${H.from}–${H.to}):</span>${[['leer','hv0'],['bis ⅓','hv1'],['bis ⅔','hv2'],['über ⅔','hv3'],['voll','hv4']].map(x=>`<span class="k"><i class="${x[1]}"></i>${x[0]}</span>`).join('')}<button class="sb-btn" onclick="openSettingsModal()">Arbeitszeit ⚙️</button></div>`;
}
function heatToggle(){SETTINGS.heat.on=!SETTINGS.heat.on;saveSettings();render();}
/* nächste freie Zeiten ab Datum fromDs mit Mindestdauer dur */
function freeSlots(fromDs,dur,limit){
  let out=[],H=heatCfg(),step=Math.max(5,Math.min(dur,parseInt(H.slot)||30));
  let start=fromDs<fmtDate(today.getFullYear(),today.getMonth(),today.getDate())?fmtDate(today.getFullYear(),today.getMonth(),today.getDate()):fromDs;
  let dn=tgDayNum(start),todayS=fmtDate(today.getFullYear(),today.getMonth(),today.getDate());
  let x=new Date(),nowMin=x.getHours()*60+x.getMinutes();
  for(let i=0;i<540&&out.length<limit;i++){
    let ds=tgDayStr(dn+i),[y,m,d]=ds.split('-').map(Number),L=dayLoad(y,m-1,d);
    if(!L.open)continue;
    for(let g of L.gaps){
      for(let t=g[0];t+dur<=g[1]&&out.length<limit;t+=step){
        if(ds===todayS&&t<=nowMin)continue;
        out.push({ds,start:t});
      }
      if(out.length>=limit)break;
    }
  }
  return out;
}
let freeUI={dur:0,from:'',chip:0};

/* ===================== V0.3: VORLAGEN, GRUNDPLAN, FERIEN =====================
   Datenmodell (alles in DB, damit Undo, Sicherung und Datendatei es kennen):
   DB.templates = [{id,title,short,categoryId,color,dur,time,notes,deleted?}]
   DB.plans     = [{id,name,from,until,skipHolidays,skipFerien,hidden,
                    slots:[{id,tpl,wd,start,dur,note}],      // Grundplan
                    baseFrom,                                 // Woche der letzten Grundplan-Änderung
                    past:[{until:Montag,slots:[…]}],          // eingefrorene frühere Stände
                    weeks:{Montag:{mods:{slotId:null|{…}},extra:[…]}}}] // Abweichungen einer Woche
   DB.ferien    = [{id,name,from,to}]
   Grundplan-Einträge werden je Tag als „virtuelle" Termine erzeugt
   (Kennung pl:Plan:Eintrag:Datum) und laufen damit durch alle Ansichten.
   Wie in timetable: Ein geänderter Grundplan gilt ab der aktuellen Woche;
   frühere Wochen behalten ihren Stand (past) und sind zur Nachkontrolle
   gesperrt, bis sie ausdrücklich „von Hand" geändert werden. */
const FERIEN_SEED=[['Sommerferien','2026-07-04','2026-09-06'],['Herbstferien','2026-10-27','2026-10-31'],['Weihnachtsferien','2026-12-24','2027-01-06'],
  ['Semesterferien','2027-02-08','2027-02-13'],['Osterferien','2027-03-20','2027-03-29'],['Pfingstferien','2027-05-15','2027-05-17'],['Sommerferien','2027-07-03','2027-09-05']];
let plUI={brush:null,unlock:''};
function plUid(){return Date.now().toString(36).slice(-5)+Math.random().toString(36).slice(2,7);}
function ensureDBShape(){
  if(!Array.isArray(DB.templates))DB.templates=[];
  if(!Array.isArray(DB.plans))DB.plans=[];
  if(!Array.isArray(DB.ferien))DB.ferien=FERIEN_SEED.map(x=>({id:plUid(),name:x[0],from:x[1],to:x[2]}));
  DB.plans.forEach(p=>{p.slots=p.slots||[];p.past=p.past||[];p.weeks=p.weeks||{};});
}
function ferienOn(ds){let F=DB.ferien||[];for(let i=0;i<F.length;i++){let f=F[i];if(f.from&&f.to&&ds>=f.from&&ds<=f.to)return f;}return null;}
function tplById(id){return(DB.templates||[]).find(t=>t.id===id)||null;}
function plById(id){return(DB.plans||[]).find(p=>p.id===id)||null;}
function plDow(ds){let[y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d).getDay();}
function plWeekOf(ds){return tgDayStr(tgDayNum(ds)-((plDow(ds)+6)%7));}
/* „aktuelle" Woche: am Wochenende zählt schon die kommende (wie timetable) */
function plThisMon(){
  let ds=fmtDate(today.getFullYear(),today.getMonth(),today.getDate()),w=today.getDay(),mon=plWeekOf(ds);
  return(w===0||w===6)?tgDayStr(tgDayNum(mon)+7):mon;
}
function plIsPast(mon){return mon<plThisMon();}
function plLocked(mon){return plIsPast(mon)&&plUI.unlock!==mon;}
function plBase(p,mon){for(let x of p.past)if(mon<x.until)return x.slots;return p.slots;}
function plWeekSlots(p,mon){
  let w=p.weeks[mon],out=[];
  plBase(p,mon).forEach(sl=>{
    if(w&&w.mods&&Object.prototype.hasOwnProperty.call(w.mods,sl.id)){let m=w.mods[sl.id];if(m)out.push(Object.assign({},sl,m,{id:sl.id,_mod:true}));}
    else out.push(sl);
  });
  ((w&&w.extra)||[]).forEach(x=>out.push(Object.assign({},x,{_extra:true})));
  return out;
}
function plMake(p,sl,ds,mon){
  let t=tplById(sl.tpl);if(!t)return null;
  return{id:`pl:${p.id}:${sl.id}:${ds}`,_plan:p.id,_slot:sl.id,_mon:mon,_mod:!!(sl._mod||sl._extra),_extra:!!sl._extra,_key:`pl:${p.id}:${sl.id}`,
    categoryId:t.categoryId||'termin',title:sl.note?`${t.title} · ${sl.note}`:t.title,color:t.color||'',notes:t.notes||'',
    date:ds,time:tgHM(sl.start),timeEnd:tgHM(Math.min(sl.start+sl.dur,1439)),dateEnd:'',repeat:'none',displayType:'termin',exdates:[]};
}
function plOccurrences(y,m,d,inc){
  let ds=fmtDate(y,m,d),dow=new Date(y,m,d).getDay(),mon=plWeekOf(ds),out=[];
  let hol=getHolidays(y)[`${m+1}-${d}`],fer=ferienOn(ds);
  DB.plans.forEach(p=>{
    if(p.hidden&&inc!==true)return;
    if(p.from&&ds<p.from)return;
    if(p.until&&ds>p.until)return;
    if(p.skipHolidays&&hol)return;
    if(p.skipFerien&&fer)return;
    plWeekSlots(p,mon).forEach(sl=>{
      if(sl.wd!==dow)return;
      let v=plMake(p,sl,ds,mon);
      if(v&&(inc===true||inc==='vorschau'||!isEvOff(v)))out.push(v);
    });
  });
  return out.sort((a,b)=>a.time.localeCompare(b.time));
}
function plParse(vid){let x=String(vid).split(':');return{pid:x[1],sid:x[2],ds:x[3]};}
function plVirtual(vid){
  let v=plParse(vid),p=plById(v.pid);if(!p||!v.ds)return null;
  let mon=plWeekOf(v.ds),sl=plWeekSlots(p,mon).find(x=>x.id===v.sid);
  return sl?plMake(p,sl,v.ds,mon):null;
}
function plNew(){let m=plThisMon();return{id:plUid(),name:LANG==='en'?'Base plan':'Grundplan',from:m,until:'',skipHolidays:true,skipFerien:true,hidden:false,slots:[],past:[],weeks:{},baseFrom:m};}
function plCurrent(create){
  let p=plById(SETTINGS.planId)||DB.plans[0]||null;
  if(!p&&create){p=plNew();DB.plans.push(p);SETTINGS.planId=p.id;saveSettings();}
  return p;
}
/* Grundplan einfrieren, bevor er geändert wird: der bisherige Stand bleibt
   für alle Wochen VOR der aktuellen Woche gültig */
function plFreeze(p){
  let cur=plThisMon();
  if((p.baseFrom||'')<cur){
    if(p.slots.length||p.past.length)p.past.push({until:cur,slots:JSON.parse(JSON.stringify(p.slots))});
    p.baseFrom=cur;
  }
}
function plWeekObj(p,mon){let w=p.weeks[mon]=p.weeks[mon]||{};w.mods=w.mods||{};w.extra=w.extra||[];return w;}
function plTidy(p,mon){let w=p.weeks[mon];if(w&&!Object.keys(w.mods||{}).length&&!(w.extra||[]).length)delete p.weeks[mon];}
function plEditSlot(p,mon,sid,ch,scope){
  if(scope==='all'&&p.slots.some(x=>x.id===sid)){
    plFreeze(p);
    Object.assign(p.slots.find(x=>x.id===sid),ch);
    let w=p.weeks[mon];if(w&&w.mods&&Object.prototype.hasOwnProperty.call(w.mods,sid)){delete w.mods[sid];plTidy(p,mon);}
    return;
  }
  let w=plWeekObj(p,mon),x=w.extra.find(e=>e.id===sid);
  if(x){Object.assign(x,ch);return;}
  let b=plBase(p,mon).find(e=>e.id===sid);if(!b){plTidy(p,mon);return;}
  let cur=w.mods[sid]?w.mods[sid]:{wd:b.wd,start:b.start,dur:b.dur,tpl:b.tpl,note:b.note||''};
  let nm=Object.assign({},cur,ch);
  if(nm.wd===b.wd&&nm.start===b.start&&nm.dur===b.dur&&nm.tpl===b.tpl&&(nm.note||'')===(b.note||''))delete w.mods[sid];
  else w.mods[sid]=nm;
  plTidy(p,mon);
}
function plRemoveSlot(p,mon,sid,scope){
  if(scope==='all'&&p.slots.some(x=>x.id===sid)){
    plFreeze(p);
    p.slots=p.slots.filter(x=>x.id!==sid);
    let w=p.weeks[mon];if(w&&w.mods)delete w.mods[sid];plTidy(p,mon);
    return;
  }
  let w=plWeekObj(p,mon);
  if(w.extra.some(e=>e.id===sid))w.extra=w.extra.filter(e=>e.id!==sid);
  else w.mods[sid]=null;
  plTidy(p,mon);
}
function plAddSlot(p,mon,sl,scope){
  if(scope==='all'){plFreeze(p);p.slots.push(sl);if(mon<p.from)p.from=mon;}
  else plWeekObj(p,mon).extra.push(sl);
}
function plScopeFor(mon,sl){return(plIsPast(mon)||(sl&&sl._extra))?'week':(SETTINGS.plScope==='week'?'week':'all');}
function plScopeTxt(scope,mon){return scope==='all'?`alle Wochen ab KW ${getISOWeek(parseDate(plThisMon()))}`:`nur KW ${getISOWeek(parseDate(mon))}`;}
function plMoveItem(vid,toDs,newS,copy){
  let v=plParse(vid),p=plById(v.pid);if(!p)return null;
  let mon=plWeekOf(v.ds),tmon=plWeekOf(toDs);
  if(plLocked(mon)||plLocked(tmon)){showToast('🔒 Vergangene Woche – erst „Diese Woche von Hand ändern" wählen',false);return null;}
  let eff=plWeekSlots(p,mon).find(x=>x.id===v.sid);if(!eff)return null;
  let wd=plDow(toDs),scope=plScopeFor(mon,eff),t=tplById(eff.tpl)||{title:'?'};
  if(!copy&&toDs===v.ds&&newS===eff.start)return null;
  pushUndo(`Grundplan: ${t.title} ${copy?'kopiert':'verschoben'}`);
  if(copy)plAddSlot(p,tmon,{id:plUid(),tpl:eff.tpl,wd,start:newS,dur:eff.dur,note:eff.note||''},plIsPast(tmon)?'week':scope);
  else if(scope==='all')plEditSlot(p,mon,v.sid,{wd,start:newS},'all');
  else if(mon===tmon)plEditSlot(p,mon,v.sid,{wd,start:newS},'week');
  else{plRemoveSlot(p,mon,v.sid,'week');plAddSlot(p,tmon,{id:plUid(),tpl:eff.tpl,wd,start:newS,dur:eff.dur,note:eff.note||''},'week');}
  saveDB();render();
  showToast(`🔁 ${t.title} → ${dNamesLong[wd]} ${tgHM(newS)} (${plScopeTxt(copy&&plIsPast(tmon)?'week':scope,tmon)})`,true);
  return true;
}
function plResizeItem(vid,newE){
  let v=plParse(vid),p=plById(v.pid);if(!p)return null;
  let mon=plWeekOf(v.ds);if(plLocked(mon))return null;
  let eff=plWeekSlots(p,mon).find(x=>x.id===v.sid);if(!eff)return null;
  let dur=Math.max(TG_SNAP,Math.min(newE,1440)-eff.start);
  if(dur===eff.dur)return null;
  let scope=plScopeFor(mon,eff),t=tplById(eff.tpl)||{title:'?'};
  pushUndo(`Grundplan: Dauer ${t.title}`);
  plEditSlot(p,mon,v.sid,{dur},scope);
  saveDB();render();

function plBanner(ws){
  let mon=fmtDate(ws.getFullYear(),ws.getMonth(),ws.getDate()),sun=tgDayStr(tgDayNum(mon)+6);
  let act=(DB.plans||[]).filter(p=>!p.hidden&&(!p.from||p.from<=sun)&&(!p.until||p.until>=mon));
  if(!act.length)return'';

  act.forEach(p=>{let w=p.weeks[mon];if(w)n+=Object.keys(w.mods||{}).length+(w.extra||[]).length;});
  let past=plIsPast(mon),locked=plLocked(mon),h='';

  }else{

  }

  return`<div class="pl-banner${past?' past':''}${!past&&SETTINGS.plScope==='week'?' wk':''}">${h}</div>`;

/* ----- Vorlagen platzieren ----- */
function evDefaults(){return{categoryId:'termin',title:'',notes:'',date:'',time:'',dateEnd:'',timeEnd:'',reminder:0,color:'',textColor:'',chipStyle:'',
  repeat:'none',repeatInterval:'1',repeatUnit:'jahre',repeatOrd:'first',repeatWd:'1',repeatMonth:'',repeatUntil:'',repeatCount:'',
  skipHolidays:false,exdates:[],wdMask:'1111111',moMask:'111111111111',relative:'',offset:0,displayType:'termin',deathDate:''};}
/* start: Minute, oder null = übliche Uhrzeit der Vorlage bzw. ganztägig */
function tplPlace(id,ds,start,opt){
  let t=tplById(id);if(!t)return null;
  opt=opt||{};
  if(start===null&&!opt.allDay&&t.time)start=toMin(t.time);
  let dur=Math.max(5,parseInt(t.dur)||60);
  if((SETTINGS.tplTarget||'event')==='plan'){
    if(start===null)start=t.time?toMin(t.time):480;
    let mon=plWeekOf(ds);
    if(plLocked(mon)){showToast('🔒 Vergangene Woche – erst „Diese Woche von Hand ändern" wählen',false);render();return null;}
    let scope=plIsPast(mon)?'week':(SETTINGS.plScope==='week'?'week':'all');
    pushUndo(`Grundplan: ${t.title} eingefügt`);
    let p=plCurrent(true);
    let sl={id:plUid(),tpl:id,wd:plDow(ds),start,dur:Math.min(dur,1440-start),note:''};
    plAddSlot(p,mon,sl,scope);
    saveDB();render();
    showToast(`🔁 ${t.title} im Grundplan „${p.name}": ${dNamesLong[sl.wd]} ${tgHM(start)} (${plScopeTxt(scope,mon)})`,true);
    return sl;
  }
  let ev=Object.assign(evDefaults(),{id:tgNewId(),categoryId:t.categoryId||'termin',title:t.title,notes:t.notes||'',date:ds,color:t.color||''});
  if(start!==null){ev.time=tgHM(start);ev.timeEnd=tgHM(Math.min(start+dur,1439));}
  pushUndo(`Termin aus Vorlage: ${t.title}`);
  DB.events.push(ev);saveDB();render();
  showToast(`⭐ ${t.title} am ${fmtDisp(ds)}${ev.time?' '+ev.time+'–'+ev.timeEnd:' (ganztägig)'}${conflictSuffix(ev)}`,true);
  if(start!==null)tgOfferPush(ev);
  return ev;
}
function tgAdClick(e,el,ds){

function tplFromEvent(id){

/* ----- Vorlagen ziehen (Maus/Stift; am Handy: antippen = Pinsel) ----- */
let tplDrag=null;
function tplDragClear(){
  let d=tplDrag;if(!d)return;
  if(d.float)d.float.remove();if(d.ghost)d.ghost.remove();
  document.querySelectorAll('.drop-hi').forEach(x=>x.classList.remove('drop-hi'));
  document.body.classList.remove('tg-dragging');
}
document.addEventListener('pointerdown',e=>{
  let c=e.target.closest&&e.target.closest('.tpl-chip');
  if(!c||e.button!==0||e.pointerType==='touch')return;
  tplDrag={id:c.dataset.tpl,x0:e.clientX,y0:e.clientY,active:false};
  document.addEventListener('pointermove',tplMove);document.addEventListener('pointerup',tplUp);
});
function tplMove(e){
  let d=tplDrag;if(!d)return;
  if(!d.active){
    if(Math.hypot(e.clientX-d.x0,e.clientY-d.y0)<5)return;
    d.active=true;document.body.classList.add('tg-dragging');
    let t=tplById(d.id);
    d.float=document.createElement('div');d.float.className='tpl-float';d.float.textContent='⭐ '+(t?t.title:'');
    document.body.appendChild(d.float);
  }
  e.preventDefault();
  d.float.style.left=(e.clientX+12)+'px';d.float.style.top=(e.clientY+10)+'px';
  document.querySelectorAll('.drop-hi').forEach(x=>x.classList.remove('drop-hi'));
  d.target=null;
  let el=document.elementFromPoint(e.clientX,e.clientY);
  let col=el&&el.closest&&el.closest('.tg-col'),ad=el&&el.closest&&el.closest('.tg-adc'),td=el&&el.closest&&el.closest('#calGrid td[data-ds]');
  if(col){
    let t=tplById(d.id),dur=Math.max(5,parseInt(t&&t.dur)||60),hh=tgHourPx();
    let st=Math.max(0,Math.min(tgSnap(tgMinIn(col,e.clientY)),1440-Math.min(dur,1425)));
    if(!d.ghost){d.ghost=document.createElement('div');d.ghost.className='tg-ev ghost';d.ghost.innerHTML='<span class="n"></span><span class="t"></span>';}
    let c=(t&&(t.color||getCat(t.categoryId).color))||'#1c5cab';
    d.ghost.style.cssText=`left:2px;width:calc(100% - 6px);z-index:70;top:${st/60*hh+1}px;height:${Math.max(dur/60*hh,18)-2}px;background:${tgColors(c).bg};border-left-color:${tgColors(c).bd}`;
    d.ghost.querySelector('.n').textContent=t?t.title:'';tgLabel(d.ghost,st,st+dur);
    if(d.ghost.parentNode!==col)col.appendChild(d.ghost);
    d.target={ds:col.dataset.ds,start:st};
    if(tgDrag===null){let body=col.closest('.tg-body');if(body){let r=body.getBoundingClientRect();if(e.clientY<r.top+36)body.scrollTop-=14;else if(e.clientY>r.bottom-36)body.scrollTop+=14;}}
  }else{
    if(d.ghost&&d.ghost.parentNode)d.ghost.remove();
    if(ad){ad.classList.add('drop-hi');d.target={ds:ad.closest('.tg-ad')?tplAdDate(ad):'',start:null,allDay:true};}
    else if(td){td.classList.add('drop-hi');d.target={ds:td.dataset.ds,start:null};}
  }
}
function tplAdDate(ad){let cells=[...ad.parentNode.querySelectorAll('.tg-adc')],i=cells.indexOf(ad);let cols=[...ad.closest('.tg').querySelectorAll('.tg-col')];return cols[i]?cols[i].dataset.ds:'';}
function tplUp(e){
  let d=tplDrag;document.removeEventListener('pointermove',tplMove);document.removeEventListener('pointerup',tplUp);
  if(!d)return;tplDragClear();tplDrag=null;
  if(!d.active)return; // einfacher Klick -> onclick (Pinsel)
  tgJustDragged=Date.now();
  if(d.target&&d.target.ds)tplPlace(d.id,d.target.ds,d.target.start,{allDay:!!d.target.allDay});
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&tplDrag){tplDragClear();tplDrag=null;document.removeEventListener('pointermove',tplMove);document.removeEventListener('pointerup',tplUp);tgJustDragged=Date.now();}});

function tplSave(){

function tplUses(id){
  let n=0;
  DB.plans.forEach(p=>{
    p.slots.forEach(x=>{if(x.tpl===id)n++;});
    p.past.forEach(x=>x.slots.forEach(y=>{if(y.tpl===id)n++;}));
    Object.values(p.weeks).forEach(w=>{(w.extra||[]).forEach(y=>{if(y.tpl===id)n++;});Object.values(w.mods||{}).forEach(y=>{if(y&&y.tpl===id)n++;});});
  });
  return n;
}
function tplDelete(id){
  let t=tplById(id);if(!t)return;
  let used=tplUses(id);
  if(!confirm(`Vorlage „${t.title}" löschen?`+(used?`\n\nSie wird im Grundplan verwendet: Ab der aktuellen Woche verschwinden diese Einträge, vergangene Wochen behalten sie zur Nachkontrolle.`:'')))return;
  pushUndo('Vorlage gelöscht: '+t.title);
  if(used){
    t.deleted=true;
    let cur=plThisMon();
    DB.plans.forEach(p=>{
      if(p.slots.some(x=>x.tpl===id)){plFreeze(p);p.slots=p.slots.filter(x=>x.tpl!==id);}
      Object.keys(p.weeks).forEach(m=>{if(m>=cur){let w=p.weeks[m];w.extra=(w.extra||[]).filter(x=>x.tpl!==id);plTidy(p,m);}});
    });
  }else DB.templates=DB.templates.filter(x=>x.id!==id);
  if(plUI.brush===id)plUI.brush=null;
  if(editTplId===id)editTplId='';
  saveDB();render();renderTplModal();
}

function plItemSave(vid,scope){
  let v=plParse(vid),p=plById(v.pid),mon=plWeekOf(v.ds);
  let st=toMin(document.getElementById('piS').value||'00:00'),en=toMin(document.getElementById('piE').value||'00:00');
  if(en<=st){alert('Das Ende muss nach dem Beginn liegen.');return;}
  let note=document.getElementById('piN').value.trim();
  pushUndo('Grundplan-Eintrag geändert');
  plEditSlot(p,mon,v.sid,{start:st,dur:en-st,note},scope);
  saveDB();closeModal();render();
  showToast(`🔁 Geändert (${plScopeTxt(scope,mon)})`,true);
}
function plItemDelete(vid,scope){
  let v=plParse(vid),p=plById(v.pid),mon=plWeekOf(v.ds);
  if(scope==='all'&&!confirm('Eintrag aus dem Grundplan löschen?\nAb der aktuellen Woche fällt er weg, vergangene Wochen behalten ihn.'))return;
  pushUndo('Grundplan-Eintrag entfernt');
  plRemoveSlot(p,mon,v.sid,scope);
  saveDB();closeModal();render();
  showToast(`🗑 Entfernt (${plScopeTxt(scope,mon)})`,true);
}
function plItemRestore(vid){
  let v=plParse(vid),p=plById(v.pid),mon=plWeekOf(v.ds),w=p.weeks[mon];
  if(!w||!w.mods)return;
  pushUndo('Grundplan-Stand wiederhergestellt');
  delete w.mods[v.sid];plTidy(p,mon);
  saveDB();closeModal();render();
}
function plItemMenu(e,vid){
  let v=plParse(vid),p=plById(v.pid);if(!p)return;
  let mon=plWeekOf(v.ds),eff=plWeekSlots(p,mon).find(x=>x.id===v.sid);if(!eff)return;
  let past=plIsPast(mon),items=[
    {label:'✏️ Bearbeiten',action:()=>openPlanItemModal(vid)},
    {label:'📄 Als Einzeltermin kopieren',action:()=>copyEvent(vid)},
    {label:'⭐ Vorlage bearbeiten',action:()=>openTplModal(eff.tpl)},
    null,
    {label:`🗑 Nur in KW ${getISOWeek(parseDate(mon))} entfernen`,action:()=>plItemDelete(vid,'week')}];
  if(!past&&!eff._extra)items.push({label:'🗑 Aus dem Grundplan löschen',action:()=>plItemDelete(vid,'all')});
  showCtxMenu(e.clientX,e.clientY,items);
}
function openPlanModal(){
  let p=plCurrent(false);
  if(!p){plCreate();return;}
  editingId=null;openOverlay();
  document.getElementById('modalTabs').style.display='none';
  document.getElementById('modalTitle').textContent='🔁 Grundplan';
  let sel=DB.plans.length>1?`<div class="form-row"><label>Plan</label><select onchange="plSelect(this.value);openPlanModal()">${DB.plans.map(x=>`<option value="${x.id}" ${x===p?'selected':''}>${escHtml(x.name)}</option>`).join('')}</select></div>`:'';
  let nw=Object.keys(p.weeks).length;
  document.getElementById('modalBody').innerHTML=sel+`
    <div class="form-row"><label>Name</label><input id="pmName" maxlength="60" value="${escAttr(p.name)}"></div>
    <div class="form-grid">
      <div class="form-row"><label>Gilt ab</label><input type="date" id="pmFrom" value="${p.from||''}"></div>
      <div class="form-row"><label>Bis (optional)</label><input type="date" id="pmUntil" value="${p.until||''}"></div>
    </div>
    <label class="rep-opt"><input type="checkbox" id="pmHol" ${p.skipHolidays?'checked':''}> <span>An Feiertagen aussetzen</span></label>
    <label class="rep-opt" style="margin-top:6px"><input type="checkbox" id="pmFer" ${p.skipFerien?'checked':''}> <span>In den Ferien aussetzen</span></label>
    <p style="font-size:12px;color:var(--muted);margin-top:12px">${p.slots.length} Einträge im Grundplan · ${nw} Woche${nw===1?'':'n'} mit eigenen Änderungen · ${p.past.length} gesicherte frühere Stände.<br>Einträge kommen aus den Vorlagen der Seitenleiste („ablegen als: Grundplan").</p>`;
  document.getElementById('modalFooter').innerHTML=`<button class="btn-del" onclick="plDeletePlan()">Plan löschen</button><button class="btn-share" onclick="closeModal();plCreate()">+ Neuer Plan</button><div style="flex:1"></div><button class="btn-cancel" onclick="closeModal()">Abbrechen</button><button class="btn-ok" onclick="plSavePlan()">Übernehmen</button>`;
}
function plSavePlan(){
  let p=plCurrent(false);if(!p)return;
  let g=id=>document.getElementById(id),from=g('pmFrom').value,until=g('pmUntil').value;
  if(until&&from&&until<from){alert('„Bis" liegt vor „Gilt ab".');return;}
  pushUndo('Grundplan-Einstellungen');
  Object.assign(p,{name:g('pmName').value.trim()||'Grundplan',from,until,skipHolidays:g('pmHol').checked,skipFerien:g('pmFer').checked});
  saveDB();closeModal();render();
}
function plDeletePlan(){
  let p=plCurrent(false);if(!p)return;
  if(!confirm(`Grundplan „${p.name}" mit allen Einträgen und Wochenänderungen löschen?\n(Über Rückgängig wiederherstellbar.)`))return;
  pushUndo('Grundplan gelöscht: '+p.name);
  DB.plans=DB.plans.filter(x=>x!==p);SETTINGS.planId='';saveSettings();
  saveDB();closeModal();render();
}
let ferWork=[];
function openFerienModal(){
  ensureDBShape();ferWork=JSON.parse(JSON.stringify(DB.ferien));
  editingId=null;openOverlay();
  document.getElementById('modalTabs').style.display='none';
  document.getElementById('modalTitle').textContent='🏖️ Ferien und schulfreie Tage';
  renderFerienModal();
  document.getElementById('modalFooter').innerHTML=`<button class="btn-cancel" onclick="closeModal()">Abbrechen</button><button class="btn-ok" onclick="ferSave()">Übernehmen</button>`;
}
function renderFerienModal(){
  ferWork.sort((a,b)=>(a.from||'').localeCompare(b.from||''));
  let y0=today.getMonth()>=8?today.getFullYear():today.getFullYear()-1,opts='';
  for(let y=y0;y<=y0+4;y++)opts+=`<option value="${y}" ${y===y0+1?'selected':''}>${y}/${String(y+1).slice(2)}</option>`;
  document.getElementById('modalBody').innerHTML=`
    <p style="font-size:12px;color:var(--muted);margin-bottom:10px">Vorgabe: Burgenland laut Bildungsministerium, Schuljahr 2026/27. Schulautonome Tage selbst eintragen. Grundpläne setzen in den Ferien aus (abschaltbar je Plan).</p>
    <div style="display:grid;gap:6px">${ferWork.map((f,i)=>`<div class="fer-row"><input value="${escAttr(f.name)}" maxlength="40" onchange="ferWork[${i}].name=this.value" aria-label="Bezeichnung"><input type="date" value="${f.from}" onchange="ferWork[${i}].from=this.value" aria-label="von"><input type="date" value="${f.to}" onchange="ferWork[${i}].to=this.value" aria-label="bis"><button onclick="ferWork.splice(${i},1);renderFerienModal()" title="Entfernen">×</button></div>`).join('')||'<p style="font-size:12px;color:var(--muted)">Keine Einträge.</p>'}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px">
      <button class="btn-cancel" onclick="let t=fmtDate(today.getFullYear(),today.getMonth(),today.getDate());ferWork.push({id:plUid(),name:'Schulautonom frei',from:t,to:t});renderFerienModal()">+ Eintrag</button>
      <span style="font-size:12px;color:var(--muted)">Schuljahr</span><select id="ferY">${opts}</select>
      <button class="btn-cancel" onclick="ferCalc()">Ferien berechnen</button>
    </div>
    <p id="ferMsg" style="font-size:12px;color:var(--muted);margin-top:6px"></p>
    <label class="rep-opt" style="margin-top:8px"><input type="checkbox" id="ferShow" ${SETTINGS.showFerien!==false?'checked':''}> <span>Ferien im Kalender anzeigen</span></label>`;
}
/* Ferien nach dem Schulzeitgesetz (Osten) – Semesterferien wechseln jährlich und werden nicht berechnet */
function ferCalc(){
  let Y=parseInt(document.getElementById('ferY').value),e=getEaster(Y+1);
  let add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return fmtDate(x.getFullYear(),x.getMonth(),x.getDate());};
  let s=new Date(Y+1,5,28);while(s.getDay()!==6)s.setDate(s.getDate()+1);
  let L=[['Herbstferien',`${Y}-10-27`,`${Y}-10-31`],['Weihnachtsferien',`${Y}-12-24`,`${Y+1}-01-06`],['Osterferien',add(e,-8),add(e,1)],['Pfingstferien',add(e,48),add(e,50)],['Sommerferien',add(s,0),add(s,64)]];
  let n=0;L.forEach(x=>{if(!ferWork.some(f=>f.name===x[0]&&f.from===x[1])){ferWork.push({id:plUid(),name:x[0],from:x[1],to:x[2]});n++;}});
  let show=document.getElementById('ferShow').checked;
  renderFerienModal();document.getElementById('ferShow').checked=show;
  document.getElementById('ferMsg').textContent=n?`${n} Einträge für ${Y}/${String(Y+1).slice(2)} berechnet. Semesterferien bitte selbst eintragen.`:'Für dieses Schuljahr ist schon alles eingetragen.';
}
function ferSave(){
  let bad=ferWork.find(f=>!f.from||!f.to);
  if(bad){alert(`Bei „${bad.name}" fehlt ein Datum.`);return;}
  ferWork.forEach(f=>{if(f.to<f.from){let x=f.from;f.from=f.to;f.to=x;}});
  pushUndo('Ferien geändert');
  DB.ferien=ferWork;SETTINGS.showFerien=document.getElementById('ferShow').checked;saveSettings();
  saveDB();closeModal();render();
}

/* ===== DATENDATEI (TIMELESS V0.1, übernommen aus timetable) =====
   Chrome/Edge: Der ganze Kalender wird nach jeder Änderung von selbst in
   eine JSON-Datei geschrieben (Format wie das JSON-Backup) und beim Start
   daraus gelesen. Jeder gespeicherte Stand trägt eine Kennung (DB.stamp);
   weicht die Datei vom Browser ab, wird NICHT überschrieben, sondern
   gefragt, welcher Stand gelten soll. Der Datei-Griff liegt in IndexedDB,
   der Browser fragt je Sitzung einmal nach der Erlaubnis. */
const fsOK=typeof window.showSaveFilePicker==='function'&&typeof window.showOpenFilePicker==='function'&&!!window.indexedDB&&(function(){try{return window.self===window.top;}catch(e){return false;}})();
const SYNCKEY='timeless_sync';
function noData(err){return{h:null,ready:false,need:false,err:err||'',sync:'',savedAt:null,conflict:null,busy:false,again:false};}
let dataFile=noData(),dataT=0;
function idb(mode,fn){
  return new Promise((res,rej)=>{
    let r=indexedDB.open('timeless',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onerror=()=>rej(r.error);
    r.onsuccess=()=>{let db=r.result;try{let tx=db.transaction('kv',mode),q=fn(tx.objectStore('kv'));tx.oncomplete=()=>{db.close();res(q&&q.result);};tx.onerror=()=>{db.close();rej(tx.error);};}catch(e){db.close();rej(e);}};
  });
}
function readSync(){try{return localStorage.getItem(SYNCKEY)||'';}catch(e){return'';}}
function setSync(v){dataFile.sync=v;try{localStorage.setItem(SYNCKEY,v);}catch(e){}}
function dbValid(o){return o&&typeof o==='object'&&Array.isArray(o.events)&&Array.isArray(o.categories);}
function fileStamp(o){return o&&typeof o.stamp==='string'?o.stamp:'';}
function dataJSON(){return JSON.stringify({app:'Timeless',version:APP_VERSION,savedAt:new Date().toISOString(),stamp:DB.stamp||'',categories:DB.categories,events:DB.events,templates:DB.templates||[],plans:DB.plans||[],ferien:DB.ferien||[]},null,1);}
function readDataFile(){
  return dataFile.h.getFile().then(f=>f.text().then(t=>{
    if(!t.trim())return{o:null,mtime:f.lastModified};
    let o=null;try{o=JSON.parse(t);}catch(e){}
    if(!dbValid(o))throw new Error('format');
    return{o,mtime:f.lastModified};
  }));
}
function writeDataRaw(){
  let d=dataFile;
  if(!DB.stamp){DB.stamp=newStamp();try{localStorage.setItem(DBKEY,JSON.stringify(DB));}catch(e){}}
  let j=dataJSON(),st=DB.stamp;
  return d.h.createWritable().then(w=>w.write(j).then(()=>w.close())).then(()=>{if(dataFile===d){setSync(st);d.savedAt=new Date();d.err='';}});
}
function adoptFile(o){
  DB={categories:o.categories,events:o.events,templates:o.templates||[],plans:o.plans||[],ferien:Array.isArray(o.ferien)?o.ferien:undefined,stamp:fileStamp(o)};ensureDBShape();
  try{localStorage.setItem(DBKEY,JSON.stringify(DB));}catch(e){}
  setSync(DB.stamp);dataFile.savedAt=null;evCacheClear();render();
}
/* Abgleich beim Verbinden und bei jedem Start */
function syncData(){
  let d=dataFile;
  return readDataFile().then(r=>{
    d.ready=true;d.need=false;d.err='';d.conflict=null;
    let o=r.o;if(!o)return writeDataRaw();                     // leere Datei -> Stand hineinschreiben
    let fs=fileStamp(o);
    if(fs&&fs===DB.stamp){setSync(fs);return;}                  // gleich
    if(d.sync&&fs===d.sync)return writeDataRaw();               // nur hier geändert -> Datei nachziehen
    if((d.sync&&DB.stamp===d.sync)||!DB.events.length){adoptFile(o);return;} // nur Datei geändert / hier leer
    d.conflict={n:o.events.length,mtime:r.mtime};               // beide geändert -> fragen
  });
}
function queueData(){if(!dataFile.h||!dataFile.ready||dataFile.conflict)return;clearTimeout(dataT);dataT=setTimeout(flushData,350);}
function flushData(){
  let d=dataFile;if(!d.h||!d.ready||d.conflict)return;
  if(d.busy){d.again=true;return;}
  if(DB.stamp===d.sync)return;
  d.busy=true;
  readDataFile().then(r=>{
    if(r.o&&fileStamp(r.o)!==d.sync){d.conflict={n:r.o.events.length,mtime:r.mtime};return;}
    return writeDataRaw();
  }).then(null,e=>{
    let n=e&&e.name;
    if(n==='NotAllowedError'){d.need=true;d.err='';}
    else if(e&&e.message==='format')d.err='Die Datei enthält keine gültigen Kalenderdaten mehr – es wird nicht hineingeschrieben.';
    else if(n==='NotFoundError')d.err='Datei nicht gefunden (verschoben oder gelöscht?). Die Änderungen liegen im Browser.';
    else d.err='Datei ließ sich nicht schreiben. Die Änderungen liegen im Browser und werden nachgetragen.';
  }).then(()=>{d.busy=false;if(dataFile===d)dataStatus();if(d.again){d.again=false;flushData();}});
}
function fmtClock(d){return[d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');}
function dataStatus(){
  let d=dataFile,h=d.h,g=id=>document.getElementById(id),txt,bar='',btns='';
  if(!g('dataTxt'))return;
  g('btnDataNew').hidden=g('btnDataOpen').hidden=!fsOK||!!h;
  g('btnDataUnlink').hidden=!h;g('btnDataGrant').hidden=!(h&&d.need);
  if(!fsOK)txt='Automatisches Speichern in eine Datei gibt es nur mit Chrome oder Edge. Hier liegt alles im Browser – Sicherung über „ICS ↕".';
  else if(!h)txt=d.err||'Keine Datendatei. Mit einer Datei wird jede Änderung von selbst gespeichert (PC, USB-Stick, NAS).';
  else if(d.need)txt=h.name+': '+(d.err||'Erlaubnis für diese Sitzung fehlt.');
  else if(d.conflict)txt=h.name+': abweichender Stand – Speichern angehalten.';
  else if(d.err)txt=h.name+': '+d.err;
  else txt=h.name+(d.savedAt?' · gespeichert '+fmtClock(d.savedAt):' · aktuell');
  g('dataTxt').textContent=txt;g('dataTxt').classList.toggle('bad',!!h&&!!(d.need||d.conflict||d.err));
  if(h&&d.need){
    bar=`Datendatei ${h.name}: Der Browser verlangt für diese Sitzung die Erlaubnis zum Lesen und Schreiben.`;
    btns='<button class="sb-btn pri" onclick="grantData()">Zugriff erlauben</button>';
  }else if(h&&d.conflict){
    let when=new Date(d.conflict.mtime);
    bar=`Die Datendatei ${h.name} enthält einen anderen Stand (${d.conflict.n} Termine, geändert ${when.toLocaleString('de-AT')}) als dieser Browser (${DB.events.length} Termine). Welcher Stand soll gelten?`;
    btns='<button class="sb-btn pri" onclick="dataTake()">Stand aus der Datei laden</button><button class="sb-btn" onclick="dataPush()">Datei mit Stand hier überschreiben</button>';
  }
  g('dataBar').hidden=!bar;g('dataBarTxt').textContent=bar;g('dataBarBtns').innerHTML=btns;
}
function dataFail(e){
  dataFile.err=e&&e.message==='format'?'Die Datei enthält keine gültigen Kalenderdaten – es wird nicht hineingeschrieben.':'Die Datei ließ sich nicht lesen (Laufwerk nicht erreichbar?).';
  dataFile.need=true;dataStatus();
}
function connectData(h,ok){
  dataFile=noData();dataFile.h=h;setSync('');
  return idb('readwrite',st=>st.put(h,'data')).catch(()=>{}).then(()=>{if(!ok){dataFile.need=true;return;}return syncData();});
}
function linkData(open){
  let types=[{description:'Timeless-Daten (JSON)',accept:{'application/json':['.json']}}];
  let pick=open
    ?window.showOpenFilePicker({id:'timeless',types}).then(a=>{let h=a[0];return h.requestPermission({mode:'readwrite'}).then(pm=>({h,ok:pm==='granted'}));})
    :window.showSaveFilePicker({id:'timeless',suggestedName:'timeless-daten.json',types}).then(h=>({h,ok:true}));
  pick.then(x=>connectData(x.h,x.ok)).then(dataStatus,e=>{
    if(e&&e.name==='AbortError')return;
    dataFile=noData(e&&e.message==='format'?'Die gewählte Datei enthält keinen Kalender – sie wurde nicht verändert.':'Die Datei ließ sich nicht verbinden.');
    idb('readwrite',st=>st.delete('data')).catch(()=>{});dataStatus();
  });
}
function grantData(){
  let h=dataFile.h;if(!h)return;dataFile.err='';
  h.requestPermission({mode:'readwrite'}).then(pm=>{if(pm==='granted')return syncData();}).then(dataStatus,dataFail);
}
function unlinkData(){
  if(!confirm('Verbindung zur Datendatei trennen?\nDie Datei bleibt erhalten, es wird nur nicht mehr hineingeschrieben.'))return;
  dataFile=noData();setSync('');idb('readwrite',st=>st.delete('data')).catch(()=>{});dataStatus();
}
function dataTake(){
  let d=dataFile;if(!d.h)return;
  readDataFile().then(r=>{if(!r.o)throw new Error('leer');pushUndo('Stand aus der Datendatei geladen');d.conflict=null;adoptFile(r.o);showToast('📂 Stand aus der Datendatei geladen',true);}).then(dataStatus,dataFail);
}
function dataPush(){
  let d=dataFile;if(!d.h)return;d.conflict=null;
  writeDataRaw().then(dataStatus,()=>{d.err='Die Datei ließ sich nicht schreiben.';dataStatus();});
}
function initData(){
  dataStatus();if(!fsOK)return;
  idb('readonly',st=>st.get('data')).then(h=>{
    if(!h)return;dataFile.h=h;dataFile.sync=readSync();
    return h.queryPermission({mode:'readwrite'}).then(pm=>{if(pm==='granted')return syncData();dataFile.need=true;});
  }).then(dataStatus,dataFail);
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){clearTimeout(dataT);flushData();}});

loadSettings();
i18nInit(); // V1.0: Sprache
applyTheme();
setView('monat');
document.getElementById('verBadge').textContent='V'+APP_VERSION;
updateBell();
updateUndoBtn(); // V3.0 (Punkt 1)
initData();     // V0.1: Datendatei
if(migratedFromECP)setTimeout(()=>showToast(`📥 Willkommen bei Timeless – ${DB.events.length} Termine aus Endless Calendar Pro übernommen (dort bleibt alles unverändert)`,false),300);
(function backupHint(){
  try{
    if(!storageOK||DB.events.length<5)return;
    let last=localStorage.getItem('timeless_lastBackup');
    let days=last?Math.floor((Date.now()-new Date(last))/86400000):999;
    if(days>14)document.getElementById('infoBar').innerHTML=
      `<span class="warn-txt">💾 Letztes Backup ${last?'vor '+days+' Tagen':'noch nie'} – über „ICS ↕" sichern!</span>`;
  }catch(e){}
})();
setTimeout(checkReminders,1500);       // kurz nach dem Start
setInterval(()=>{refreshToday();checkReminders();tgUpdateNow();},60000);
setInterval(alertTick,15000);setTimeout(alertTick,2500); // V0.6: Hinweise mit Klang // jede Minute: Datumswechsel erkennen + Erinnerungen (solange Seite offen)
</script>
